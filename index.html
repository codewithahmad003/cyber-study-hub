<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Study Hub — Ultimate Cybersecurity Master Blueprint 2026-2027</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4l24 9v17c0 15-10 26-24 30C18 56 8 45 8 30V13z' fill='%2322d3ee'/%3E%3Cpath d='M22 32l7 7 13-14' stroke='%230b1020' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#070b18;--bg2:#0b1124;--panel:#0f1730;--panel2:#141e3c;--panel3:#1a2650;--border:#22305a;--border2:#2d3d70;
  --text:#e7ecff;--muted:#93a0c6;--dim:#6b7aa6;
  --accent:#22d3ee;--accent2:#8b5cf6;--accent3:#34d399;--warn:#fbbf24;--bad:#f87171;--pink:#f472b6;
  --grad:linear-gradient(135deg,#22d3ee 0%,#8b5cf6 100%);
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  --radius:16px;--side:264px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
html[data-theme="light"]{
  --bg:#f4f6fc;--bg2:#eef1fa;--panel:#ffffff;--panel2:#f6f8fe;--panel3:#eef2ff;--border:#dfe5f3;--border2:#cbd4ea;
  --text:#121a33;--muted:#55628a;--dim:#7c88aa;--shadow:0 10px 30px -18px rgba(30,40,90,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.16),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(34,211,238,.10),transparent 60%)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
::selection{background:rgba(34,211,238,.35)}
/* ---------- layout ---------- */
.side{position:fixed;top:0;left:0;bottom:0;width:var(--side);background:var(--bg2);border-right:1px solid var(--border);z-index:40;display:flex;flex-direction:column;transition:transform .25s}
.brand{display:flex;gap:12px;align-items:center;padding:20px 18px 16px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 24px rgba(34,211,238,.35);flex:none}
.brand b{display:block;font-size:15px;letter-spacing:.2px}
.brand small{color:var(--muted);font-size:11.5px}
.nav{padding:6px 10px;overflow:auto;flex:1}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--dim);margin:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--muted);font-weight:500;font-size:14px;margin:1px 0}
.nav a:hover{background:var(--panel);color:var(--text);text-decoration:none}
.nav a.on{background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(139,92,246,.10));color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .count{margin-left:auto;font-size:11px;background:var(--panel2);border:1px solid var(--border);padding:1px 7px;border-radius:999px;color:var(--muted)}
.side-foot{padding:14px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.mini-bar{height:6px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:6px}
.mini-bar i{display:block;height:100%;background:var(--grad);border-radius:999px}
.main{margin-left:var(--side);min-height:100vh;position:relative;z-index:1}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.crumbs{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--text)}
.spacer{flex:1}
.search-btn{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 12px;color:var(--muted);cursor:pointer;min-width:260px}
.search-btn:hover{border-color:var(--border2)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border2);border-bottom-width:2px;border-radius:6px;padding:1px 6px;color:var(--muted);margin-left:auto}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--panel);border:1px solid var(--border);cursor:pointer}
.icon-btn:hover{border-color:var(--border2)}
.icon-btn svg{width:18px;height:18px}
.hamb{display:none}
.wrap{max-width:1180px;margin:0 auto;padding:26px 28px 80px}
/* ---------- primitives ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.h1{font-size:28px;font-weight:800;letter-spacing:-.4px;margin:0 0 6px;line-height:1.2}
.h2{font-size:19px;font-weight:700;margin:28px 0 12px}
.lead{color:var(--muted);margin:0 0 18px;font-size:15.5px}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:9px 15px;font-weight:600;font-size:14px;cursor:pointer;border:1px solid var(--border2);background:var(--panel2);color:var(--text);text-decoration:none!important;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--grad);border:none;color:#06101f;box-shadow:0 8px 24px -10px rgba(34,211,238,.7)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.5);color:var(--accent3)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.chip.c{color:var(--accent);border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.08)}
.chip.v{color:#c4b5fd;border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.10)}
.chip.g{color:var(--accent3);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.10)}
.chip.y{color:var(--warn);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.10)}
.chip.r{color:var(--bad);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.10)}
html[data-theme="light"] .chip.v{color:#6d28d9}
html[data-theme="light"] .chip.c{color:#0e7490}
html[data-theme="light"] .chip.g{color:#047857}
html[data-theme="light"] .chip.y{color:#a16207}
.clickable{cursor:pointer}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;font-weight:800;letter-spacing:-.5px}
.stat span{font-size:12.5px;color:var(--muted)}
.bar{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .5s}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
textarea{min-height:120px;resize:vertical;font-family:var(--mono);font-size:13px}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px;font-weight:600}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 12px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 0 var(--border2),0 0 0 1px var(--border2)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:13px 16px;border:1px solid rgba(251,191,36,.4);background:rgba(251,191,36,.08);font-size:14px;margin-bottom:16px}
.banner.info{border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.07)}
.banner.ok{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)}
.banner svg{width:20px;height:20px;flex:none;margin-top:1px}
/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px;border:1px solid var(--border2);background:linear-gradient(135deg,rgba(34,211,238,.10),rgba(139,92,246,.12)),var(--panel);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:var(--grad);opacity:.14;filter:blur(10px)}
.hero .eyebrow{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);font-weight:700}
.hero h2{font-size:26px;margin:8px 0 6px;letter-spacing:-.3px;line-height:1.25}
.hero p{margin:0 0 14px;color:var(--muted);max-width:720px}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-size:30px;font-weight:800;display:block;line-height:1}
.ring .lbl span{font-size:12px;color:var(--muted)}
/* ---------- heatmap ---------- */
.heat{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;align-items:center}
.heat .ml{font-size:12.5px;color:var(--muted);white-space:nowrap;font-weight:600}
.heat .cells{display:grid;grid-template-columns:repeat(29,minmax(0,1fr));gap:4px}
.cell{aspect-ratio:1;border-radius:4px;background:var(--panel2);border:1px solid var(--border);cursor:pointer;position:relative;transition:transform .1s}
.cell:hover{transform:scale(1.35);z-index:2;border-color:var(--accent)}
.cell.light{background:repeating-linear-gradient(45deg,var(--panel2),var(--panel2) 3px,var(--panel3) 3px,var(--panel3) 6px)}
.cell.part{background:rgba(34,211,238,.35);border-color:rgba(34,211,238,.6)}
.cell.done{background:var(--accent3);border-color:var(--accent3)}
.cell.cur{outline:2px solid var(--warn);outline-offset:1px}
.cell.cal::after{content:"";position:absolute;left:50%;bottom:-6px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--pink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--border)}
/* ---------- lists ---------- */
.daylist{display:flex;flex-direction:column;gap:8px}
.dayrow{display:grid;grid-template-columns:auto 64px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--border);cursor:pointer}
.dayrow:hover{border-color:var(--border2);background:var(--panel2)}
.dayrow .num{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.dayrow .t{font-weight:600;font-size:14.5px}
.dayrow .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tick{width:22px;height:22px;border-radius:7px;border:2px solid var(--border2);display:grid;place-items:center;flex:none}
.tick.on{background:var(--accent3);border-color:var(--accent3)}
.tick.half{border-color:var(--accent);background:rgba(34,211,238,.18)}
.tick svg{width:14px;height:14px;color:#06101f}
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--border);cursor:pointer;min-height:92px;display:flex;flex-direction:column;gap:4px}
.wday:hover{border-color:var(--accent)}
.wday.on{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
.wday.done{background:rgba(52,211,153,.10);border-color:rgba(52,211,153,.45)}
.wday small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.wday span{font-size:12.5px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mcard{cursor:pointer;transition:transform .15s,border-color .15s}
.mcard:hover{transform:translateY(-2px);border-color:var(--border2)}
.mcard .mn{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:700}
.mcard h4{margin:6px 0 10px;font-size:14.5px;line-height:1.35;min-height:40px}
/* ---------- day page ---------- */
.dayhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.daycode{font-family:var(--mono);color:var(--accent);font-weight:700;font-size:13px;letter-spacing:.5px}
.daygrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;margin-top:18px;align-items:start}
.sticky{position:sticky;top:78px;display:flex;flex-direction:column;gap:16px}
.obj{border-left:3px solid var(--accent);padding:12px 16px;background:rgba(34,211,238,.06);border-radius:0 12px 12px 0;margin:0 0 16px}
.obj b{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.rescard{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--panel2);border:1px solid var(--border);cursor:pointer;transition:border-color .15s,transform .15s}
.rescard:hover{border-color:var(--accent);transform:translateY(-1px)}
.rescard .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--panel3);border:1px solid var(--border2)}
.rescard .ico svg{width:20px;height:20px}
.rescard .role{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;font-weight:700;color:var(--muted)}
.rescard .tt{font-weight:700;margin:2px 0 4px;line-height:1.3}
.rescard .uu{font-family:var(--mono);font-size:12px;color:var(--dim);word-break:break-all}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--panel3);border:1px solid var(--border2);font-weight:800;font-size:13px;color:var(--accent)}
.steps li b{display:block}
.steps li span{color:var(--muted);font-size:14px}
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border-radius:11px;cursor:pointer;border:1px solid transparent;user-select:none}
.chk:hover{background:var(--panel2);border-color:var(--border)}
.chk .tick{margin-top:1px}
.chk b{display:block;font-size:14px}
.chk small{color:var(--muted);font-size:12.5px}
.timer{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:1px;text-align:center;margin:4px 0 10px}
table.ft{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;border:1px solid var(--border);border-radius:14px;overflow:hidden}
table.ft th,table.ft td{text-align:left;vertical-align:top;padding:11px 14px;border-bottom:1px solid var(--border)}
table.ft tr:last-child th,table.ft tr:last-child td{border-bottom:none}
table.ft th{width:30%;background:var(--panel2);font-weight:650;color:var(--text);font-size:13.5px}
table.ft td{background:var(--panel)}
.url{font-family:var(--mono);font-size:12px;color:var(--dim);word-break:break-all}
details.box{border:1px solid var(--border);border-radius:14px;background:var(--panel);margin-top:16px}
details.box>summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;display:flex;align-items:center;gap:10px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--muted)}
details.box[open]>summary::after{content:"–"}
details.box>div{padding:0 18px 18px}
.score{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.score button{min-width:0;padding:7px 0;border-radius:9px;border:1px solid var(--border);background:var(--panel2);cursor:pointer;font-weight:700;font-size:13px}
.score button.on{background:var(--grad);color:#06101f;border-color:transparent}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.pager a{flex:1;padding:14px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--border);text-decoration:none;color:var(--text)}
.pager a:hover{border-color:var(--accent)}
.pager small{display:block;color:var(--muted);font-size:12px}
.pager .r{text-align:right}
/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(3,6,15,.6);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg2);border-left:1px solid var(--border2);z-index:61;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-20px 0 60px -20px rgba(0,0,0,.7)}
.drawer.on{transform:none}
.drawer .dh{padding:20px 22px 14px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.drawer .db{padding:18px 22px 40px;overflow:auto;flex:1}
.drawer h2{margin:6px 0 4px;font-size:20px;line-height:1.3}
/* ---------- search modal ---------- */
.modal{position:fixed;left:50%;top:10vh;transform:translateX(-50%) scale(.98);width:min(720px,94vw);background:var(--bg2);border:1px solid var(--border2);border-radius:18px;z-index:70;box-shadow:0 30px 80px -20px rgba(0,0,0,.8);opacity:0;pointer-events:none;transition:all .15s}
.modal.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
.modal .si{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal .si input{border:none;background:transparent;font-size:17px;padding:6px 0;box-shadow:none}
.modal .res{max-height:60vh;overflow:auto;padding:8px}
.sr{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:11px;cursor:pointer}
.sr.on,.sr:hover{background:var(--panel2)}
.sr .k{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--panel3);color:var(--accent);flex:none;min-width:58px;text-align:center}
.sr .tt{font-weight:600;font-size:14px}
.sr .ss{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:560px}
/* ---------- guide (markdown) ---------- */
.guide-wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:26px;align-items:start}
.gtoc{position:sticky;top:78px;max-height:calc(100vh - 100px);overflow:auto;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--panel);font-size:13px}
.gtoc a{display:block;color:var(--muted);padding:4px 6px;border-radius:7px;line-height:1.35}
.gtoc a:hover{background:var(--panel2);color:var(--text);text-decoration:none}
.gtoc a.l3{padding-left:18px;font-size:12.5px}
.gtoc a.l1{color:var(--text);font-weight:700}
.md{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:8px 30px 30px;overflow-wrap:anywhere}
.md h1{font-size:25px;margin:24px 0 10px;letter-spacing:-.3px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.md h2{font-size:20px;margin:30px 0 10px;color:var(--text)}
.md h2::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--grad);margin-right:10px;vertical-align:middle;transform:translateY(-2px)}
.md h3{font-size:16.5px;margin:22px 0 8px;color:var(--accent)}
.md h1,.md h2,.md h3{scroll-margin-top:80px}
.md p,.md li{color:var(--text)}
.md blockquote{margin:14px 0;padding:12px 16px;border-left:3px solid var(--accent2);background:rgba(139,92,246,.08);border-radius:0 12px 12px 0}
.md blockquote p{margin:4px 0}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--panel3);border:1px solid var(--border);border-radius:6px;padding:1px 6px}
.md pre{background:#050816;border:1px solid var(--border);border-radius:12px;padding:14px;overflow:auto}
html[data-theme="light"] .md pre{background:#0f172a;color:#e2e8f0}
.md pre code{background:none;border:none;padding:0;color:inherit}
.md table{width:100%;border-collapse:collapse;font-size:13.5px;margin:14px 0;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
.md th{background:var(--panel2);font-weight:700}
.md tr:nth-child(even) td{background:color-mix(in srgb,var(--panel2) 45%,transparent)}
.md hr{border:none;border-top:1px solid var(--border);margin:24px 0}
.md ul,.md ol{padding-left:22px}
/* ---------- resources ---------- */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.rtile{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--border);cursor:pointer;transition:border-color .15s,transform .15s}
.rtile:hover{border-color:var(--accent);transform:translateY(-2px)}
.rtile .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rtile .id{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent)}
.rtile h4{margin:0;font-size:15px;line-height:1.35}
.rtile p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tablewrap{overflow:auto;border:1px solid var(--border);border-radius:14px}
table.reg{border-collapse:collapse;width:100%;font-size:12.5px;min-width:1100px}
table.reg th,table.reg td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
table.reg th{position:sticky;top:0;background:var(--panel2);z-index:1}
table.reg td{background:var(--panel)}
.prow{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center;padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--border);cursor:pointer}
.prow:hover{border-color:var(--accent)}
.prow .id{font-family:var(--mono);font-weight:800;color:var(--accent)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel3);border:1px solid var(--border2);padding:11px 18px;border-radius:12px;z-index:90;opacity:0;transition:all .25s;font-weight:600;box-shadow:var(--shadow);pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{margin-top:40px;color:var(--dim);font-size:12px;text-align:center}
@media (max-width:1100px){.daygrid{grid-template-columns:minmax(0,1fr)}.sticky{position:static}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.guide-wrap{grid-template-columns:1fr}.gtoc{position:static;max-height:260px}}
@media (max-width:860px){
  .side{transform:translateX(-100%)}.side.open{transform:none}.main{margin-left:0}.hamb{display:grid}
  .search-btn{min-width:0}.search-btn .lbl,.search-btn .kbd{display:none}
  .wrap{padding:18px 16px 70px}.top{padding:10px 16px}
  .g2,.g3{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}
  .heat{grid-template-columns:1fr}.heat .ml{margin-top:6px}
  .week-strip{grid-template-columns:repeat(4,minmax(0,1fr))}
  .dayrow{grid-template-columns:auto 1fr auto}.dayrow .num{display:none}
  .md{padding:4px 16px 20px}.hero{padding:20px}.ring{width:150px;height:150px}
  .hero-row{flex-direction:column;align-items:flex-start!important}.hero h2{font-size:22px}
  .h1{font-size:23px}.dayhead{flex-direction:column}.chip{white-space:normal;max-width:100%}
  .daygrid,.daygrid>div{min-width:0}.card{padding:16px}.rescard{flex-wrap:wrap}.rescard .btn{margin-left:auto}
  .ft th{width:38%}table.ft th,table.ft td{padding:9px 10px;font-size:13px}
}
@media print{.side,.top,.sticky,.pager,.no-print{display:none!important}.main{margin:0}.daygrid{grid-template-columns:1fr}body{background:#fff;color:#000}body::before{display:none}}
</style>

 and browser labs without exposing vulnerable services."],["Prerequisites","Virtualization basics, host OS administration, CLI, Git"],["Architecture","Host with VirtualBox/KVM; Ubuntu VM on NAT plus internal adapter; optional Windows evaluation VM; browser labs; evidence repository"],["Tools and installation links","VirtualBox <a href=\"https://www.virtualbox.org/manual/\">https://www.virtualbox.org/manual/<\/a>; Ubuntu <a href=\"https://help.ubuntu.com/\">https://help.ubuntu.com/<\/a>; Git <a href=\"https://git-scm.com/book/en/v2\">https://git-scm.com/book/en/v2<\/a>; Wireshark <a href=\"https://www.wireshark.org/docs/wsug_html_chunked/\">https://www.wireshark.org/docs/wsug_html_chunked/<\/a>"],["Step-by-step milestones","1 Inventory hardware; 2 enable virtualization; 3 install hypervisor; 4 create Ubuntu VM; 5 configure NAT/internal adapters; 6 snapshot; 7 optional Windows VM; 8 document setup"],["Expected results","A clean VM with internet via NAT, an isolated internal adapter, a restore point, and a reproducible README"],["Validation tests","Boot VM; ping gateway; verify no bridged vulnerable adapter; restore snapshot; compare configuration hash; confirm no host firewall disabled"],["Common mistakes","Bridging vulnerable VMs; storing personal files in lab; no snapshot; copying random ISO images"],["Troubleshooting guidance","No boot: enable VT-x/AMD-V; no network: check NAT/DHCP; slow VM: reduce RAM to 2 GB; snapshot corruption: keep exported appliance and backup"],["Evidence to collect","VM settings export, sanitized screenshots, network diagram, command transcript, snapshot identifier, setup log"],["Report template","T1 with scope, architecture, setup, validation, limitations, recovery test"],["GitHub structure","lab-baseline/README.md, docs/, scripts/, evidence/sanitized/"],["README requirements","Purpose, hardware, exact versions, setup commands, network isolation, restore test, limitations"],["Security boundaries","Only owned VMs; no public exposure; no personal credentials; host security stays enabled"],["Grading rubric","R1 standard rubric; special weight on isolation and recovery evidence"],["Extension challenges","Add Ansible/Vagrant provisioning; add segmented Windows VM; add offline package mirror"]],"milestones":["1 Inventory hardware","2 enable virtualization","3 install hypervisor","4 create Ubuntu VM","5 configure NAT/internal adapters","6 snapshot","7 optional Windows VM","8 document setup"]},{"id":"PRJ-02","title":"Security control baseline and risk register","fields":[["Problem statement","The lab has assets and configurations but no systematic risk-based control selection."],["Objective","Apply NIST CSF and CIS-style controls to the student&#x27;s own lab and measure whether each control works."],["Prerequisites","M1-M4 foundations, basic risk vocabulary, VM administration"],["Architecture","Inventory of VMs, GitHub repo, local web service, synthetic data; controls mapped to Govern/Identify/Protect/Detect/Respond/Recover"],["Tools and installation links","NIST CSF <a href=\"https://www.nist.gov/cyberframework\">https://www.nist.gov/cyberframework<\/a>; CIS Controls <a href=\"https://www.cisecurity.org/controls/v8\">https://www.cisecurity.org/controls/v8<\/a>; NIST SP 800-30 <a href=\"https://csrc.nist.gov/pubs/sp/800/30/r1/final\">https://csrc.nist.gov/pubs/sp/800/30/r1/final<\/a>"],["Step-by-step milestones","1 Asset inventory; 2 data classification; 3 five threats; 4 risk register; 5 select ten controls; 6 implement low-risk controls; 7 test; 8 write exceptions"],["Expected results","Ten tested controls, a risk register with owners/treatments, and one 90-day improvement plan"],["Validation tests","Before/after evidence for each control; negative test where control should block; restore test; peer-style review of residual risk"],["Common mistakes","Confusing policy with working control; no rollback; selecting controls only from a checklist; claiming zero risk"],["Troubleshooting guidance","If control breaks usability, snapshot and rollback; if evidence is missing, define a measurable test; if risk ranking is inconsistent, state assumptions"],["Evidence to collect","Asset inventory, risk register, control matrix, test results, screenshots, change log, rollback notes"],["Report template","T1 plus risk methodology, control-by-control results, exceptions, residual risk"],["GitHub structure","security-baseline/README.md, docs/threat-model.md, controls/, tests/, evidence/"],["README requirements","Scope, methodology, how to reproduce each test, limitations, no compliance claim"],["Security boundaries","Controls applied only to owned lab; no production system; no unauthorized scanning"],["Grading rubric","R1 with conceptual 25, practical 25, documentation 20, troubleshooting 10, safety 10, independence 10"],["Extension challenges","Add quantitative risk scoring; automate control tests; compare two frameworks"]],"milestones":["1 Asset inventory","2 data classification","3 five threats","4 risk register","5 select ten controls","6 implement low-risk controls","7 test","8 write exceptions"]},{"id":"PRJ-03","title":"Network diagram and troubleshooting report","fields":[["Problem statement","A small lab network has connectivity faults and no documented topology or diagnostic method."],["Objective","Produce a professional topology and a repeatable OSI-layer troubleshooting report for an isolated network."],["Prerequisites","OSI/TCP/IP, CIDR, ARP, routing, Wireshark, Packet Tracer"],["Architecture","Three-node virtual network with client, server, router/switch simulation; NAT for updates; internal adapter for tests"],["Tools and installation links","Packet Tracer <a href=\"https://www.netacad.com/courses/packet-tracer\">https://www.netacad.com/courses/packet-tracer<\/a>; Wireshark <a href=\"https://www.wireshark.org/docs/wsug_html_chunked/\">https://www.wireshark.org/docs/wsug_html_chunked/<\/a>; JITL labs <a href=\"https://www.youtube.com/playlist?list=PLxbwE86jKRgMpuZuLBivzlM8s2Dk5lXBQ\">https://www.youtube.com/playlist?list=PLxbwE86jKRgMpuZuLBivzlM8s2Dk5lXBQ<\/a>"],["Step-by-step milestones","1 Draw physical/logical topology; 2 assign addresses; 3 verify ARP and routes; 4 inject three faults; 5 diagnose layer by layer; 6 fix; 7 retest; 8 report"],["Expected results","Correct diagram, IP plan, fault timeline, packet evidence and verification tests"],["Validation tests","Ping/traceroute success; ARP table matches; route table checks; packet capture confirms each fault/fix; diagram matches observed state"],["Common mistakes","Confusing default gateway and DNS; changing multiple variables at once; ignoring time/ARP cache; no rollback"],["Troubleshooting guidance","No route: check subnet/default gateway; DNS failure: use IP to isolate; ARP stale: clear cache safely; capture empty: use correct interface"],["Evidence to collect","Topology diagram, .pkt file or VM config, PCAP excerpts, command logs, before/after test matrix"],["Report template","T1 plus OSI-layer analysis and evidence table"],["GitHub structure","network-troubleshooting/README.md, diagrams/, captures/, reports/"],["README requirements","Exact topology, reproduction commands, sanitized addresses, assumptions, limitations"],["Security boundaries","Only isolated lab addresses; no campus/public network scanning"],["Grading rubric","R1 with special weight on troubleshooting and independent hypotheses"],["Extension challenges","Add IPv6, VLANs, OSPF, or a simulated firewall failure"]],"milestones":["1 Draw physical/logical topology","2 assign addresses","3 verify ARP and routes","4 inject three faults","5 diagnose layer by layer","6 fix","7 retest","8 report"]},{"id":"PRJ-04","title":"Wireshark traffic-analysis report","fields":[["Problem statement","Network traffic contains security-relevant evidence, but the student cannot yet distinguish observation from inference."],["Objective","Analyze a legal sample PCAP and write a defensible report with confidence levels."],["Prerequisites","TCP/IP, DNS, HTTP/TLS, Wireshark display filters"],["Architecture","Single analysis VM with Wireshark and sample captures; no live user traffic"],["Tools and installation links","Wireshark Guide <a href=\"https://www.wireshark.org/docs/wsug_html_chunked/\">https://www.wireshark.org/docs/wsug_html_chunked/<\/a>; SampleCaptures <a href=\"https://wiki.wireshark.org/SampleCaptures\">https://wiki.wireshark.org/SampleCaptures<\/a>; RFC 9293 <a href=\"https://www.rfc-editor.org/rfc/rfc9293\">https://www.rfc-editor.org/rfc/rfc9293<\/a>"],["Step-by-step milestones","1 Hash capture; 2 identify endpoints/conversations; 3 protocol hierarchy; 4 follow streams; 5 identify anomalies; 6 form hypotheses; 7 test with filters; 8 report"],["Expected results","A report with endpoints, timeline, protocol fields, evidence for each claim and explicit limitations"],["Validation tests","PCAP hash unchanged; five display filters documented; at least three claims tied to frame numbers; alternative explanation considered"],["Common mistakes","Treating encrypted payload as plaintext; ignoring time zones; confusing capture and display filters; overclaiming malware"],["Troubleshooting guidance","No capture: verify interface/permissions; TLS hides fields: use metadata; noisy file: filter by conversation; missing DNS: check external resolver"],["Evidence to collect","PCAP hash, filter list, annotated screenshots, frame table, timeline, final report"],["Report template","T1 plus packet-evidence appendix and confidence scale"],["GitHub structure","traffic-analysis/README.md, captures/, reports/, evidence/"],["README requirements","Capture source, hash, Wireshark version, filters, findings, limitations"],["Security boundaries","Use only public sample captures or traffic from owned systems; no third-party interception"],["Grading rubric","R1 with conceptual 25, practical 25, troubleshooting 15, documentation 15, safety 10, independence 10"],["Extension challenges","Add Zeek/Suricata comparison; analyze TLS 1.3 metadata; create a synthetic beaconing dataset"]],"milestones":["1 Hash capture","2 identify endpoints/conversations","3 protocol hierarchy","4 follow streams","5 identify anomalies","6 form hypotheses","7 test with filters","8 report"]},{"id":"PRJ-05","title":"Linux system-audit script","fields":[["Problem statement","Manual Linux checks are slow, inconsistent and risky when copied from random blogs."],["Objective","Write a read-only Bash/Python audit utility that collects security-relevant system state from an owned Linux VM."],["Prerequisites","Linux permissions, processes, services, Bash, Python, JSON"],["Architecture","Audit script runs with least privilege; outputs common JSON schema; no network calls and no destructive commands"],["Tools and installation links","BashGuide <a href=\"https://mywiki.wooledge.org/BashGuide\">https://mywiki.wooledge.org/BashGuide<\/a>; man7 <a href=\"https://man7.org/linux/man-pages/\">https://man7.org/linux/man-pages/<\/a>; Python docs <a href=\"https://docs.python.org/3/\">https://docs.python.org/3/<\/a>; CIS Benchmarks <a href=\"https://www.cisecurity.org/cis-benchmarks\">https://www.cisecurity.org/cis-benchmarks<\/a>"],["Step-by-step milestones","1 Define schema; 2 collect users/groups; 3 permissions; 4 services/listening ports; 5 patch state; 6 logs; 7 JSON output; 8 tests; 9 review"],["Expected results","A deterministic, read-only tool with tests, sample output and a design document"],["Validation tests","Run on clean VM; compare output against manual commands; test empty fields, filenames with spaces, missing permissions; shellcheck; no modifications"],["Common mistakes","Running as root unnecessarily; parsing human-readable text; unquoted variables; exposing /etc/shadow; destructive commands"],["Troubleshooting guidance","Permission denied: handle gracefully; `ss` missing: use fallback or document; JSON invalid: validate; locale changes: normalize output"],["Evidence to collect","Script, schema, tests, sample output, manual verification table, shellcheck report, README"],["Report template","T1 plus control-to-command mapping and limitations"],["GitHub structure","linux-audit/README.md, src/, tests/, data/synthetic/, docs/"],["README requirements","Scope, read-only guarantee, setup, usage, schema, limitations"],["Security boundaries","Run only on owned VM; never publish real user hashes, hostnames or sensitive logs"],["Grading rubric","R1 with secure coding and least-privilege checks"],["Extension challenges","Add PowerShell counterpart; add config drift test; add CI and signed release"]],"milestones":["1 Define schema","2 collect users/groups","3 permissions","4 services/listening ports","5 patch state","6 logs","7 JSON output","8 tests","9 review"]},{"id":"PRJ-06","title":"Windows event-log investigation","fields":[["Problem statement","A synthetic Windows incident needs a defensible timeline, but event IDs are easy to misinterpret."],["Objective","Investigate benign simulated authentication/process/service events and write an incident report with confidence levels."],["Prerequisites","Windows fundamentals, Event Viewer, PowerShell, Sysmon, evidence integrity"],["Architecture","Disposable Windows VM; Security/System/Sysmon logs; benign event generator; no real personal data"],["Tools and installation links","Windows Event Log <a href=\"https://learn.microsoft.com/en-us/windows/win32/wes/windows-event-log\">https://learn.microsoft.com/en-us/windows/win32/wes/windows-event-log<\/a>; Sysmon <a href=\"https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon\">https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon<\/a>; Sysinternals <a href=\"https://learn.microsoft.com/en-us/sysinternals/\">https://learn.microsoft.com/en-us/sysinternals/<\/a>"],["Step-by-step milestones","1 Clean snapshot; 2 configure audit/Sysmon; 3 generate logon/service/process events; 4 export EVTX; 5 hash; 6 query fields; 7 timeline; 8 report"],["Expected results","A reproducible timeline of at least five events with EventID, provider, time, user, process and interpretation"],["Validation tests","Hash manifest matches; XPath/PowerShell queries reproduce timeline; at least one alternative explanation rejected by evidence"],["Common mistakes","Ignoring logon type; mixing local and UTC time; relying on EventID alone; editing original EVTX"],["Troubleshooting guidance","No events: check audit policy; Sysmon absent: verify service; time skew: configure NTP; access denied: use admin shell in lab only"],["Evidence to collect","Sanitized EVTX, hash manifest, query file, timeline, screenshots, incident report"],["Report template","T2 incident form with evidence references and confidence labels"],["GitHub structure","windows-investigation/README.md, events/, queries/, reports/, evidence/"],["README requirements","Lab scope, event-generation steps, sanitization, tool versions, query instructions"],["Security boundaries","Disposable VM only; no personal accounts; no live malware; preserve original evidence"],["Grading rubric","R1 with evidence integrity and false-positive analysis"],["Extension challenges","Add Sysmon config comparison; add KQL/Sigma rule; add memory acquisition concepts in Year 2"]],"milestones":["1 Clean snapshot","2 configure audit/Sysmon","3 generate logon/service/process events","4 export EVTX","5 hash","6 query fields","7 timeline","8 report"]},{"id":"PRJ-07","title":"Python security-log parser and defensive automation tool","fields":[["Problem statement","Security logs arrive in multiple formats and contain malformed lines; manual grep is not enough."],["Objective","Build a tested parser and analyzer that normalizes synthetic logs and produces defensible summaries."],["Prerequisites","Python, regex, files, exceptions, JSON/CSV, SQL, testing, Git"],["Architecture","CLI tool with parser/analyzer modules; SQLite storage; synthetic inputs; common JSON schema; no external network"],["Tools and installation links","Python Tutorial <a href=\"https://docs.python.org/3/tutorial/\">https://docs.python.org/3/tutorial/<\/a>; pytest <a href=\"https://docs.pytest.org/en/stable/\">https://docs.pytest.org/en/stable/<\/a>; RegexOne <a href=\"https://regexone.com/\">https://regexone.com/<\/a>; SQLite <a href=\"https://www.sqlite.org/docs.html\">https://www.sqlite.org/docs.html<\/a>"],["Step-by-step milestones","1 Define schema; 2 stream input; 3 parse three formats; 4 normalize; 5 store; 6 query top talkers; 7 structured errors; 8 tests; 9 docs"],["Expected results","Working CLI, normalized dataset, SQL queries, Markdown report and full test suite"],["Validation tests","20+ tests; 100 MB synthetic file under documented memory cap; malformed lines rejected with reasons; secrets redacted; no shell interpolation"],["Common mistakes","Catastrophic regex; reading whole file into memory; logging secrets; string-built SQL; no time zone handling"],["Troubleshooting guidance","Timeout: bound regex and line length; Unicode errors: explicit encoding; DB lock: transaction handling; query slow: index fields"],["Evidence to collect","Code, schema, sample logs, test results, performance note, redacted output, changelog"],["Report template","T1 plus data schema, query logic, false-positive discussion, performance"],["GitHub structure","security-log-parser/README.md, src/, tests/, data/synthetic/, reports/"],["README requirements","Problem, formats, exact CLI, schema, tests, redaction, limitations"],["Security boundaries","Synthetic logs only; no production logs; no credential collection"],["Grading rubric","R1 with secure coding and test quality"],["Extension challenges","Add property-based tests; add Sigma export; add notebook visualization; add streaming benchmark"]],"milestones":["1 Define schema","2 stream input","3 parse three formats","4 normalize","5 store","6 query top talkers","7 structured errors","8 tests","9 docs"]},{"id":"PRJ-08","title":"Secure web application / API","fields":[["Problem statement","A small notes API must support multiple users without exposing one user&#x27;s data to another."],["Objective","Implement a secure local API with authentication, object ownership, validation, parameterized queries, CSRF protection and structured logging."],["Prerequisites","HTTP, SQL, Python, threat modelling, OWASP ASVS, testing"],["Architecture","Local web app, SQLite/PostgreSQL-like database, session cookies, server-side authz, test suite, CI"],["Tools and installation links","OWASP ASVS <a href=\"https://owasp.org/www-project-application-security-verification-standard/\">https://owasp.org/www-project-application-security-verification-standard/<\/a>; Cheat Sheets <a href=\"https://cheatsheetseries.owasp.org/\">https://cheatsheetseries.owasp.org/<\/a>; Python docs <a href=\"https://docs.python.org/3/\">https://docs.python.org/3/<\/a>; SQLite <a href=\"https://www.sqlite.org/docs.html\">https://www.sqlite.org/docs.html<\/a>"],["Step-by-step milestones","1 Requirements; 2 threat model; 3 schema; 4 registration/login/logout; 5 object ownership; 6 anti-CSRF; 7 rate limits; 8 errors/logs; 9 tests; 10 CI"],["Expected results","Working API with secure defaults, 20+ tests, threat model and reproducible setup"],["Validation tests","Cross-user access denied; SQL injection strings do not change queries; XSS payload escaped; expired session rejected; CSRF token mismatch rejected; rate limit triggers"],["Common mistakes","Client-side authz only; plaintext passwords; string SQL; hiding IDs as security; verbose stack traces; secrets in repo"],["Troubleshooting guidance","Login loop: cookie attributes/domain; 403 unexpectedly: check object owner; CSRF failing: token/session binding; DB locked: transaction scope"],["Evidence to collect","Source, migrations, threat model, test report, CI log, sanitized request/response examples"],["Report template","T1 plus security requirements and verification matrix"],["GitHub structure","secure-api/README.md, src/, migrations/, tests/, docs/, .github/workflows/"],["README requirements","Scope, setup, roles, endpoints, test commands, threat model, limitations"],["Security boundaries","Loopback/host-only only; no public deployment; synthetic users only"],["Grading rubric","R1 with special weight on server-side authorization and negative tests"],["Extension challenges","Add JWT/OIDC carefully; add CSP/Trusted Types; add SAST/DAST and SBOM"]],"milestones":["1 Requirements","2 threat model","3 schema","4 registration/login/logout","5 object ownership","6 anti-CSRF","7 rate limits","8 errors/logs","9 tests","10 CI"]},{"id":"PRJ-09","title":"Local web application security assessment with remediation","fields":[["Problem statement","A secure app still needs independent validation and defensive recommendations, not just passing tests."],["Objective","Perform an authorized assessment of PRJ-08 on loopback, validate findings, fix root causes and retest."],["Prerequisites","PRJ-08, HTTP, OWASP WSTG, PortSwigger basics, secure coding"],["Architecture","Assessor VM/container, local app, Burp/ZAP proxy, written scope, evidence repository"],["Tools and installation links","OWASP WSTG <a href=\"https://owasp.org/www-project-web-security-testing-guide/\">https://owasp.org/www-project-web-security-testing-guide/<\/a>; Burp docs <a href=\"https://portswigger.net/burp/documentation\">https://portswigger.net/burp/documentation<\/a>; ZAP docs <a href=\"https://www.zaproxy.org/docs/\">https://www.zaproxy.org/docs/<\/a>; Cheat Sheets <a href=\"https://cheatsheetseries.owasp.org/\">https://cheatsheetseries.owasp.org/<\/a>"],["Step-by-step milestones","1 Scope/RoE; 2 asset inventory; 3 five test areas; 4 validate findings; 5 risk rank; 6 fix; 7 retest; 8 report"],["Expected results","Three evidence-backed findings, one rejected false positive, before/after tests and a closure memo"],["Validation tests","Scope contains only 127.0.0.1/internal host; original/variant/regression retests; raw evidence hashes; no destructive action"],["Common mistakes","Testing without written scope; WAF-only fix; over-ranking scanner alerts; leaving sessions/cookies in report"],["Troubleshooting guidance","Proxy not intercepting: check browser proxy/cert; app down: verify container; finding not reproducing: compare environment; regression after fix: isolate commit"],["Evidence to collect","RoE, request/response evidence, scan report, remediation diff, retest results"],["Report template","T2 assessment report with executive summary, findings, evidence, remediation, retest"],["GitHub structure","web-assessment/README.md, scope/, evidence/sanitized/, reports/, fixes/"],["README requirements","Explicit ownership/authorization, sanitized evidence, reproduction steps, limitations"],["Security boundaries","Only own local app; no third-party target; no public exploit material"],["Grading rubric","R1 with safety/ethics double weight"],["Extension challenges","Add authenticated scanning; add business-logic abuse cases; add CVSS/KEV contextual ranking"]],"milestones":["1 Scope/RoE","2 asset inventory","3 five test areas","4 validate findings","5 risk rank","6 fix","7 retest","8 report"]},{"id":"PRJ-10","title":"Authorized vulnerability assessment report for an isolated lab","fields":[["Problem statement","A realistic assessment needs planning, discovery, validation, communication and closure under a written scope."],["Objective","Execute an end-to-end assessment of two owned VMs and one local vulnerable web app, then report and retest."],["Prerequisites","M1-M7 prerequisites, networking, Linux/Windows, web security, ethics"],["Architecture","Two local VMs, one vulnerable app, NAT/internal network, Nmap/Burp/Wireshark, evidence repo"],["Tools and installation links","NIST SP 800-115 <a href=\"https://csrc.nist.gov/pubs/sp/800/115/final\">https://csrc.nist.gov/pubs/sp/800/115/final<\/a>; Nmap Reference <a href=\"https://nmap.org/book/man.html\">https://nmap.org/book/man.html<\/a>; WSTG <a href=\"https://owasp.org/www-project-web-security-testing-guide/\">https://owasp.org/www-project-web-security-testing-guide/<\/a>; FIRST CVSS <a href=\"https://www.first.org/cvss/\">https://www.first.org/cvss/<\/a>"],["Step-by-step milestones","1 Charter; 2 RoE; 3 inventory; 4 threat model; 5 discovery; 6 validation; 7 evidence; 8 report; 9 remediation; 10 retest"],["Expected results","A professional report with prioritized findings, false-positive analysis, remediation tickets and closure evidence"],["Validation tests","All targets in scope; three findings with raw evidence; CVSS plus business context; no persistence/lateral movement beyond minimal proof; retest closes root cause"],["Common mistakes","Scope creep; destructive proof; scanner dependence; missing evidence hash; confusing version with vulnerability"],["Troubleshooting guidance","Host down: stop and verify; scanner crash: reduce rate; ambiguous banner: second validation; report disagreement: cite raw evidence"],["Evidence to collect","Scope, asset inventory, scan outputs, PCAPs, screenshots, evidence manifest, final report"],["Report template","T2 full assessment template with appendices"],["GitHub structure","vuln-assessment/README.md, scope/, evidence/sanitized/, reports/, remediation/"],["README requirements","Scope statement, sanitized artifacts, tool versions, limitations"],["Security boundaries","Isolated owned systems only; no public IPs; no real user data"],["Grading rubric","R1 with safety/ethics threshold 10/10"],["Extension challenges","Add credentialed scanning; add AD lab; add CVSS environmental scoring; add retest automation"]],"milestones":["1 Charter","2 RoE","3 inventory","4 threat model","5 discovery","6 validation","7 evidence","8 report","9 remediation","10 retest"]},{"id":"PRJ-11","title":"SIEM alert investigation and incident report","fields":[["Problem statement","A synthetic alert must be triaged, investigated and communicated without overclaiming from limited logs."],["Objective","Build a reproducible incident investigation from synthetic Windows/Linux/cloud logs and write a professional report."],["Prerequisites","Log normalization, KQL/SQL, ATT&amp;CK, IR lifecycle, evidence integrity"],["Architecture","Local dataset or free sample workspace; normalized event table; KQL-style queries; timeline; case management notes"],["Tools and installation links","KQL docs <a href=\"https://learn.microsoft.com/en-us/kusto/query/\">https://learn.microsoft.com/en-us/kusto/query/<\/a>; Sentinel docs <a href=\"https://learn.microsoft.com/en-us/azure/sentinel/\">https://learn.microsoft.com/en-us/azure/sentinel/<\/a>; NIST 800-61r3 <a href=\"https://csrc.nist.gov/pubs/sp/800/61/r3/final\">https://csrc.nist.gov/pubs/sp/800/61/r3/final<\/a>; ATT&amp;CK <a href=\"https://attack.mitre.org/\">https://attack.mitre.org/<\/a>"],["Step-by-step milestones","1 Define alert; 2 generate/download data; 3 normalize; 4 triage; 5 eight queries; 6 timeline; 7 ATT&amp;CK map; 8 response; 9 report"],["Expected results","Incident report with timeline, confidence levels, root-cause hypothesis, evidence gaps and response plan"],["Validation tests","All timestamps normalized; eight queries reproducible; one benign alternative rejected; evidence hashes; no cloud overspend"],["Common mistakes","Assuming an IOC is an incident; mixing time zones; query joins without cardinality check; ignoring data gaps"],["Troubleshooting guidance","No tables: use local SQLite equivalent; high false positives: narrow entity/time; missing host: state limitation; cost alert: stop ingestion"],["Evidence to collect","Data manifest, queries, timeline, screenshots, incident report, executive summary, detection-gap notes"],["Report template","T2 incident report with known/likely/unknown sections"],["GitHub structure","siem-investigation/README.md, data/synthetic/, queries/, reports/, evidence/"],["README requirements","Dataset provenance, time zone, schema, query setup, sanitization"],["Security boundaries","Synthetic data only; if cloud used, budgets and teardown documented"],["Grading rubric","R1 with uncertainty/documentation weight"],["Extension challenges","Add SOAR-style playbook; add KQL to Sigma conversion; add tabletop exercise"]],"milestones":["1 Define alert","2 generate/download data","3 normalize","4 triage","5 eight queries","6 timeline","7 ATT&CK map","8 response","9 report"]},{"id":"PRJ-12","title":"Detection rule with test data","fields":[["Problem statement","A detection idea is not credible until it is rule-formatted, tested on true/false positives and maintained as code."],["Objective","Write an original Sigma rule for a lab behaviour, convert it to a query and validate on synthetic events."],["Prerequisites","ATT&amp;CK, logs, KQL/SQL, Sigma, Git, testing"],["Architecture","Detection-as-code repo; synthetic event generator; rule; conversion script; tests; CI-like local validation"],["Tools and installation links","SigmaHQ <a href=\"https://sigmahq.io/\">https://sigmahq.io/<\/a>; Sigma guide <a href=\"https://sigmahq.io/docs/guide/getting-started.html\">https://sigmahq.io/docs/guide/getting-started.html<\/a>; Elastic detections <a href=\"https://www.elastic.co/guide/en/security/current/detection-engine-overview.html\">https://www.elastic.co/guide/en/security/current/detection-engine-overview.html<\/a>; ATT&amp;CK <a href=\"https://attack.mitre.org/\">https://attack.mitre.org/<\/a>"],["Step-by-step milestones","1 Choose technique; 2 data requirements; 3 rule; 4 ten positives/ten negatives; 5 convert; 6 backtest; 7 tune; 8 document bypasses"],["Expected results","A rule, labelled dataset, conversion output, metrics, false-positive notes and version history"],["Validation tests","Rule validates; all assigned true positives detected; false positives below documented threshold; at least three bypasses listed; CI test fails on broken rule"],["Common mistakes","Blanket suppression; untested field names; selecting only easy positives; no rule owner; confusing precision with value"],["Troubleshooting guidance","Conversion error: check backend/pipeline; no matches: verify field normalization; too many alerts: prevalence analysis; rule valid but useless: revisit hypothesis"],["Evidence to collect","Rule YAML, test events, conversion output, metrics, changelog, design document, ATT&amp;CK mapping"],["Report template","T1 plus detection design document with hypothesis, data, tests, bypasses"],["GitHub structure","detection-rule/README.md, rules/, tests/data/, docs/, scripts/, evidence/"],["README requirements","Technique, logsource, setup, test commands, metrics, limitations"],["Security boundaries","Synthetic/authorized telemetry only; no deployment on production systems"],["Grading rubric","R1 with special weight on false-positive evidence"],["Extension challenges","Add correlation rule; add multi-backend conversion; add ATT&amp;CK Navigator layer; add 10,000-event backtest"]],"milestones":["1 Choose technique","2 data requirements","3 rule","4 ten positives/ten negatives","5 convert","6 backtest","7 tune","8 document bypasses"]},{"id":"PRJ-13","title":"Cloud configuration security review","fields":[["Problem statement","A fictional small cloud environment has IAM/network/storage/logging weaknesses but no budget for live deployment."],["Objective","Review synthetic architecture and configuration artifacts, prioritize risks and provide verification steps."],["Prerequisites","Cloud shared responsibility, IAM, storage, logging, risk, documentation"],["Architecture","Fictional AWS/Azure account structure with ten resources; JSON policy samples; architecture diagram; no billable resources"],["Tools and installation links","AWS Security Pillar <a href=\"https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/welcome.html\">https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/welcome.html<\/a>; AWS security docs <a href=\"https://docs.aws.amazon.com/security/\">https://docs.aws.amazon.com/security/<\/a>; Azure security <a href=\"https://learn.microsoft.com/en-us/azure/security/\">https://learn.microsoft.com/en-us/azure/security/<\/a>; CSA CCM <a href=\"https://cloudsecurityalliance.org/research/cloud-controls-matrix\">https://cloudsecurityalliance.org/research/cloud-controls-matrix<\/a>"],["Step-by-step milestones","1 Inventory; 2 classify data; 3 IAM review; 4 network review; 5 storage; 6 logging; 7 risk register; 8 remediation; 9 verification"],["Expected results","Twelve findings with blast-radius analysis, owner, verification command/query and residual risk"],["Validation tests","All findings supported by synthetic config lines; policy logic checked; no live cloud resource created; risk priorities include business context"],["Common mistakes","Assuming encryption fixes public access; treating NAT as firewall; ignoring control-plane logs; copy-pasting another cloud&#x27;s defaults"],["Troubleshooting guidance","Policy ambiguous: draw trust graph; missing logs: state visibility gap; service names changed: verify current docs; disputed risk: define scenario"],["Evidence to collect","Architecture diagram, synthetic policies, risk register, review checklist, remediation plan, references"],["Report template","T2 assessment report plus control-mapping appendix"],["GitHub structure","cloud-review/README.md, architecture/, configs/synthetic/, reports/, checks/"],["README requirements","Explicit fictional scope, no live account, assumptions, verification steps"],["Security boundaries","No real customer data; no cloud credentials; no public deployment"],["Grading rubric","R1 with conceptual/architecture weight"],["Extension challenges","Add Checkov/Terraform scan; add AWS/Azure comparison; add detection hypothesis for each high risk"]],"milestones":["1 Inventory","2 classify data","3 IAM review","4 network review","5 storage","6 logging","7 risk register","8 remediation","9 verification"]},{"id":"PRJ-14","title":"Docker image and container security review","fields":[["Problem statement","A container image may contain vulnerable packages, secrets, excessive privileges and insecure networking."],["Objective","Build/review a local image and runtime configuration, fix findings and rescan with reproducible evidence."],["Prerequisites","Docker basics, Linux permissions, CVE/SBOM, CI, scripting"],["Architecture","Local Docker/Podman host; intentionally weak image; Trivy scanner; runtime metadata; isolated bridge network"],["Tools and installation links","Docker docs <a href=\"https://docs.docker.com/\">https://docs.docker.com/<\/a>; Docker security <a href=\"https://docs.docker.com/engine/security/\">https://docs.docker.com/engine/security/<\/a>; Trivy <a href=\"https://trivy.dev/docs/\">https://trivy.dev/docs/<\/a>; OWASP K8s Top 10 <a href=\"https://owasp.org/www-project-kubernetes-top-ten/\">https://owasp.org/www-project-kubernetes-top-ten/<\/a>"],["Step-by-step milestones","1 Snapshot baseline; 2 inspect layers; 3 scan; 4 Dockerfile review; 5 runtime review; 6 fix; 7 rescan; 8 report"],["Expected results","Ten findings, five fixes, before/after scans, runtime tests and residual-risk notes"],["Validation tests","Hardened image runs non-root; no secret in history; capabilities dropped; read-only root where feasible; network isolation verified"],["Common mistakes","Using latest tag blindly; privileged container; secrets in ENV/ARG; scanning without context; leaving volumes world-writable"],["Troubleshooting guidance","Build fails: pin base image; app needs write: use tmpfs; scanner DB blocked: use offline/documented limitation; container exits: inspect logs"],["Evidence to collect","Dockerfiles, image IDs/digests, scan JSON, runtime inspect output, test log, diff"],["Report template","T2 assessment report with image inventory and finding-by-finding evidence"],["GitHub structure","container-review/README.md, docker/, scans/, tests/, reports/evidence/"],["README requirements","Local-only scope, image versions, reproduction commands, sanitized outputs"],["Security boundaries","No public registry push; no host socket mount; no production daemon"],["Grading rubric","R1 with runtime-isolation and vulnerability-triage weight"],["Extension challenges","Add SBOM/provenance; add rootless Docker; add Kubernetes admission policy; add CI gate"]],"milestones":["1 Snapshot baseline","2 inspect layers","3 scan","4 Dockerfile review","5 runtime review","6 fix","7 rescan","8 report"]},{"id":"PRJ-15","title":"Final integrated capstone","fields":[["Problem statement","The student needs one coherent project that combines secure engineering, telemetry, detection, incident response, cloud/container controls and independent research."],["Objective","Design, build, attack safely, detect, respond, document and defend an original system aligned with the chosen specialization."],["Prerequisites","M1-M11, chosen specialization, primary docs, technical writing"],["Architecture","Local three-tier app/API, structured logging, three detections, hardened container, synthetic cloud/IaC representation, CI and evidence repo"],["Tools and installation links","OWASP ASVS <a href=\"https://owasp.org/www-project-application-security-verification-standard/\">https://owasp.org/www-project-application-security-verification-standard/<\/a>; SigmaHQ <a href=\"https://sigmahq.io/\">https://sigmahq.io/<\/a>; AWS Security Pillar <a href=\"https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/welcome.html\">https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/welcome.html<\/a>; GitHub Actions hardening <a href=\"https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions\">https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions<\/a>; NIST 800-61r3 <a href=\"https://csrc.nist.gov/pubs/sp/800/61/r3/final\">https://csrc.nist.gov/pubs/sp/800/61/r3/final<\/a>"],["Step-by-step milestones","1 Charter; 2 threat model; 3 architecture; 4 reproducible setup; 5 implementation; 6 detections; 7 failure injection; 8 authorized assessment; 9 remediation; 10 report/demo"],["Expected results","Working system, labelled benign/malicious data, tested detections, a security assessment, incident report, reproducible setup, demo and limitations"],["Validation tests","Clean install succeeds; 25+ tests; three detections with true/false-positive data; failure-injection tests; assessment retests; report passes 75+"],["Common mistakes","Oversized scope; unlabelled synthetic data; no negative results; tutorial-replica architecture; overclaiming production readiness"],["Troubleshooting guidance","Performance: reduce components; missing telemetry: instrument first; false positives: labelled baseline; report too broad: narrow claim; demo fails: use tagged release"],["Evidence to collect","Source, manifests, data dictionary, test outputs, evidence manifest, threat model, report, demo script, changelog"],["Report template","T3 capstone report: abstract, problem, related work, design, implementation, evaluation, security assessment, IR, limitations, future work"],["GitHub structure","capstone/README.md, docs/, src/, detections/, data/synthetic/, tests/, evidence/sanitized/, .github/workflows/"],["README requirements","One-sentence contribution, architecture, exact setup, demo, tests, limitations, ethics statement"],["Security boundaries","All targets owned/local; synthetic data; no public vulnerable service; no secrets; no unauthorized exploit material"],["Grading rubric","R1 plus capstone defence: 20 concept, 25 practical, 15 independence, 15 troubleshooting, 15 documentation, 10 safety; pass 75"],["Extension challenges","Publish a dataset; add multi-cloud comparison; add a research reproduction; submit a conference-style extended abstract"]],"milestones":["1 Charter","2 threat model","3 architecture","4 reproducible setup","5 implementation","6 detections","7 failure injection","8 authorized assessment","9 remediation","10 report/demo"]}],"guides":[{"id":"start","title":"Start Here: Easy Resource Guide","subtitle":"Exact websites, exact playlist order, lecture SOP and zero-confusion daily workflow","html":"<h1 id=\"start-here-exact-websites-exact-order-zero-confusion\">Start Here: exact websites, exact order, zero confusion<\/h1>\n<p><strong>Purpose.<\/strong> Ye short guide bats ata hai ke roz kis website par jana hai, kis button/learning path ko follow karna hai, lecture kaise dekhna hai, aur time waste kaise rokna hai. Poori detailed 365-day plan Volume 2-4 mein hai; yahan sirf operating system hai.<\/p>\n<blockquote>\n<p><strong>Roman Urdu rule:<\/strong> <em>\"Video dekh li\" is not study.<\/em> Har lecture ke baad ek command, ek lab result, ek retrieval answer, aur ek commit hona chahiye. Agar 1 hour hai to bhi \"Core track\" complete karo; baaki optional extension Day 7 ya weekend par.<\/p>\n<\/blockquote>\n<h2 id=\"1-one-minute-decision-tree\">1. One-minute decision tree<\/h2>\n<table>\n<thead>\n<tr>\n<th>Aaj ki situation<\/th>\n<th>Exact action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bilkul new din aur naya topic hai<\/td>\n<td>Volume 2-4 mein aaj ka <code>MxxWxDy<\/code> card kholo → Primary resource link par jao → exact section parho/dekho → Core practical task karo → evidence file save karo → retrieval question ka answer likho.<\/td>\n<\/tr>\n<tr>\n<td>Website samajh nahi aa rahi<\/td>\n<td>Section 3 \"Website use karne ka exact tarika\" mein uss website ka row parho.<\/td>\n<\/tr>\n<tr>\n<td>Video dekhne ka mann hai but lab nahi karna<\/td>\n<td>Video ko 20-25 minute ke chunk mein dekho; har chunk ke baad pause karke command/code reproduce karo. Lab skip allowed nahi.<\/td>\n<\/tr>\n<tr>\n<td>Lab error aa gaya<\/td>\n<td>Error ka exact text copy karo → error log mein likho → primary docs/man page search karo → ek variable change karke retest karo → fix aur root cause dono likho.<\/td>\n<\/tr>\n<tr>\n<td>Time kam hai<\/td>\n<td>Core track (~1h): 20 min resource, 30 min minimum lab, 10 min retrieval + log. Standard (~2h) adds one variation. Intensive (3-4h) adds independent extension.<\/td>\n<\/tr>\n<tr>\n<td>Assessment fail hua (&lt;70/100)<\/td>\n<td>Scorecard mein lowest category mark karo → primary resource ka exact section dobara parho → supplementary alternate explanation use karo → same exercise nayi input par dobara karo → naya mini-test do → agle din retest. Advanced topic par tab tak na jao jab tak critical prerequisite weak hai.<\/td>\n<\/tr>\n<tr>\n<td>Motivation kam hai<\/td>\n<td>Day 7 ka light revision/catch-up karo; streak todne se behtar hai 30-minute honest retrieval. Burnout ko data ki tarah treat karo, guilt ki tarah nahi.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"2-daily-study-sop-the-525451510-method\">2. Daily study SOP (the 5/25/45/15/10 method)<\/h2>\n<ol>\n<li><strong>Preview — 5 min.<\/strong> Aaj ke card se topic, subtopics, objective aur completion criteria parho. Notebook mein likho: <em>\"Mujhe kya prove karna hai?\"<\/em><\/li>\n<li><strong>Input — 25 min.<\/strong> Primary lecture ya docs ka assigned section. Video ho to exact playlist/lesson title match karo; timestamps tabhi use karo jo video page par actually dikhte hon. Kisi PDF mein likhe hue invented timestamp par trust na karo.<\/li>\n<li><strong>Hands-on — 45 min (Core: 25-30).<\/strong> Exact practical task karo. Har command/code apne VM/container/browser lab mein type karo; copy-paste ke baad bhi ek variation khud likho.<\/li>\n<li><strong>Retrieval — 15 min.<\/strong> Book/notes band karke aaj ka revision question answer karo. Apne words mein 5-8 lines. Phir answer compare karo.<\/li>\n<li><strong>Evidence — 10 min.<\/strong> Expected output file/screenshot/command log banao, hash ya timestamp add karo, Git commit ya journal entry karo.<\/li>\n<\/ol>\n<p><strong>Standard track (~2h)<\/strong> adds: one modified exercise, one documented error, and one extra retrieval question. <strong>Intensive track (~3-4h)<\/strong> adds: an independent extension from a blank file/VM, a mini teach-back paragraph, and one primary-documentation lookup. Har din 4 hours zaroori nahi.<\/p>\n<h2 id=\"3-website-use-karne-ka-exact-tarika\">3. Website use karne ka exact tarika<\/h2>\n<table>\n<thead>\n<tr>\n<th>Website / platform<\/th>\n<th>Account? / cost<\/th>\n<th>Kahan jana hai<\/th>\n<th>Exact workflow<\/th>\n<th>Common mistake<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Harvard CS50x / CS50 Cyber<\/strong><\/td>\n<td>Free OCW; edX certificate optional paid<\/td>\n<td><a href=\"https://cs50.harvard.edu/x/\">https://cs50.harvard.edu/x/<\/a> or <a href=\"https://cs50.harvard.edu/cybersecurity/\">https://cs50.harvard.edu/cybersecurity/<\/a><\/td>\n<td>Weeks → choose current week → Lecture/Notes/Problem Set → submit where free gradebook available. YouTube playlist sirf lecture dekhne ke liye.<\/td>\n<td>Sirf YouTube dekhna aur problem sets skip karna.<\/td>\n<\/tr>\n<tr>\n<td><strong>YouTube playlists<\/strong><\/td>\n<td>Free<\/td>\n<td>Exact playlist links in Volume 5 and the \"Playlist control panel\"<\/td>\n<td>Playlist open karo → video title aur course objective match karo → 20-25 min chunk → pause → reproduce → notes → lab.<\/td>\n<td>Channel homepage se random video hopping.<\/td>\n<\/tr>\n<tr>\n<td><strong>Jeremy's IT Lab CCNA<\/strong><\/td>\n<td>Free YouTube; optional paid course<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLxbwE86jKRgMpuZuLBivzlM8s2Dk5lXBQ\">https://www.youtube.com/playlist?list=PLxbwE86jKRgMpuZuLBivzlM8s2Dk5lXBQ<\/a> and course index <a href=\"https://courses.jeremysitlab.com/p/ccna\">https://courses.jeremysitlab.com/p/ccna<\/a><\/td>\n<td>Course index se exact \"Day N\" title lo → playlist mein woh lecture dhundo → Packet Tracer lab file download karo → lab complete karo → Anki cards review.<\/td>\n<td>Subnetting sirf dekhna; daily 20 questions na karna.<\/td>\n<\/tr>\n<tr>\n<td><strong>Professor Messer<\/strong><\/td>\n<td>Free videos; paid notes optional<\/td>\n<td>Course index <a href=\"https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/\">https://www.professormesser.com/security-plus/sy0-701/sy0-701-video/sy0-701-comptia-security-plus-course/<\/a><\/td>\n<td>Objective code (e.g., 1.2) se exact video title dhoondo → video dekho → usi objective ka hands-on lab karo. certification version check karo: SY0-701 V7 vs upcoming SY0-801 V8.<\/td>\n<td>Purane SY0-601 playlist ko current samajhna.<\/td>\n<\/tr>\n<tr>\n<td><strong>Linux Journey<\/strong><\/td>\n<td>Free<\/td>\n<td><a href=\"https://linuxjourney.com/\">https://linuxjourney.com/<\/a><\/td>\n<td>Lesson parho → apne Ubuntu VM mein har command dobara type karo → result aur error command notebook mein likho.<\/td>\n<td>Browser lesson complete karna but VM practice na karna.<\/td>\n<\/tr>\n<tr>\n<td><strong>OverTheWire Bandit<\/strong><\/td>\n<td>Free<\/td>\n<td><a href=\"https://overthewire.org/wargames/bandit/\">https://overthewire.org/wargames/bandit/<\/a><\/td>\n<td>Official level page parho → SSH se connect karo → level solve karo → <strong>concept<\/strong> note likho; passwords/flags publicly publish na karo.<\/td>\n<td>Walkthrough copy karna; ye independent problem-solving ko destroy karta hai.<\/td>\n<\/tr>\n<tr>\n<td><strong>PortSwigger Web Security Academy<\/strong><\/td>\n<td>Free account<\/td>\n<td>Learning Paths <a href=\"https://portswigger.net/web-security/learning-paths\">https://portswigger.net/web-security/learning-paths<\/a> → current path → topic → Apprentice lab<\/td>\n<td>Read topic → launch lab → Burp scope set karo → solve without walkthrough → root cause + remediation note likho.<\/td>\n<td>Lab solve karna but defensive fix na likhna.<\/td>\n<\/tr>\n<tr>\n<td><strong>OWASP projects<\/strong><\/td>\n<td>Free<\/td>\n<td>Top 10 <a href=\"https://owasp.org/www-project-top-ten/\">https://owasp.org/www-project-top-ten/<\/a>, ASVS <a href=\"https://owasp.org/www-project-application-security-verification-standard/\">https://owasp.org/www-project-application-security-verification-standard/<\/a>, Cheat Sheets <a href=\"https://cheatsheetseries.owasp.org/\">https://cheatsheetseries.owasp.org/<\/a><\/td>\n<td>Standards ko checklist ki tarah use karo; har requirement ko apne local project ke test se map karo.<\/td>\n<td>OWASP page ko step-by-step course samajhna; ye reference hai.<\/td>\n<\/tr>\n<tr>\n<td><strong>TryHackMe<\/strong><\/td>\n<td>Freemium<\/td>\n<td><a href=\"https://tryhackme.com/path/outline/presecurity\">https://tryhackme.com/path/outline/presecurity<\/a> then Cyber Security 101<\/td>\n<td>Free account → free rooms filter → browser AttackBox ya local VM → notes. Paid subscription tabhi jab aapne free equivalent labs complete kiye ho.<\/td>\n<td>Subscription lena aur phir bhi sirf videos dekhna.<\/td>\n<\/tr>\n<tr>\n<td><strong>Hack The Box Academy<\/strong><\/td>\n<td>Freemium<\/td>\n<td><a href=\"https://academy.hackthebox.com/\">https://academy.hackthebox.com/<\/a><\/td>\n<td>Free modules filter → module resources download → isolated VM/HTB environment → notes.<\/td>\n<td>Cubes/subscription ko skill samajhna.<\/td>\n<\/tr>\n<tr>\n<td><strong>pwn.college / CyLab Academy<\/strong><\/td>\n<td>Free<\/td>\n<td>Dojo index <a href=\"https://pwn.college/dojos\">https://pwn.college/dojos<\/a> or <a href=\"https://www.cylabacademy.org/\">https://www.cylabacademy.org/<\/a><\/td>\n<td>Core Material order follow karo → module lecture → browser workspace → challenge → concept journal.<\/td>\n<td>Software Exploitation dojo directly try karna before Linux/C/assembly.<\/td>\n<\/tr>\n<tr>\n<td><strong>CyberDefenders / BTLO / Malware Traffic Analysis<\/strong><\/td>\n<td>Freemium/Free datasets<\/td>\n<td><a href=\"https://cyberdefenders.org/\">https://cyberdefenders.org/<\/a>, <a href=\"https://blueteamlabs.online/\">https://blueteamlabs.online/<\/a>, <a href=\"https://malware-traffic-analysis.net/\">https://malware-traffic-analysis.net/<\/a><\/td>\n<td>Dataset download karo → hash karo → disposable VM mein analyze karo → questions ka answer evidence ke saath likho.<\/td>\n<td>Malware samples ko host machine par run karna. Files data hain; execute mat karo.<\/td>\n<\/tr>\n<tr>\n<td><strong>MITRE ATT&amp;CK / NIST / CISA<\/strong><\/td>\n<td>Free<\/td>\n<td><a href=\"https://attack.mitre.org/\">https://attack.mitre.org/<\/a>, <a href=\"https://www.nist.gov/cyberframework\">https://www.nist.gov/cyberframework<\/a>, <a href=\"https://www.cisa.gov/known-exploited-vulnerabilities-catalog\">https://www.cisa.gov/known-exploited-vulnerabilities-catalog<\/a><\/td>\n<td>Exact technique/control/CVE search karo → apne lab evidence se map karo → limitations likho.<\/td>\n<td>Framework ko law ya certification samajhna.<\/td>\n<\/tr>\n<tr>\n<td><strong>Microsoft Learn / AWS Skill Builder<\/strong><\/td>\n<td>Free content; exams paid<\/td>\n<td><a href=\"https://learn.microsoft.com/en-us/training/\">https://learn.microsoft.com/en-us/training/<\/a>, <a href=\"https://skillbuilder.aws/\">https://skillbuilder.aws/<\/a><\/td>\n<td>Learning path → module → knowledge check → optional sandbox → free practice assessment. AWS hands-on se pehle Free Tier terms aur billing alarms set karo.<\/td>\n<td>Credit card add karke paid resources enable karna bina budget alert ke.<\/td>\n<\/tr>\n<tr>\n<td><strong>Docker / Kubernetes docs<\/strong><\/td>\n<td>Free<\/td>\n<td><a href=\"https://docs.docker.com/\">https://docs.docker.com/<\/a>, <a href=\"https://kubernetes.io/docs/home/\">https://kubernetes.io/docs/home/<\/a><\/td>\n<td>Get Started → exact concept/task → local Docker/kind/minikube → cleanup.<\/td>\n<td>Vulnerable container ko public port par expose karna.<\/td>\n<\/tr>\n<tr>\n<td><strong>GitHub / Git<\/strong><\/td>\n<td>Free<\/td>\n<td><a href=\"https://git-scm.com/book/en/v2\">https://git-scm.com/book/en/v2<\/a>, <a href=\"https://docs.github.com/en/code-security\">https://docs.github.com/en/code-security<\/a><\/td>\n<td>Repo → README → branch → commit → PR → CI → secret scan.<\/td>\n<td><code>.env<\/code>, private log, API key ya real IP/public identifier commit karna.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"4-playlist-control-panel-channel-exact-link-kab-use-karein\">4. Playlist control panel: channel + exact link + kab use karein<\/h2>\n<blockquote>\n<p>Exact dates: YouTube par individual video ka upload date dekho. Neeche \"course year\" ya first-publication year diya gaya hai jahan official page/search result se verify hua. Kisi bhi video timestamp ko PDF mein invent nahi kiya gaya; video ke apne chapters use karo.<\/p>\n<\/blockquote>\n<table>\n<thead>\n<tr>\n<th>Order<\/th>\n<th>Channel / provider<\/th>\n<th>Exact playlist or full-course link<\/th>\n<th>Kab aur kaise<\/th>\n<th>Cost<\/th>\n<th>Age / status warning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>CS50 (Harvard)<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLhQjrBD2T380hlTqAU8HfvVepCcjCqTg6\">https://www.youtube.com/playlist?list=PLhQjrBD2T380hlTqAU8HfvVepCcjCqTg6<\/a><\/td>\n<td>Month 1, Week 0-9 ke concepts; official course page ke saath<\/td>\n<td>Free<\/td>\n<td>2026 edition; current<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>CS50 (Harvard)<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLhQjrBD2T3839iqxqUdw7NWOCboh00vsV\">https://www.youtube.com/playlist?list=PLhQjrBD2T3839iqxqUdw7NWOCboh00vsV<\/a><\/td>\n<td>CS50 Sections; jab lecture ka example samajh na aaye<\/td>\n<td>Free<\/td>\n<td>2026; optional<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>CS50 (Harvard)<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLhQjrBD2T383Cqo5I1oRrbC1EKRAKGKUE\">https://www.youtube.com/playlist?list=PLhQjrBD2T383Cqo5I1oRrbC1EKRAKGKUE<\/a><\/td>\n<td>Month 5 core security ke saath<\/td>\n<td>Free<\/td>\n<td>2023 lectures; old but gold<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>freeCodeCamp.org<\/td>\n<td><a href=\"https://www.youtube.com/watch?v=eWRfhZUzrAc\">https://www.youtube.com/watch?v=eWRfhZUzrAc<\/a><\/td>\n<td>Month 4 Python fundamentals; 25
