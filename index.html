-min chunks<\/td>\n<td>Free<\/td>\n<td>2022; concepts still valid<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Jeremy's IT Lab<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLxbwE86jKRgMpuZuLBivzlM8s2Dk5lXBQ\">https://www.youtube.com/playlist?list=PLxbwE86jKRgMpuZuLBivzlM8s2Dk5lXBQ<\/a><\/td>\n<td>Month 2 networking; Day 1 se sequential<\/td>\n<td>Free<\/td>\n<td>Started 2020; v1.1 additions; <strong>old but gold<\/strong>, current exam blueprint verify karo<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Professor Messer<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLG49S3nxzAnl_tQe3kvnmeMid0mjF8Le8\">https://www.youtube.com/playlist?list=PLG49S3nxzAnl_tQe3kvnmeMid0mjF8Le8<\/a><\/td>\n<td>Month 2 targeted Network+ objective review<\/td>\n<td>Free<\/td>\n<td>N10-009; 2024 onward<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Professor Messer<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLG49S3nxzAnl4QDVqK-hOnoqcSKEIDDuv\">https://www.youtube.com/playlist?list=PLG49S3nxzAnl4QDVqK-hOnoqcSKEIDDuv<\/a><\/td>\n<td>Month 5 core security objective review<\/td>\n<td>Free<\/td>\n<td>SY0-701 2023-24; V8 launch Nov 2026<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>MIT OpenCourseWare<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLUl4u3cNGP62K2DjQLRxDNRi0z2IRWnNh\">https://www.youtube.com/playlist?list=PLUl4u3cNGP62K2DjQLRxDNRi0z2IRWnNh<\/a><\/td>\n<td>Year 2+ systems security research; selected lectures<\/td>\n<td>Free<\/td>\n<td>Fall 2014; old but gold, update tools<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Stanford Online / Dan Boneh<\/td>\n<td><a href=\"https://www.coursera.org/learn/crypto\">https://www.coursera.org/learn/crypto<\/a><\/td>\n<td>Month 5 optional rigorous crypto; free audit/lectures where available<\/td>\n<td>Freemium<\/td>\n<td>Classic; primitives durable, current protocols verify karo<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>pwn.college<\/td>\n<td><a href=\"https://www.youtube.com/c/pwncollege\">https://www.youtube.com/c/pwncollege<\/a><\/td>\n<td>Year 2+ dojo lecture support; use dojo index first<\/td>\n<td>Free<\/td>\n<td>Channel dates vary; current dojo first<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>OpenSecurityTraining2<\/td>\n<td><a href=\"https://www.youtube.com/watch?v=11KJYHCwcrE\">https://www.youtube.com/watch?v=11KJYHCwcrE<\/a><\/td>\n<td>Year 2+ Arch1001 intro; full course on OST2 site<\/td>\n<td>Free<\/td>\n<td>2022 intro; old but gold<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Microsoft Azure Data Explorer<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLKHIhZJiQ5AkOMEC54mQQcAkfg4UXT8uK\">https://www.youtube.com/playlist?list=PLKHIhZJiQ5AkOMEC54mQQcAkfg4UXT8uK<\/a><\/td>\n<td>Month 8 KQL essentials<\/td>\n<td>Free<\/td>\n<td>Dates vary; docs first<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>Microsoft exam prep<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLahhVEj9XNTcHNtYH-inn7xFJactEM7zz\">https://www.youtube.com/playlist?list=PLahhVEj9XNTcHNtYH-inn7xFJactEM7zz<\/a><\/td>\n<td>Month 8/10 SC-200 exam-prep supplement<\/td>\n<td>Free<\/td>\n<td>Objectives refreshed 2026; official study guide first<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>AWS<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLRFRM3JNuCkvtHYbxjeEA4vx3G4NrqTn3\">https://www.youtube.com/playlist?list=PLRFRM3JNuCkvtHYbxjeEA4vx3G4NrqTn3<\/a><\/td>\n<td>Year 2+ AWS Security Specialty concept supplement; verify current SCS-C03 guide<\/td>\n<td>Free<\/td>\n<td>Exam content changes; official guide first<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>SANS Digital Forensics<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLrY_AbzZGqt9MJiLjyH-zTrypGLs154e4\">https://www.youtube.com/playlist?list=PLrY_AbzZGqt9MJiLjyH-zTrypGLs154e4<\/a><\/td>\n<td>Month 8/Year 2 DFIR artifact webcasts<\/td>\n<td>Free<\/td>\n<td>Mixed dates; webcast ≠ SANS course<\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>SANS DFIR<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PL4mjNXFbBRJmippWE8BYMVx0ERb9fdBcP\">https://www.youtube.com/playlist?list=PL4mjNXFbBRJmippWE8BYMVx0ERb9fdBcP<\/a><\/td>\n<td>Network forensics practice with sample captures<\/td>\n<td>Free<\/td>\n<td>Older webcasts; technically useful<\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td>SANS<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLfouvuAjspTp23StynIAowjTK2n-5i1QG\">https://www.youtube.com/playlist?list=PLfouvuAjspTp23StynIAowjTK2n-5i1QG<\/a><\/td>\n<td>Threat-analysis/CTI supplement after Month 8<\/td>\n<td>Free<\/td>\n<td>Dates vary; primary advisories first<\/td>\n<\/tr>\n<tr>\n<td>18<\/td>\n<td>picoCTF / CyLab<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLJ_vkrXdcgH9HTNVNIXco0urgrLt349VN\">https://www.youtube.com/playlist?list=PLJ_vkrXdcgH9HTNVNIXco0urgrLt349VN<\/a><\/td>\n<td>picoCTF 2026 competition/lecture archive<\/td>\n<td>Free<\/td>\n<td>2026 competition; practice site changed to CyLab Academy<\/td>\n<\/tr>\n<tr>\n<td>19<\/td>\n<td>KQL community playlist<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLWf6TEjiiuIDDXxYJQryn0KxZ5OjdG83n\">https://www.youtube.com/playlist?list=PLWf6TEjiiuIDDXxYJQryn0KxZ5OjdG83n<\/a><\/td>\n<td>Extra KQL examples after official docs<\/td>\n<td>Free<\/td>\n<td>Publication dates vary; verify syntax with Microsoft docs<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>PortSwigger community demos<\/td>\n<td><a href=\"https://www.youtube.com/playlist?list=PLDVnRJQ0p1WUP6zgjrlrDq5wixceuE5Do\">https://www.youtube.com/playlist?list=PLDVnRJQ0p1WUP6zgjrlrDq5wixceuE5Do<\/a><\/td>\n<td>Optional visual demo only; Academy labs are primary<\/td>\n<td>Free<\/td>\n<td>Unofficial playlist; never replace official labs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"5-time-waste-control-rules\">5. Time-waste control rules<\/h2>\n<ol>\n<li><strong>One primary resource per day.<\/strong> Supplementary sirf alternate explanation ya gap ke liye.<\/li>\n<li><strong>Do not collect playlists.<\/strong> Har week ke liye sirf assigned lessons; baaki \"backlog\" folder mein, not in your study queue.<\/li>\n<li><strong>No walkthrough on first attempt.<\/strong> 20-30 min struggle karo, phir hint, phir documentation, aakhir mein solution. Solution ke baad problem ko naye input se dobara solve karo.<\/li>\n<li><strong>No tool tourism.<\/strong> Nmap, Burp, Wireshark, Docker, Sigma aur KQL ko gehra seekho; har naya tool tabhi add karo jab project mein zarurat ho.<\/li>\n<li><strong>Certificate is not curriculum.<\/strong> Exam voucher tabhi kharido jab official objectives + free practice + portfolio evidence ready ho.<\/li>\n<li><strong>No unauthorized testing.<\/strong> PortSwigger labs, TryHackMe/HTB, pwn.college, local VMs aur explicitly authorized ranges ke alawa kisi public system ko scan/exploit mat karo.<\/li>\n<li><strong>Weekly stop rule.<\/strong> Agar 2 hafte se zyada backlog hai to naya module shuru mat karo; pehle Day 7 catch-up protocol use karo.<\/li>\n<\/ol>\n<h2 id=\"6-your-first-two-hours-today\">6. Your first two hours (today)<\/h2>\n<ol>\n<li>Folder banao: <code>cybersecurity-blueprint/<\/code>, <code>journal/<\/code>, <code>evidence/<\/code>, <code>projects/<\/code>, <code>scripts/<\/code>.<\/li>\n<li>VM install karo: VirtualBox + Ubuntu LTS (official links: <a href=\"https://www.virtualbox.org/manual/\">https://www.virtualbox.org/manual/<\/a>, <a href=\"https://help.ubuntu.com/\">https://help.ubuntu.com/<\/a>).<\/li>\n<li>Git repo banao: <code>git init<\/code>, README, <code>.gitignore<\/code>, first commit.<\/li>\n<li>Open Volume 2, Day <code>M01W1D1<\/code>, primary resource F01, and complete the Core track.<\/li>\n<li>Stop after evidence file + retrieval answer. <strong>Don't watch five extra videos.<\/strong> Kal ka card kal.<\/li>\n<\/ol>","toc":[[1,"start-here-exact-websites-exact-order-zero-confusion","Start Here: exact websites, exact order, zero confusion"],[2,"1-one-minute-decision-tree","1. One-minute decision tree"],[2,"2-daily-study-sop-the-525451510-method","2. Daily study SOP (the 5/25/45/15/10 method)"],[2,"3-website-use-karne-ka-exact-tarika","3. Website use karne ka exact tarika"],[2,"4-playlist-control-panel-channel-exact-link-kab-use-karein","4. Playlist control panel: channel + exact link + kab use karein"],[2,"5-time-waste-control-rules","5. Time-waste control rules"],[2,"6-your-first-two-hours-today","6. Your first two hours (today)"]],"pdf":"00_START_HERE_Easy_Resource_Guide.pdf"},{"id":"vol1","title":"Volume 1 — Master Roadmap","subtitle":"Assumptions, milestones, dependency map, study system and navigation","html":"<h1 id=\"volume-1-master-roadmap-and-learning-system\">Volume 1 — Master roadmap and learning system<\/h1>\n<h2 id=\"1-assumptions-and-scope\">1. Assumptions and scope<\/h2>\n<p>This blueprint assumes:<\/p>\n<ul>\n<li>You are a BS Computer Science student with some HTML/CSS/JavaScript exposure but no professional security experience.<\/li>\n<li>Python, Bash, PowerShell, Linux, Windows internals, networking, cloud and security tooling need structured development.<\/li>\n<li>You can study roughly 1, 2, or 3-4 hours per day depending on university workload; the default design target is <strong>2 hours/day<\/strong>.<\/li>\n<li>Hardware is modest: an 8 GB RAM laptop can complete most work with browser labs and lightweight VMs; 16 GB+ enables Windows/Kubernetes labs. No paid cloud lab is required.<\/li>\n<li>You are in Pakistan. Skills are internationally portable, but hiring, work authorization, taxation and exam prices vary by country. No salary or visa promise is made.<\/li>\n<li>You have intermittent internet. Download only legitimate free course files/docs when allowed; most work should be local and reproducible.<\/li>\n<li>You will not target systems you do not own or lack written authorization to test.<\/li>\n<\/ul>\n<p><strong>Calendar-free numbering.<\/strong> The plan uses <code>M01W1D1 ... M12W4D28<\/code>, then <code>W49D1 ... W52D7<\/code>, then <code>D365<\/code>. Optional real dates assume a start of <strong>2026-10-27<\/strong> and end <strong>2027-10-26<\/strong>. If you start later, preserve sequence numbers and shift dates.<\/p>\n<p><strong>Duration arithmetic.<\/strong> 12 academic months × 4 weeks × 7 days = 336 days. Final consolidation = 4 weeks × 7 days + 1 graduation day = 29 days. Total = <strong>365 days = 52 weeks + 1 day<\/strong>. Every academic month has four complete weekly plans; the extra four weeks are a defined examination, portfolio and next-year transition period, not vague \"keep practising\".<\/p>\n<h2 id=\"2-workload-tracks\">2. Workload tracks<\/h2>\n<table>\n<thead>\n<tr>\n<th>Track<\/th>\n<th style=\"text-align: right;\">Approx. daily time<\/th>\n<th>Non-negotiable minimum<\/th>\n<th>Best for<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Core<\/strong><\/td>\n<td style=\"text-align: right;\">~1 h<\/td>\n<td>20 min input, 30 min one practical task, 10 min retrieval/evidence<\/td>\n<td>Exam weeks, internships, low-energy days<\/td>\n<\/tr>\n<tr>\n<td><strong>Standard<\/strong><\/td>\n<td style=\"text-align: right;\">~2 h<\/td>\n<td>Core + full practical task + one variation + error log + journal<\/td>\n<td>Default target<\/td>\n<\/tr>\n<tr>\n<td><strong>Intensive<\/strong><\/td>\n<td style=\"text-align: right;\">~3-4 h<\/td>\n<td>Standard + independent extension + 150-word teach-back + primary-doc lookup<\/td>\n<td>Holidays, project sprints<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Do not do 3-4 hours every day by default. The 30/50/20 allocation is a starting point: <strong>30% theory, 50% hands-on, 20% revision/assessment/documentation<\/strong>. During project weeks use 20/60/20. During exam weeks use 20/40/40.<\/p>\n<p><strong>Daily pass condition:<\/strong> at least 70/100 on that day's completion criteria, evidence saved, retrieval answer attempted, and no safety violation. Watching a lecture alone = 0 practical evidence.<\/p>\n<h2 id=\"3-seven-levels-of-competence\">3. Seven levels of competence<\/h2>\n<table>\n<thead>\n<tr>\n<th>Level<\/th>\n<th>What it means<\/th>\n<th>Evidence<\/th>\n<th>What it does not mean<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Course completion<\/td>\n<td>You watched/read the material and finished quizzes<\/td>\n<td>Progress page, notes<\/td>\n<td>You can use it under pressure<\/td>\n<\/tr>\n<tr>\n<td>2. Certification exam pass<\/td>\n<td>You met a vendor's scored objectives<\/td>\n<td>Certificate<\/td>\n<td>You can run investigations or build systems independently<\/td>\n<\/tr>\n<tr>\n<td>3. Guided-lab competence<\/td>\n<td>You can reproduce known steps in a designed environment<\/td>\n<td>Lab badges, walkthrough-free notes<\/td>\n<td>You can solve unfamiliar ambiguity<\/td>\n<\/tr>\n<tr>\n<td>4. Independent problem-solving<\/td>\n<td>You can diagnose an unknown fault using docs, hypotheses and tests<\/td>\n<td>Time-boxed practical, error log, new test<\/td>\n<td>You have production judgement<\/td>\n<\/tr>\n<tr>\n<td>5. Original research/engineering<\/td>\n<td>You create a new tool, detection, experiment or defensible finding with limitations<\/td>\n<td>Original repo/report, tests, peer critique<\/td>\n<td>You are trusted with real incidents<\/td>\n<\/tr>\n<tr>\n<td>6. Trusted professional<\/td>\n<td>You repeatedly deliver safe, documented work under real constraints and feedback<\/td>\n<td>Internship/job/OSS maintainer history, incident reports<\/td>\n<td>You are top 1% globally<\/td>\n<\/tr>\n<tr>\n<td>7. Exceptional specialized expertise<\/td>\n<td>Deep impact in a narrow peer group over years; peers rely on your work<\/td>\n<td>Publications, high-quality OSS, advisories, architecture, reproducible research<\/td>\n<td>A fixed number of years or a certificate<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Top 1% is not a 12-month outcome.<\/strong> Twelve months can produce strong foundations, intermediate practical competence and an early specialization portfolio. Years 2-5 build independent engineering/research; beyond year 5, impact and peer recognition depend on problems solved, not time served.<\/p>\n<h2 id=\"4-measurable-milestones\">4. Measurable milestones<\/h2>\n<table>\n<thead>\n<tr>\n<th>Milestone<\/th>\n<th>Realistic outcome<\/th>\n<th>Required evidence<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Month 1<\/td>\n<td>Set up safe lab; explain hardware/OS/CLI/HTTP/SQL/Git; solve basic CS problems<\/td>\n<td>PRJ-01 home lab, 70/100 assessment, clean VM snapshot, command notebook<\/td>\n<\/tr>\n<tr>\n<td>Month 3<\/td>\n<td>Configure/troubleshoot Linux and Windows; interpret basic logs; write simple Bash/PowerShell<\/td>\n<td>PRJ-05/06, M3 milestone gate 70+, 6 Bandit levels independently, event log timeline<\/td>\n<\/tr>\n<tr>\n<td>Month 6<\/td>\n<td>Build and secure a small web/API app; solve Apprentice web labs; write defensive fixes<\/td>\n<td>PRJ-08/09, 20+ tests, authorized local assessment + retest, 70+ gate<\/td>\n<\/tr>\n<tr>\n<td>Month 9<\/td>\n<td>Review cloud/container/K8s/CI security using local evidence; no surprise cloud bill<\/td>\n<td>PRJ-13/14, hardened Dockerfile/workflow, Kubernetes RBAC/NetworkPolicy tests, 70+ gate<\/td>\n<\/tr>\n<tr>\n<td>Month 12<\/td>\n<td>Pass integrated practicals; defend capstone; publish a coherent portfolio; choose Year 2 path<\/td>\n<td>PRJ-15, three final practicals, capstone defence 75+, portfolio audit, Year 2 plan<\/td>\n<\/tr>\n<tr>\n<td>Years 2-3<\/td>\n<td>Deepen one specialization; original projects; read primary sources; reproduce one result; internship/entry-level or OSS feedback<\/td>\n<td>2-3 substantial repos, one technical paper reproduction, one accepted OSS contribution or equivalent supervised work<\/td>\n<\/tr>\n<tr>\n<td>Years 3-5<\/td>\n<td>Investigate unfamiliar problems; build tools/detections; document original findings; get peer review<\/td>\n<td>Repeatable research method, public technical writing, maintained project, signals of real-world use<\/td>\n<\/tr>\n<tr>\n<td>Beyond year 5<\/td>\n<td>Exceptional expertise may emerge through sustained impact, architecture, research, mentorship and peer review<\/td>\n<td>Publications/advisories/standards/major OSS/incident leadership; no guarantee from years alone<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Competence bands.<\/strong> <em>Foundational<\/em> = can explain and reproduce with guidance. <em>Intermediate<\/em> = can build/troubleshoot familiar systems independently. <em>Advanced specialization<\/em> = can design experiments and reason about failure modes in one domain. <em>Expert research/engineering<\/em> = repeatedly creates new, defensible work that changes practice in a defined peer group.<\/p>\n<h2 id=\"5-curriculum-dependency-map-modules-a-k\">5. Curriculum dependency map (Modules A-K)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Module<\/th>\n<th>Domain<\/th>\n<th>Must come before<\/th>\n<th>Covered mainly in<\/th>\n<th>Advanced/optional extensions<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A<\/td>\n<td>Computer Science and IT Foundations<\/td>\n<td>Everything<\/td>\n<td>M1; revisited M4, M6, M11<\/td>\n<td>Nand2Tetris, OSTEP security chapters, MIT 6.858<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>Networking<\/td>\n<td>Security monitoring, AD, cloud, IR<\/td>\n<td>M2; daily subnetting W5-W8<\/td>\n<td>RFC 9293/8446, Zeek/Suricata, advanced packet analysis<\/td>\n<\/tr>\n<tr>\n<td>C<\/td>\n<td>Linux and Windows<\/td>\n<td>Automation, blue team, AD, cloud<\/td>\n<td>M3<\/td>\n<td>Linux internals, Windows internals, AD security, OST2<\/td>\n<\/tr>\n<tr>\n<td>D<\/td>\n<td>Programming and Automation<\/td>\n<td>Log parsing, secure coding, detection engineering<\/td>\n<td>M4; used M6-M12<\/td>\n<td>Secure software engineering, tool development, fuzzing<\/td>\n<\/tr>\n<tr>\n<td>E<\/td>\n<td>Core Security Principles<\/td>\n<td>All security modules<\/td>\n<td>M5<\/td>\n<td>Applied cryptography, Security Engineering, AI risk<\/td>\n<\/tr>\n<tr>\n<td>F<\/td>\n<td>Web and API Security<\/td>\n<td>Ethical testing, AppSec specialization<\/td>\n<td>M6<\/td>\n<td>GraphQL/request smuggling, advanced auth, LLM appsec<\/td>\n<\/tr>\n<tr>\n<td>G<\/td>\n<td>Ethical Security Testing<\/td>\n<td>Authorized assessment capstone<\/td>\n<td>M7<\/td>\n<td>Pentest certs, vulnerability research, disclosure<\/td>\n<\/tr>\n<tr>\n<td>H<\/td>\n<td>Blue Team, SOC and Incident Response<\/td>\n<td>Detection engineering specialization<\/td>\n<td>M8<\/td>\n<td>DFIR, EDR, threat hunting, malware traffic analysis<\/td>\n<\/tr>\n<tr>\n<td>I<\/td>\n<td>Cloud, Containers and Infrastructure Security<\/td>\n<td>Cloud security specialization<\/td>\n<td>M9<\/td>\n<td>Kubernetes security, IaC security, cloud architecture<\/td>\n<\/tr>\n<tr>\n<td>J<\/td>\n<td>Governance, Risk and Compliance<\/td>\n<td>Professional reporting, security architecture<\/td>\n<td>M5, M8-M12<\/td>\n<td>ISO lead-auditor concepts, privacy engineering, legal nuance<\/td>\n<\/tr>\n<tr>\n<td>K<\/td>\n<td>Advanced Specialization Topics<\/td>\n<td>Years 2-5<\/td>\n<td>M10-M12, Volume 7<\/td>\n<td>RE, malware analysis, vuln research, AI appsec, security research<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Sequence changes from the requested starting point.<\/strong> The original monthly sequence is preserved, but prerequisites are interleaved: Month 1 includes minimal HTTP/SQL/Git; Month 2 introduces TLS/Wireshark before Month 3 logs; Month 3 includes AD foundations; Month 4 emphasizes secure coding habits before Month 6; Month 5 revisits cryptography and GRC; Month 10 is a measured specialization tasting sprint rather than a vague choice; Weeks 49-52 add an explicit integration period.<\/p>\n<h2 id=\"6-twelve-month-overview\">6. Twelve-month overview<\/h2>\n<table>\n<thead>\n<tr>\n<th>Academic month<\/th>\n<th>Main outcome<\/th>\n<th style=\"text-align: right;\">Weeks<\/th>\n<th>Deliverable<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>M1<\/td>\n<td>Systems, OS, CLI, VM lab<\/td>\n<td style=\"text-align: right;\">1-4<\/td>\n<td>PRJ-01 home lab baseline<\/td>\n<\/tr>\n<tr>\n<td>M2<\/td>\n<td>Networking, subnetting, packets, troubleshooting<\/td>\n<td style=\"text-align: right;\">5-8<\/td>\n<td>PRJ-03 topology + PRJ-04 Wireshark report<\/td>\n<\/tr>\n<tr>\n<td>M3<\/td>\n<td>Linux/Windows admin, logs, hardening<\/td>\n<td style=\"text-align: right;\">9-12<\/td>\n<td>PRJ-05 Linux audit + PRJ-06 Windows investigation<\/td>\n<\/tr>\n<tr>\n<td>M4<\/td>\n<td>Python, Bash, PowerShell, Git, testing<\/td>\n<td style=\"text-align: right;\">13-16<\/td>\n<td>PRJ-07 log parser / audit utility<\/td>\n<\/tr>\n<tr>\n<td>M5<\/td>\n<td>Security principles, crypto, IAM, risk, GRC<\/td>\n<td style=\"text-align: right;\">17-20<\/td>\n<td>PRJ-02 security control baseline<\/td>\n<\/tr>\n<tr>\n<td>M6<\/td>\n<td>Web/API security and secure coding<\/td>\n<td style=\"text-align: right;\">21-24<\/td>\n<td>PRJ-08 secure API + PRJ-09 assessment/remediation<\/td>\n<\/tr>\n<tr>\n<td>M7<\/td>\n<td>Authorized testing methodology and reporting<\/td>\n<td style=\"text-align: right;\">25-28<\/td>\n<td>PRJ-10 scoped assessment<\/td>\n<\/tr>\n<tr>\n<td>M8<\/td>\n<td>SOC, logs, SIEM, IR, detection engineering<\/td>\n<td style=\"text-align: right;\">29-32<\/td>\n<td>PRJ-11 incident report + PRJ-12 detection rule<\/td>\n<\/tr>\n<tr>\n<td>M9<\/td>\n<td>Cloud, Docker, Kubernetes, CI/CD, IaC<\/td>\n<td style=\"text-align: right;\">33-36<\/td>\n<td>PRJ-13 cloud review + PRJ-14 container review<\/td>\n<\/tr>\n<tr>\n<td>M10<\/td>\n<td>Specialization tasting and focused sprint<\/td>\n<td style=\"text-align: right;\">37-40<\/td>\n<td>Specialization decision + advanced detection/cloud artifacts<\/td>\n<\/tr>\n<tr>\n<td>M11<\/td>\n<td>Integrated capstone and independent investigation<\/td>\n<td style=\"text-align: right;\">41-44<\/td>\n<td>PRJ-15 capstone + report/demo<\/td>\n<\/tr>\n<tr>\n<td>M12<\/td>\n<td>Practical exams, revision, portfolio, certification decision<\/td>\n<td style=\"text-align: right;\">45-48<\/td>\n<td>Final practicals, CV, Year 2 plan<\/td>\n<\/tr>\n<tr>\n<td>Final consolidation<\/td>\n<td>Independent scenarios, research reproduction, teaching, career setup<\/td>\n<td style=\"text-align: right;\">49-52 + D365<\/td>\n<td>Completion certificate + 90-day sprint<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"7-daily-weekly-and-monthly-study-system\">7. Daily, weekly and monthly study system<\/h2>\n<h3 id=\"daily-learning-checklist-print-this\">Daily learning checklist (print this)<\/h3>\n<ul>\n<li>[ ] Read today's card and completion criteria.<\/li>\n<li>[ ] Open only the assigned primary resource; supplementary only if needed.<\/li>\n<li>[ ] Take active notes: 3 facts, 2 questions, 1 command.<\/li>\n<li>[ ] Perform the practical task and save evidence.<\/li>\n<li>[ ] Deliberately cause or observe one error; record root cause.<\/li>\n<li>[ ] Answer retrieval question without notes.<\/li>\n<li>[ ] Commit evidence or write journal entry.<\/li>\n<li>[ ] Mark Core / Standard / Intensive and actual minutes.<\/li>\n<li>[ ] Schedule weak cards for days 1, 3, 7, 30, 90.<\/li>\n<\/ul>\n<h3 id=\"weekly-review-day-7\">Weekly review (Day 7)<\/h3>\n<ol>\n<li>Score six rubric categories: concept, practical, independent, troubleshooting, documentation, safety.<\/li>\n<li>Rework every error marked conceptual or safety-related.<\/li>\n<li>Pick one old topic and explain it in 10 sentences without notes.<\/li>\n<li>Run one modified exercise from earlier in the week.<\/li>\n<li>Clean lab snapshots; remove unnecessary files and secrets.<\/li>\n<li>Update backlog: keep only three active items; move rest to \"later\".<\/li>\n<li>Choose next week's first repair task based on evidence, not mood.<\/li>\n<\/ol>\n<h3 id=\"monthly-assessment\">Monthly assessment<\/h3>\n<p>Use the 100-point rubric in Volume 6. Passing threshold = <strong>70/100<\/strong>, with safety ≥9/10 and practical ≥18/25. If any critical prerequisite is below 60%, pause advancement and run the six-step repair protocol.<\/p>\n<h3 id=\"spaced-repetition-and-active-recall\">Spaced repetition and active recall<\/h3>\n<p>Create cards from <em>why/how<\/em> questions, not acronyms alone. Review on days 1, 3, 7, 30, 90. A card is retired only after two correct recalls in different contexts. Each month's Day 28 is explicitly light to preserve recovery.<\/p>\n<h3 id=\"technical-journals\">Technical journals<\/h3>\n<p>Maintain five logs: <strong>command notebook<\/strong> (command, purpose, example, pitfall); <strong>error log<\/strong> (symptom, hypothesis, test, fix, lesson); <strong>technical journal<\/strong> (explanations in your own words); <strong>project log<\/strong> (decisions and trade-offs); <strong>reading/research log<\/strong> (claim, evidence, confidence, reproduction idea).<\/p>\n<h2 id=\"8-assessment-gates-and-progression-rules\">8. Assessment gates and progression rules<\/h2>\n<p>Milestone gates occur after M3, M6, M9 and M12. A failed gate triggers: (1) gap identification by rubric category; (2) revisit exact primary lesson/section; (3) use a different medium as alternate explanation; (4) repeat the failed exercise with a new input; (5) complete a novel mini-exercise; (6) retest under a timebox with new questions. Do not proceed to advanced exploitation, DFIR or cloud architecture while networking, OS, programming or ethical prerequisites remain seriously weak.<\/p>\n<h2 id=\"9-primary-specialization-recommendation\">9. Primary specialization recommendation<\/h2>\n<p>Based on the profile and first-year portfolio opportunities, the recommended <strong>primary<\/strong> is <strong>Detection Engineering &amp; Security Automation<\/strong> and the <strong>secondary<\/strong> is <strong>Cloud/Container Security<\/strong>. Reasons: it uses Python, Linux/Windows logs, networking and cloud telemetry; it has strong free primary sources (Sigma, KQL, ATT&amp;CK, NIST, Microsoft Learn, CISA); it produces credible portfolio artifacts without paid labs; and it is complementary to both SOC and security engineering roles. This is a recommendation, not a promise of employment. Month 10 contains a two-sprint falsification test; if your evidence strongly favours web/API security or DFIR, switch using the decision framework in Volume 7.<\/p>\n<h2 id=\"10-navigation-and-reading-order\">10. Navigation and reading order<\/h2>\n<ol>\n<li><strong>00 Start Here<\/strong> — use daily and whenever a website/playlist is confusing.<\/li>\n<li><strong>Volume 1<\/strong> — master strategy, milestones, trackers.<\/li>\n<li><strong>Volumes 2-4<\/strong> — execute all 365 daily cards in order.<\/li>\n<li><strong>Volume 5<\/strong> — use as resource directory and verification register; do not browse randomly.<\/li>\n<li><strong>Volume 6<\/strong> — set up lab, build projects, score assessments, prepare certifications/career.<\/li>\n<li><strong>Volume 7<\/strong> — after Month 12, start the multi-year specialization blueprint.<\/li>\n<li><strong>COMPLETE bundle<\/strong> — all volumes in one file for search/backup; volumes remain easier to print.<\/li>\n<\/ol>\n<h2 id=\"11-glossary-core-terms\">11. Glossary (core terms)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Working definition<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Active recall<\/td>\n<td>Retrieving an answer from memory before checking sources<\/td>\n<\/tr>\n<tr>\n<td>Allow-list<\/td>\n<td>Explicitly permitted inputs/actions; everything else denied<\/td>\n<\/tr>\n<tr>\n<td>Asset<\/td>\n<td>Anything of value that needs protection<\/td>\n<\/tr>\n<tr>\n<td>Attack surface<\/td>\n<td>All points where an attacker can attempt to influence a system<\/td>\n<\/tr>\n<tr>\n<td>Authorization (permission)<\/td>\n<td>What an authenticated identity is allowed to do<\/td>\n<\/tr>\n<tr>\n<td>Availability<\/td>\n<td>Property that authorized users can access systems/data when needed<\/td>\n<\/tr>\n<tr>\n<td>Blue team<\/td>\n<td>Defensive practitioners who monitor, detect, respond and harden<\/td>\n<\/tr>\n<tr>\n<td>CIDR<\/td>\n<td>Classless addressing notation using prefix length, e.g., /26<\/td>\n<\/tr>\n<tr>\n<td>Confidentiality<\/td>\n<td>Preventing unauthorized disclosure<\/td>\n<\/tr>\n<tr>\n<td>Control<\/td>\n<td>Technical, administrative or physical measure that reduces risk<\/td>\n<\/tr>\n<tr>\n<td>CVSS<\/td>\n<td>Standardized vulnerability severity scoring; not full risk<\/td>\n<\/tr>\n<tr>\n<td>Defense in depth<\/td>\n<td>Multiple independent controls so one failure is not fatal<\/td>\n<\/tr>\n<tr>\n<td>Detection engineering<\/td>\n<td>Designing, testing, deploying and maintaining detections as code<\/td>\n<\/tr>\n<tr>\n<td>Evidence integrity<\/td>\n<td>Preserving data so it can be trusted and reproduced<\/td>\n<\/tr>\n<tr>\n<td>Exploit<\/td>\n<td>Technique/code that takes advantage of a vulnerability<\/td>\n<\/tr>\n<tr>\n<td>Framework<\/td>\n<td>Voluntary structured guidance, not automatically law<\/td>\n<\/tr>\n<tr>\n<td>Hash<\/td>\n<td>Fixed-length digest from data; not encryption and not password KDF<\/td>\n<\/tr>\n<tr>\n<td>IAM<\/td>\n<td>Identity and access management lifecycle and controls<\/td>\n<\/tr>\n<tr>\n<td>Incident response<\/td>\n<td>Coordinated process to manage and recover from security events<\/td>\n<\/tr>\n<tr>\n<td>Integrity<\/td>\n<td>Preventing unauthorized or accidental modification<\/td>\n<\/tr>\n<tr>\n<td>Least privilege<\/td>\n<td>Granting only the rights needed for a task, only as long as needed<\/td>\n<\/tr>\n<tr>\n<td>PCI DSS / GDPR / HIPAA<\/td>\n<td>Examples of contractual/regulatory regimes; applicability is jurisdiction-specific<\/td>\n<\/tr>\n<tr>\n<td>Red team<\/td>\n<td>Authorized adversary simulation<\/td>\n<\/tr>\n<tr>\n<td>Risk<\/td>\n<td>Effect of uncertainty on objectives; combines context, likelihood and impact<\/td>\n<\/tr>\n<tr>\n<td>SIEM<\/td>\n<td>Platform that collects, normalizes, correlates and queries security telemetry<\/td>\n<\/tr>\n<tr>\n<td>Sigma<\/td>\n<td>Vendor-neutral detection rule format<\/td>\n<\/tr>\n<tr>\n<td>Threat model<\/td>\n<td>Structured reasoning about assets, trust boundaries, threats and mitigations<\/td>\n<\/tr>\n<tr>\n<td>TLS<\/td>\n<td>Protocol providing authenticated, encrypted transport<\/td>\n<\/tr>\n<tr>\n<td>Vulnerability<\/td>\n<td>Weakness that can be exploited; not automatically an incident<\/td>\n<\/tr>\n<tr>\n<td>Zero trust<\/td>\n<td>Design approach that verifies explicitly and assumes no implicit network trust<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"12-final-completion-checklist\">12. Final completion checklist<\/h2>\n<ul>\n<li>[ ] 365 daily cards have a journal entry and evidence link.<\/li>\n<li>[ ] 15 projects are published or privately archived with READMEs.<\/li>\n<li>[ ] Monthly scorecards M1-M12 are complete.<\/li>\n<li>[ ] M3/M6/M9/M12 milestone gates are passed.<\/li>\n<li>[ ] Three final practicals and capstone defence are complete.<\/li>\n<li>[ ] Portfolio audit found no secrets, personal data or unauthorized exploit material.<\/li>\n<li>[ ] Certification decision cites current official pages and a real reason.<\/li>\n<li>[ ] Year 2 plan has a narrow specialization, peer group, 90-day sprint and review date.<\/li>\n<li>[ ] Lab is restored to a clean, isolated state; no billable cloud resources are running.<\/li>\n<\/ul>","toc":[[1,"volume-1-master-roadmap-and-learning-system","Volume 1 — Master roadmap and learning system"],[2,"1-assumptions-and-scope","1. Assumptions and scope"],[2,"2-workload-tracks","2. Workload tracks"],[2,"3-seven-levels-of-competence","3. Seven levels of competence"],[2,"4-measurable-milestones","4. Measurable milestones"],[2,"5-curriculum-dependency-map-modules-a-k","5. Curriculum dependency map (Modules A-K)"],[2,"6-twelve-month-overview","6. Twelve-month overview"],[2,"7-daily-weekly-and-monthly-study-system","7. Daily, weekly and monthly study system"],[3,"daily-learning-checklist-print-this","Daily learning checklist (print this)"],[3,"weekly-review-day-7","Weekly review (Day 7)"],[3,"monthly-assessment","Monthly assessment"],[3,"spaced-repetition-and-active-recall","Spaced repetition and active recall"],[3,"technical-journals","Technical journals"],[2,"8-assessment-gates-and-progression-rules","8. Assessment gates and progression rules"],[2,"9-primary-specialization-recommendation","9. Primary specialization recommendation"],[2,"10-navigation-and-reading-order","10. Navigation and reading order"],[2,"11-glossary-core-terms","11. Glossary (core terms)"],[2,"12-final-completion-checklist","12. Final completion checklist"]],"pdf":"Volume_1_Master_Roadmap_and_Study_System.pdf"},{"id":"vol5","title":"Volume 5 — Resource Directory (guide)","subtitle":"Selection principles, classification, coverage matrix, gap analysis and playlist policy","html":"<h1 id=\"volume-5-resource-directory-coverage-matrix-and-verification-register\">Volume 5 — Resource directory, coverage matrix and verification register<\/h1>\n<p><strong>Verification date: 2026-10-27.<\/strong> Every URL in the registry was checked with an automated HTTP request from this workspace. A <code>200<\/code> means the endpoint responded; it does not guarantee that a specific paid/free feature remains available in every country. A <code>403<\/code>, <code>429<\/code>, <code>202<\/code> or TLS issue is explicitly labelled as an automated-checker limitation and has a backup resource. No link was assumed to work simply because it looked plausible.<\/p>\n<h2 id=\"selection-principles\">Selection principles<\/h2>\n<ol>\n<li><strong>Primary source bias.<\/strong> Official documentation, university courses, standards and project-maintained labs outrank popularity.<\/li>\n<li><strong>One primary per objective.<\/strong> Supplementary material is used for alternate explanation and coverage gaps, not endless course collecting.<\/li>\n<li><strong>Free first.<\/strong> Paid resources are labelled and always paired with a free alternative.<\/li>\n<li><strong>Current plus old-but-gold.<\/strong> Older material is used only when the model/concept remains durable; dated commands and tool UIs must be checked against current docs.<\/li>\n<li><strong>No invented timestamps.<\/strong> For video, the PDF names the course, playlist, module or objective code. Use the chapters actually visible on the video page.<\/li>\n<li><strong>Legal practice.<\/strong> Lab platforms and vulnerable apps are used only in their authorized form.<\/li>\n<\/ol>\n<h2 id=\"classification\">Classification<\/h2>\n<ul>\n<li><strong>Mandatory<\/strong> — core to this curriculum.<\/li>\n<li><strong>Recommended<\/strong> — fills important gaps or provides a better alternate explanation.<\/li>\n<li><strong>Optional enrichment<\/strong> — useful when time/hardware allows.<\/li>\n<li><strong>Advanced reference<\/strong> — deeper source for Year 2+; not a Year 1 mastery target.<\/li>\n<li><strong>Paid/alternative<\/strong> — paid resource with a free replacement.<\/li>\n<\/ul>\n<h2 id=\"coverage-matrix-and-gaps\">Coverage matrix and gaps<\/h2>\n<p>The matrix uses module letters A-K defined in Volume 1. <code>●<\/code> = primary coverage; <code>○<\/code> = supporting/partial; blank = not intended. Exact supplementary links are in the resource cards.<\/p>\n<table>\n<thead>\n<tr>\n<th>Domain<\/th>\n<th>Primary<\/th>\n<th>Supplementary<\/th>\n<th>Lab/practice<\/th>\n<th>Authoritative reference<\/th>\n<th>Assessment/challenge<\/th>\n<th>Main gap and fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A CS/IT foundations<\/td>\n<td>CS50x 2026 (F01)<\/td>\n<td>OSTEP (F06), Nand2Tetris (F07)<\/td>\n<td>VM setup (F12), Linux Journey (L01)<\/td>\n<td>Python/Git/MDN docs<\/td>\n<td>CS50 problem sets<\/td>\n<td>Hardware timing is advanced; F07 optional projects supply it<\/td>\n<\/tr>\n<tr>\n<td>B Networking<\/td>\n<td>Jeremy's IT Lab (N01)<\/td>\n<td>Professor Messer N10-009 (N04)<\/td>\n<td>Packet Tracer (N15), Wireshark samples (N07)<\/td>\n<td>RFC 9293/791/8200, IANA ports (N14)<\/td>\n<td>Subnetting Practice (N16), Wireshark reports<\/td>\n<td>IPv6/security details need RFCs; N12 fills header gaps<\/td>\n<\/tr>\n<tr>\n<td>C Linux and Windows<\/td>\n<td>Linux Journey (L01) + Microsoft docs (L07-L14)<\/td>\n<td>BashGuide (L03), man7 (L04)<\/td>\n<td>OverTheWire Bandit (L02), pwn.college (L15)<\/td>\n<td>systemd/man-pages/Windows Event Log docs<\/td>\n<td>Bandit, event-log investigation<\/td>\n<td>Full AD deployment needs 16 GB+; diagram-based alternative provided<\/td>\n<\/tr>\n<tr>\n<td>D Programming<\/td>\n<td>Python Tutorial (F08) + CS50 (F01)<\/td>\n<td>Automate the Boring Stuff (P03), py4e (P01)<\/td>\n<td>RegexOne (P04), pytest (P05), SQLite (P07)<\/td>\n<td>Python/Requests/Git docs<\/td>\n<td>Month 4 log parser tool<\/td>\n<td>Java/.NET secure coding not taught; OWASP cheat sheets are language-neutral<\/td>\n<\/tr>\n<tr>\n<td>E Core security<\/td>\n<td>CS50 Cyber (F04) + Professor Messer (C01)<\/td>\n<td>NIST CSF/NIST SP docs<\/td>\n<td>ISC2 free flashcards, Crypto 101 exercises<\/td>\n<td>NIST CSF, NIST SP 800-63B, RFC 8446<\/td>\n<td>Month 5 risk/crypto practical<\/td>\n<td>Formal proofs deferred to Stanford/graduate crypto resources<\/td>\n<\/tr>\n<tr>\n<td>F Web/API<\/td>\n<td>PortSwigger Academy (W01/W02)<\/td>\n<td>OWASP Top 10/API Top 10/ASVS<\/td>\n<td>PortSwigger labs, Juice Shop/WebGoat<\/td>\n<td>MDN HTTP, OWASP Cheat Sheets<\/td>\n<td>Apprentice labs + secure API project<\/td>\n<td>Advanced request smuggling/GraphQL are Year 2+; W03 expert labs postponed<\/td>\n<\/tr>\n<tr>\n<td>G Ethical testing<\/td>\n<td>NIST SP 800-115 (E01)<\/td>\n<td>OWASP WSTG (W06)<\/td>\n<td>Local VMs, HTB Academy free modules<\/td>\n<td>FIRST CVSS, CVE/NVD, HackerOne guidance<\/td>\n<td>PRJ-10 scoped report<\/td>\n<td>Real-world commercial scoping requires supervised experience<\/td>\n<\/tr>\n<tr>\n<td>H Blue team<\/td>\n<td>Microsoft Sentinel/KQL/Sigma (B01/B02/B03)<\/td>\n<td>MITRE ATT&amp;CK, NIST 800-61r3<\/td>\n<td>CyberDefenders, BTLO, EVTX samples<\/td>\n<td>Microsoft/Sigma/Elastic official docs<\/td>\n<td>PRJ-11/12<\/td>\n<td>Paid SIEM ingestion avoided; synthetic/local logs used instead<\/td>\n<\/tr>\n<tr>\n<td>I Cloud/Infra<\/td>\n<td>AWS Security Pillar + Docker/K8s docs<\/td>\n<td>Microsoft Azure, OWASP K8s Top 10<\/td>\n<td>Docker/kind/minikube, Trivy, Checkov<\/td>\n<td>AWS/Azure/K8s/GitHub official docs<\/td>\n<td>PRJ-13/14<\/td>\n<td>No expensive managed cluster; local control-plane emulation has limits<\/td>\n<\/tr>\n<tr>\n<td>J GRC<\/td>\n<td>NIST CSF 2.0 (C06)<\/td>\n<td>CIS Controls, ISO overview, GDPR text<\/td>\n<td>Tabletop risk/IR exercises<\/td>\n<td>NIST SP 800-30/34/53, EUR-Lex<\/td>\n<td>M5/M12 risk register<\/td>\n<td>Full ISO standard is paid; legal applicability needs a qualified adviser<\/td>\n<\/tr>\n<tr>\n<td>K Advanced<\/td>\n<td>pwn.college, OST2, MIT 6.858<\/td>\n<td>Security Engineering, USENIX, Project Zero<\/td>\n<td>pwn.college dojos, Malware Unicorn, Nightmare<\/td>\n<td>Papers, standards, advisories<\/td>\n<td>Year 2+ reproduction<\/td>\n<td>Years of C/assembly/systems prerequisites; not mastered in Year 1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"gap-analysis-exact-supplements\">Gap analysis: exact supplements<\/h2>\n<table>\n<thead>\n<tr>\n<th>Missing/weak subtopic<\/th>\n<th>Why primary course omits it<\/th>\n<th>Exact supplement<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CPU datapath and sequential logic<\/td>\n<td>CS50 is broad and abstract<\/td>\n<td>Nand2Tetris Part I Projects 1-3 (F07)<\/td>\n<\/tr>\n<tr>\n<td>OS process/memory mechanisms<\/td>\n<td>Intro courses emphasize usage<\/td>\n<td>OSTEP Chapters 4-20 and 53-57 (F06)<\/td>\n<\/tr>\n<tr>\n<td>IPv6 extension headers and modern TCP state machine<\/td>\n<td>CCNA course is exam-scoped<\/td>\n<td>RFC 8200 (N12) and RFC 9293 (N10)<\/td>\n<\/tr>\n<tr>\n<td>Linux kernel/user API exact semantics<\/td>\n<td>Linux Journey is beginner text<\/td>\n<td>man7 pages (L04) and systemd.unit (L05)<\/td>\n<\/tr>\n<tr>\n<td>Windows event schema and Sysmon<\/td>\n<td>Intro admin courses focus on UI<\/td>\n<td>Windows Event Log (L09), Sysmon (L11), EVTX samples (B05)<\/td>\n<\/tr>\n<tr>\n<td>Secure coding verification<\/td>\n<td>PortSwigger is exploit-first<\/td>\n<td>OWASP ASVS (C15) and Cheat Sheets (W17)<\/td>\n<\/tr>\n<tr>\n<td>API object-level authorization<\/td>\n<td>General OWASP Top 10 is broad<\/td>\n<td>OWASP API Top 10 (C16) and local API project<\/td>\n<\/tr>\n<tr>\n<td>Detection rule portability<\/td>\n<td>SIEM docs are vendor-specific<\/td>\n<td>SigmaHQ (B03/B04)<\/td>\n<\/tr>\n<tr>\n<td>Cloud control catalog<\/td>\n<td>AWS docs are service-specific<\/td>\n<td>CSA CCM (CL16), NIST CSF (C06)<\/td>\n<\/tr>\n<tr>\n<td>Privacy legal distinctions<\/td>\n<td>Frameworks are voluntary<\/td>\n<td>GDPR official text (C24) and NIST Privacy Framework (C25)<\/td>\n<\/tr>\n<tr>\n<td>Research paper critique<\/td>\n<td>Cert courses use summaries<\/td>\n<td>MIT 6.858 (A06) and USENIX Security (A12)<\/td>\n<\/tr>\n<tr>\n<td>Low-level RE prerequisites<\/td>\n<td>Tool tutorials assume assembly<\/td>\n<td>OST2 Arch1001 (A04) and pwn.college Linux Luminarium (A01)<\/td>\n<\/tr>\n<tr>\n<td>AI application security<\/td>\n<td>Classical web courses predate LLM apps<\/td>\n<td>OWASP LLM Top 10 (A15) and NIST AI RMF (A16)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"do-not-waste-time\">Do not waste time<\/h2>\n<ul>\n<li><strong>Do not complete three beginner courses for the same topic.<\/strong> Use one primary and one supplementary.<\/li>\n<li><strong>Do not watch entire playlists sequentially when a single objective is weak.<\/strong> Use the course index by objective code.<\/li>\n<li><strong>Do not collect tools.<\/strong> Master Wireshark, Nmap, Burp, Python, Git, Docker, KQL/Sigma and one cloud model deeply.<\/li>\n<li><strong>Do not buy exam vouchers for motivation.<\/strong> Buy only after current objectives, free practice and a concrete job/education reason.<\/li>\n<li><strong>Do not buy SANS/GIAC, OSCP, BTL1 or HTB subscriptions in Month 1.<\/strong> Their value depends on prior foundations and supervised practice.<\/li>\n<li><strong>Do not copy write-ups.<\/strong> Struggle, hint, docs, then solution; always re-solve with a variation.<\/li>\n<li><strong>Do not deploy vulnerable apps publicly.<\/strong> Use loopback/host-only/internal networks and snapshots.<\/li>\n<li><strong>Do not confuse framework compliance with security.<\/strong> A control matrix is not evidence that a control works.<\/li>\n<\/ul>\n<h2 id=\"lesser-known-but-credible-resources\">Lesser-known but credible resources<\/h2>\n<table>\n<thead>\n<tr>\n<th>Resource<\/th>\n<th>What it teaches better than a generic alternative<\/th>\n<th>Prerequisite<\/th>\n<th>Safe use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>OSTEP (F06)<\/td>\n<td>OS mechanisms, not just commands; security chapters added<\/td>\n<td>C/Unix basics<\/td>\n<td>Selected chapters, homework questions<\/td>\n<\/tr>\n<tr>\n<td>OpenSecurityTraining2 (A03/A04)<\/td>\n<td>x86-64 assembly from a systems-security viewpoint<\/td>\n<td>C and binary arithmetic<\/td>\n<td>Year 2+, disposable VM<\/td>\n<\/tr>\n<tr>\n<td>pwn.college (A01/L15)<\/td>\n<td>University-grade Linux, web, memory and exploitation challenge ladder<\/td>\n<td>Linux/C/Python<\/td>\n<td>Free dojo, browser workspace, no external targets<\/td>\n<\/tr>\n<tr>\n<td>Practical Networking Subnetting Mastery (N17)<\/td>\n<td>Visual subnetting method, avoids rote tricks<\/td>\n<td>Binary/IP<\/td>\n<td>Month 2 daily practice<\/td>\n<\/tr>\n<tr>\n<td>Greg's Wiki BashGuide (L03)<\/td>\n<td>Correct quoting and word-splitting model<\/td>\n<td>Basic shell<\/td>\n<td>Audit scripts only on own files<\/td>\n<\/tr>\n<tr>\n<td>EVTX-ATTACK-SAMPLES (B05)<\/td>\n<td>Realistic synthetic Windows telemetry for detection tests<\/td>\n<td>Windows logs<\/td>\n<td>Data only; isolated VM; do not execute binaries<\/td>\n<\/tr>\n<tr>\n<td>SigmaHQ (B03/B04)<\/td>\n<td>Vendor-neutral detection-as-code rules<\/td>\n<td>Logs/ATT&amp;CK<\/td>\n<td>Write rules, test on synthetic events<\/td>\n<\/tr>\n<tr>\n<td>Malware Traffic Analysis (B08)<\/td>\n<td>Realistic PCAP exercise archive<\/td>\n<td>Wireshark/TCP/IP<\/td>\n<td>Never execute samples; use disposable VM<\/td>\n<\/tr>\n<tr>\n<td>Security Engineering 3e (A08)<\/td>\n<td>Technical, human and economic failure modes together<\/td>\n<td>Broad security basics<\/td>\n<td>One chapter/month in Year 2+<\/td>\n<\/tr>\n<tr>\n<td>Nightmare / RPISEC MBE (A09/A10)<\/td>\n<td>Progressive binary-exploitation challenge structure<\/td>\n<td>C, assembly, GDB, Linux<\/td>\n<td>Year 2-3 only, isolated VMs, modern mitigations checked<\/td>\n<\/tr>\n<tr>\n<td>Project Zero / USENIX / CISA KEV<\/td>\n<td>Root-cause research, peer-reviewed work, exploitation evidence<\/td>\n<td>Advanced domain knowledge<\/td>\n<td>Read and reproduce safe measurements only<\/td>\n<\/tr>\n<tr>\n<td>SLSA / OpenSSF Scorecard / Semgrep<\/td>\n<td>Concrete software supply-chain controls, not vague DevSecOps slogans<\/td>\n<td>Git/CI<\/td>\n<td>Use on sanitized public repos<\/td>\n<\/tr>\n<tr>\n<td>Kubernetes Goat / OWASP K8s Top 10<\/td>\n<td>Hands-on cluster misconfigurations without public cloud<\/td>\n<td>Docker/K8s basics<\/td>\n<td>Local disposable cluster, 16 GB+ RAM<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"youtube-publication-date-policy\">YouTube publication-date policy<\/h2>\n<ul>\n<li>Check the individual video's upload date on YouTube before citing it.<\/li>\n<li>If a course index lists an objective code/version, that version controls more than the upload date.<\/li>\n<li><strong>Old but gold<\/strong> means core models remain valid (TCP, x86, crypto primitives, OS mechanisms), not that all commands/UI are current.<\/li>\n<li>Security+ SY0-701 videos are useful for concepts until V8/SY0-801 launches; do not use them as the sole exam prep after the version switch.<\/li>\n<li>Jeremy's IT Lab playlist originated in 2020 and has been augmented; verify current Cisco exam topics before certification.<\/li>\n<li>MIT 6.858 (2014) and Malware Unicorn RE101 (2019) are pedagogically strong but require updated tools and VM images.<\/li>\n<\/ul>","toc":[[1,"volume-5-resource-directory-coverage-matrix-and-verification-register","Volume 5 — Resource directory, coverage matrix and verification register"],[2,"selection-principles","Selection principles"],[2,"classification","Classification"],[2,"coverage-matrix-and-gaps","Coverage matrix and gaps"],[2,"gap-analysis-exact-supplements","Gap analysis: exact supplements"],[2,"do-not-waste-time","Do not waste time"],[2,"lesser-known-but-credible-resources","Lesser-known but credible resources"],[2,"youtube-publication-date-policy","YouTube publication-date policy"]],"pdf":"Volume_5_Resource_Directory_and_Verification.pdf"},{"id":"vol6","title":"Volume 6 — Lab, Projects, Assessments and Career","subtitle":"Home lab, project system, scorecards, certification plan, GitHub and career preparation","html":"<h1 id=\"volume-6-lab-projects-assessments-certifications-portfolio-and-career\">Volume 6 — Lab, projects, assessments, certifications, portfolio and career<\/h1>\n<h2 id=\"1-affordable-home-lab\">1. Affordable home lab<\/h2>\n<h3 id=\"minimum-hardware\">Minimum hardware<\/h3>\n<ul>\n<li>CPU: 64-bit dual-core with virtualization (Intel VT-x/AMD-V); 4 threads recommended.<\/li>\n<li>RAM: <strong>8 GB minimum<\/strong> (host + one 2 GB Linux VM + browser labs). 16 GB strongly recommended; 32 GB for Windows Server/AD/Kubernetes.<\/li>\n<li>Storage: <strong>80 GB free minimum<\/strong>, 256 GB SSD recommended for snapshots.<\/li>\n<li>OS: Windows, Linux or macOS host; VirtualBox/KVM/Hyper-V.<\/li>\n<li>Network: intermittent internet for downloads; keep labs isolated offline.<\/li>\n<\/ul>\n<h3 id=\"recommended-hardware\">Recommended hardware<\/h3>\n<ul>\n<li>4-8 core CPU, 16-32 GB RAM, 512 GB SSD, external backup drive.<\/li>\n<li>One Ubuntu LTS VM (2-4 GB RAM), one Windows evaluation VM (4 GB RAM), Docker Engine on Linux, optional kind/minikube cluster.<\/li>\n<li>Browser-based labs when RAM is low: PortSwigger, TryHackMe free rooms, pwn.college workspace, CyberDefenders datasets.<\/li>\n<\/ul>\n<h3 id=\"official-installation-sources\">Official installation sources<\/h3>\n<ul>\n<li>VirtualBox manual: <a href=\"https://www.virtualbox.org/manual/\">https://www.virtualbox.org/manual/<\/a><\/li>\n<li>Ubuntu help: <a href=\"https://help.ubuntu.com/\">https://help.ubuntu.com/<\/a><\/li>\n<li>Docker Engine docs: <a href=\"https://docs.docker.com/\">https://docs.docker.com/<\/a><\/li>\n<li>Kubernetes docs / kind / minikube: <a href=\"https://kubernetes.io/docs/home/\">https://kubernetes.io/docs/home/<\/a>, <a href=\"https://kind.sigs.k8s.io/\">https://kind.sigs.k8s.io/<\/a>, <a href=\"https://minikube.sigs.k8s.io/docs/\">https://minikube.sigs.k8s.io/docs/<\/a><\/li>\n<li>Windows evaluation / developer VMs: use only Microsoft's official pages <a href=\"https://www.microsoft.com/en-us/evalcenter/\">https://www.microsoft.com/en-us/evalcenter/<\/a> and <a href=\"https://developer.microsoft.com/en-us/windows/downloads/virtual-machines/\">https://developer.microsoft.com/en-us/windows/downloads/virtual-machines/<\/a><\/li>\n<li>Wireshark: <a href=\"https://www.wireshark.org/docs/wsug_html_chunked/\">https://www.wireshark.org/docs/wsug_html_chunked/<\/a><\/li>\n<li>Packet Tracer: <a href=\"https://www.netacad.com/courses/packet-tracer\">https://www.netacad.com/courses/packet-tracer<\/a><\/li>\n<li>OWASP Juice Shop: <a href=\"https://github.com/juice-shop/juice-shop\">https://github.com/juice-shop/juice-shop<\/a><\/li>\n<li>DVWA: <a href=\"https://github.com/digininja/DVWA\">https://github.com/digininja/DVWA<\/a><\/li>\n<li>Kubernetes Goat: <a href=\"https://madhuakula.com/kubernetes-goat/\">https://madhuakula.com/kubernetes-goat/<\/a><\/li>\n<\/ul>\n<h3 id=\"network-isolation\">Network isolation<\/h3>\n<p>Use NAT for updates, host-only/internal adapters for vulnerable services, and never bridge intentionally vulnerable VMs to a university/hostel/public LAN. Bind local web apps to <code>127.0.0.1<\/code> or an internal adapter only. Do not expose lab ports on your router. Keep host firewall/AV enabled; do not disable essential security controls as routine practice. Take a clean snapshot before each risky lab and write down the restore point. Use synthetic data, not personal files.<\/p>\n<h3 id=\"vm-vs-container-vs-browser-lab\">VM vs container vs browser lab<\/h3>\n<table>\n<thead>\n<tr>\n<th>Need<\/th>\n<th>Best tool<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>OS internals, Active Directory, Windows event logs, snapshots, malware-like artifacts<\/td>\n<td>Full VM<\/td>\n<td>Kernel/identity state, snapshot/rollback, stronger isolation<\/td>\n<\/tr>\n<tr>\n<td>Stateless vulnerable web app, scanner, parser<\/td>\n<td>Container<\/td>\n<td>Fast, reproducible, lower RAM<\/td>\n<\/tr>\n<tr>\n<td>Low-end laptop / public Wi-Fi / no admin rights<\/td>\n<td>Browser lab<\/td>\n<td>No install; platform-provided isolation<\/td>\n<\/tr>\n<tr>\n<td>Multi-node Kubernetes<\/td>\n<td>kind/minikube on 16 GB+ host<\/td>\n<td>Local control plane, no cloud bill<\/td>\n<\/tr>\n<tr>\n<td>Real cloud API behaviour<\/td>\n<td>Free-tier cloud account with budgets<\/td>\n<td>Only when local emulation cannot show the service<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Avoid real malware on the host. Malware-traffic datasets are PCAPs/artifacts, not permission to execute suspicious binaries. For any RE/malware lab in Year 2+, use a disposable VM with no shared clipboard, no bridged adapter and no personal credentials.<\/p>\n<h3 id=\"cloud-cost-safety\">Cloud cost safety<\/h3>\n<ol>\n<li>Read current Free Tier terms (<a href=\"https://aws.amazon.com/free/\">https://aws.amazon.com/free/<\/a>) before account creation.<\/li>\n<li>Enable MFA on root/owner accounts; never commit access keys.<\/li>\n<li>Create billing alerts/budgets before deploying resources.<\/li>\n<li>Tag every resource with project and expiry date.<\/li>\n<li>Prefer local/synthetic cloud reviews. If you deploy, capture evidence then tear down the same day.<\/li>\n<li>Check the billing page and delete unused volumes, snapshots, IPs and clusters; these often cost money even when VMs are stopped.<\/li>\n<li>Never paste cloud credentials into GitHub, screenshots or PDFs.<\/li>\n<\/ol>\n<h3 id=\"common-setup-problems\">Common setup problems<\/h3>\n<table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>Likely cause<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>VM will not start<\/td>\n<td>Virtualization disabled in BIOS/UEFI or Hyper-V conflict<\/td>\n<td>Enable VT-x/AMD-V; check host hypervisor settings; use VirtualBox manual network chapter<\/td>\n<\/tr>\n<tr>\n<td>No internet in VM<\/td>\n<td>Wrong adapter/DNS/DHCP<\/td>\n<td>NAT for updates; verify <code>ip addr<\/code>, <code>/etc/resolv.conf<\/code>, DHCP lease; do not disable firewall globally<\/td>\n<\/tr>\n<tr>\n<td>SSH timeout<\/td>\n<td>Guest IP changed, service not running, host-only route<\/td>\n<td>Check <code>ip addr<\/code>, <code>systemctl status ssh<\/code>, <code>ss -ltn<\/code>, and VM adapter<\/td>\n<\/tr>\n<tr>\n<td>Port conflict on host<\/td>\n<td>Another service bound to 8080/3000<\/td>\n<td>Use <code>ss -ltnp<\/code> or <code>netstat -ano<\/code>, choose another loopback port<\/td>\n<\/tr>\n<tr>\n<td>Docker permission denied<\/td>\n<td>User not in docker group or daemon not running<\/td>\n<td>Use official docs; avoid <code>curl | sh<\/code> scripts from random sources; consider rootless Docker<\/td>\n<\/tr>\n<tr>\n<td>Windows events missing<\/td>\n<td>Audit policy/Sysmon config not applied<\/td>\n<td>Verify Event Viewer, audit policy and Sysmon service; reapply in a clean snapshot<\/td>\n<\/tr>\n<tr>\n<td>Kubernetes cluster high RAM<\/td>\n<td>Too many nodes/control-plane components<\/td>\n<td>Use single-node kind/minikube, 2-4 GB RAM, stop cluster after lab<\/td>\n<\/tr>\n<tr>\n<td>Packet Tracer file missing<\/td>\n<td>Registration/download issue<\/td>\n<td>Use official NetAcad course; backup with network diagrams and Wireshark local captures<\/td>\n<\/tr>\n<tr>\n<td>Cloud surprise bill<\/td>\n<td>Free-tier expiry, orphaned storage/IPs<\/td>\n<td>Budget alerts, tags, daily teardown, billing dashboard check<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"2-project-system\">2. Project system<\/h2>\n<p>Every month has at least one deliverable. All projects use synthetic data, isolated labs and systems you own or are explicitly authorized to test. Every project section includes problem, objective, prerequisites, architecture, tools, milestones, expected results, validation, common mistakes, troubleshooting, evidence, report template, GitHub structure, README, security boundaries, rubric and extension challenges.<\/p>\n<h3 id=\"shared-github-structure\">Shared GitHub structure<\/h3>\n<pre><code class=\"language-text\">project-name/\n  README.md\n  LICENSE\n  CHANGELOG.md\n  .gitignore\n  docs/\n    problem.md\n    architecture.md\n    threat-model.md\n    report.md\n    limitations.md\n  src/ or manifests/\n  tests/\n  data/synthetic/\n  evidence/sanitized/\n  scripts/setup.sh\n<\/code><\/pre>\n<h3 id=\"readme-template\">README template<\/h3>\n<ol>\n<li>One-sentence problem statement; 2. Scope/authorization statement; 3. Architecture diagram; 4. exact setup commands; 5. usage examples; 6. tests/validation; 7. findings/results; 8. limitations and lessons learned; 9. sanitization notes; 10. licence/acknowledgements.<\/li>\n<\/ol>\n<h3 id=\"report-template\">Report template<\/h3>\n<p>Executive summary → scope and rules → architecture/data → methodology → findings with evidence → risk/priority → remediation → retest → residual risk → timeline → appendices. Clearly label facts, interpretations and assumptions. Never publish secrets, private personal data, sensitive logs or unauthorized exploit material.<\/p>\n<h3 id=\"common-project-rubric-100-points\">Common project rubric (100 points)<\/h3>\n<p>Conceptual understanding 20; practical execution 25; independent problem-solving 15; troubleshooting 15; documentation 15; safety/ethics 10. Passing = 70, with safety ≥9 and practical ≥18. Project-specific validation tests in each card override generic claims.<\/p>\n<h2 id=\"3-assessments-and-mastery-gates\">3. Assessments and mastery gates<\/h2>\n<h3 id=\"monthly-practicals\">Monthly practicals<\/h3>\n<table>\n<thead>\n<tr>\n<th>Month<\/th>\n<th>Timed practical<\/th>\n<th>Critical prerequisite gate<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>M1<\/td>\n<td>Configure clean VM, users, local service, SQL query, Git evidence<\/td>\n<td>CLI, permissions, VM isolation<\/td>\n<\/tr>\n<tr>\n<td>M2<\/td>\n<td>20 subnetting questions, unknown PCAP, broken topology, scope judgement<\/td>\n<td>OSI/TCP/IP, CIDR, Wireshark, authorized Nmap<\/td>\n<\/tr>\n<tr>\n<td>M3<\/td>\n<td>Linux/Windows hardening, event-log timeline, Bash/PowerShell script<\/td>\n<td>Users/processes/logs, identity boundaries<\/td>\n<\/tr>\n<tr>\n<td>M4<\/td>\n<td>Unseen log format parser, tests, normalized schema, short report<\/td>\n<td>Python, regex, files, Git, testing<\/td>\n<\/tr>\n<tr>\n<td>M5<\/td>\n<td>Risk register, crypto primitive selection, IAM design, IR decision<\/td>\n<td>CIA/AAA, crypto purpose, risk model<\/td>\n<\/tr>\n<tr>\n<td>M6<\/td>\n<td>Find/fix two local web bugs, API authorization design, remediation report<\/td>\n<td>HTTP, sessions, server-side controls<\/td>\n<\/tr>\n<tr>\n<td>M7<\/td>\n<td>Scoped local assessment, evidence, validation, report, retest<\/td>\n<td>Written scope, no unauthorized targets<\/td>\n<\/tr>\n<tr>\n<td>M8<\/td>\n<td>Synthetic alert investigation, KQL/Sigma rule, incident report<\/td>\n<td>Log normalization, ATT&amp;CK, confidence<\/td>\n<\/tr>\n<tr>\n<td>M9<\/td>\n<td>Cloud/K8s/Docker/CI/IaC misconfiguration review<\/td>\n<td>IAM, shared responsibility, isolation<\/td>\n<\/tr>\n<tr>\n<td>M10<\/td>\n<td>Unfamiliar specialization problem + technical defence<\/td>\n<td>Primary docs, independent debugging<\/td>\n<\/tr>\n<tr>\n<td>M11<\/td>\n<td>Capstone implementation, failure injection, investigation, report<\/td>\n<td>Full stack, threat model, evidence<\/td>\n<\/tr>\n<tr>\n<td>M12<\/td>\n<td>Three final practicals + capstone defence<\/td>\n<td>All gates<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"six-step-failure-repair\">Six-step failure repair<\/h3>\n<ol>\n<li><strong>Identify the gap:<\/strong> score each rubric category and write the exact failed claim/command.<\/li>\n<li><strong>Revisit primary lesson:<\/strong> return to today's exact section; do not rewatch the whole course.<\/li>\n<li><strong>Use alternate explanation:<\/strong> use the supplementary resource or a different medium (diagram, RFC, man page).<\/li>\n<li><strong>Repeat exercise:<\/strong> same objective, new input; record prediction before result.<\/li>\n<li><strong>New exercise:<\/strong> solve a modified problem with no worked solution and write a short postmortem.<\/li>\n<li><strong>Retest:<\/strong> new 10-question or 30-minute practical; require ≥80% and no safety error before proceeding.<\/li>\n<\/ol>\n<p>If two consecutive attempts fail, reduce scope to a prerequisite module for three days and notify your mentor/peer. Do not hide failed attempts; error logs are evidence of learning.<\/p>\n<h2 id=\"4-certification-planning-verified-2026-10-27\">4. Certification planning (verified 2026-10-27)<\/h2>\n<p>Prices are official list prices where displayed; taxes, currency, region and promotions can change. Always re-open the official page before paying. No proprietary exam questions are reproduced.<\/p>\n<table>\n<thead>\n<tr>\n<th>Certification<\/th>\n<th>Current official title/version<\/th>\n<th>Prerequisites<\/th>\n<th>Exam cost shown<\/th>\n<th>Training cost<\/th>\n<th>Renewal/maintenance<\/th>\n<th>Consider<\/th>\n<th>What it does not prove<\/th>\n<th>Free alternative<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ISC2 CC<\/td>\n<td>Certified in Cybersecurity; outline effective 2026-09-01<\/td>\n<td>No work experience; application/endorsement process<\/td>\n<td>US$199 in official pricing table for listed regions incl. Asia Pacific; local tax/currency at Pearson<\/td>\n<td>Official self-paced/live training is paid; free flashcards/quiz/outline exist<\/td>\n<td>Annual maintenance/CPE obligations apply; verify current CPE handbook<\/td>\n<td>Month 12 if a voucher or an employer/university requests it<\/td>\n<td>Hands-on SOC/AppSec ability; real incident judgement<\/td>\n<td>CS50 Cyber, Professor Messer, ISC2 free flashcards, this roadmap<\/td>\n<\/tr>\n<tr>\n<td>CompTIA Security+<\/td>\n<td>V7 SY0-701 current; V8 SY0-801 expected 2026-11-17; V7 English retirement listed 2027-06-11<\/td>\n<td>Recommended Network+ plus ~2 years admin/security experience, but no formal prerequisite<\/td>\n<td>V7 voucher shown US$404 on CompTIA price page/blog; verify current store and V8 price<\/td>\n<td>CertMaster Learn/Labs/Practice paid; free Professor Messer videos<\/td>\n<td>3-year cycle, 50 CEUs or higher cert/CertMaster CE; official CE fee listed US$150 over 3 years<\/td>\n<td>Only if a job/degree filter explicitly asks; prefer V8 after objectives settle<\/td>\n<td>Deep technical execution; practical exams are limited<\/td>\n<td>Professor Messer SY0-701, NIST/ISC2 free resources, local labs<\/td>\n<\/tr>\n<tr>\n<td>Cisco CCST Cybersecurity<\/td>\n<td>100-160 CCST Cybersecurity<\/td>\n<td>None<\/td>\n<td>US$125, 50 minutes<\/td>\n<td>Free Cisco Junior Cybersecurity Analyst career path; paid instructor options exist<\/td>\n<td>Cisco states 5-year validity for certifications earned from 2025-07-15; verify current rules<\/td>\n<td>Month 5-12 if local employer values Cisco credentials<\/td>\n<td>Broad hands-on engineering<\/td>\n<td>Cisco free career path + this roadmap's networking/security labs<\/td>\n<\/tr>\n<tr>\n<td>Microsoft SC-900<\/td>\n<td>Security, Compliance and Identity Fundamentals<\/td>\n<td>Beginner; Azure/M365 familiarity helpful<\/td>\n<td>Region-based; US price commonly listed as US$99 but verify at checkout<\/td>\n<td>Microsoft Learn learning paths free<\/td>\n<td>Fundamentals certification currently does not expire per Microsoft policy; verify<\/td>\n<td>Optional after M5/M9 if targeting Microsoft ecosystem<\/td>\n<td>General security skill; product-specific knowledge<\/td>\n<td>Four free SC-900 Learn paths, free practice assessment<\/td>\n<\/tr>\n<tr>\n<td>Microsoft SC-200<\/td>\n<td>Security Operations Analyst Associate<\/td>\n<td>SOC/KQL/Sentinel/Defender experience recommended<\/td>\n<td>Region-based; US associate price typically US$165 but verify official schedule page<\/td>\n<td>Microsoft Learn free; instructor/practice options paid<\/td>\n<td>Annual free renewal assessment on Microsoft Learn<\/td>\n<td>Year 2 if you choose Microsoft-aligned detection engineering<\/td>\n<td>Vendor-independent detection engineering<\/td>\n<td>KQL docs, Sigma, CyberDefenders, BTLO, local SIEM-like labs<\/td>\n<\/tr>\n<tr>\n<td>AWS Security Specialty<\/td>\n<td>SCS-C03 AWS Certified Security - Specialty<\/td>\n<td>Official recommendation: ~5 years IT security and 2+ years AWS security<\/td>\n<td>US$300 on official exam page<\/td>\n<td>AWS Skill Builder free/paid; labs may cost<\/td>\n<td>3-year validity; official recertification now lists exam or Skill Builder maintenance path—verify in your account<\/td>\n<td>Year 2+ after real AWS work, not Month 12<\/td>\n<td>General cloud security or hands-on skill<\/td>\n<td>AWS Security Pillar, free Skill Builder digital courses, local IaC reviews<\/td>\n<\/tr>\n<tr>\n<td>BTL1<\/td>\n<td>Blue Team Level 1 (Centri, formerly Security Blue Team)<\/td>\n<td>0-2 years recommended<\/td>\n<td>£399 GBP training/exam bundle, one free resit included (official page)<\/td>\n<td>Included in bundle<\/td>\n<td>Lifetime certification per official page<\/td>\n<td>Year 2 if employer funds it and you already completed free blue-team projects<\/td>\n<td>Production SOC judgement<\/td>\n<td>CyberDefenders, BTLO free labs, Autopsy, Sigma/KQL, PRJ-11/12<\/td>\n<\/tr>\n<tr>\n<td>eJPT<\/td>\n<td>INE Junior Penetration Tester<\/td>\n<td>Basic networking/Linux/Windows; no formal prerequisite<\/td>\n<td>Official page says INE subscription + voucher required; checkout lists voucher/bundle prices; verify current total<\/td>\n<td>INE subscription/bundle paid<\/td>\n<td>Valid three years per official page<\/td>\n<td>Optional after M7 if you can afford it and have local reports<\/td>\n<td>Professional scoping/reporting under real clients<\/td>\n<td>NIST SP 800-115, local VMs, HTB Academy free modules, PRJ-10<\/td>\n<\/tr>\n<tr>\n<td>OSCP+ / PEN-200<\/td>\n<td>OffSec Certified Professional / OSCP+<\/td>\n<td>Strong TCP/IP, Linux/Windows, scripting recommended<\/td>\n<td>Official page: US$1,699 standalone exam; US$1,749 course+exam bundle<\/td>\n<td>Included in PEN-200 bundles; Learn One US$2,749/year<\/td>\n<td>OSCP lifetime; OSCP+ expires after 3 years unless maintained<\/td>\n<td>Year 2-3 only with consistent independent pentest practice<\/td>\n<td>Vulnerability research or elite status<\/td>\n<td>pwn.college, HTB, local AD labs, report writing<\/td>\n<\/tr>\n<tr>\n<td>CompTIA CySA+ / PenTest+ / GIAC / CISSP<\/td>\n<td>Various intermediate/advanced credentials<\/td>\n<td>Depends on credential; CISSP requires experience<\/td>\n<td>Check each official page; not recommended this year<\/td>\n<td>Often high<\/td>\n<td>Varies<\/td>\n<td>Not Year 1 priorities<\/td>\n<td>Job-ready skill by themselves<\/td>\n<td>Free blue/red projects and primary documentation<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Readiness checklist:<\/strong> current official objectives downloaded; ≥80% on two free/self-generated practice exams; portfolio evidence mapped to each domain; budget includes retake/renewal; reason for exam is written; practical projects already demonstrate skill. Practice strategy: closed-book timed attempt → mark confidence on each answer → error taxonomy (concept, wording, arithmetic, fatigue) → targeted revision → new self-generated questions → spaced retest after 3 and 7 days. Never use brain dumps.<\/p>\n<h2 id=\"5-github-and-professional-portfolio\">5. GitHub and professional portfolio<\/h2>\n<p>A strong portfolio is not a folder of screenshots. It shows a problem, a decision, evidence, a failed attempt, a fix, a test and a limitation. Use meaningful commits, issues, tags and release notes. Add architecture diagrams as SVG and sanitized screenshots; redact IPs, MACs, usernames, hostnames, tokens, private paths and personal data. Include an explicit scope statement on security work. Never publish credentials, secrets, private logs or unauthorized exploit material.<\/p>\n<p><strong>Superficial project:<\/strong> copied Dockerfile, no README, one happy-path screenshot, no tests, no limitations. <strong>Original project:<\/strong> states a problem, threat model, 2+ design alternatives, implementation rationale, reproducible setup, negative tests, false-positive analysis, before/after evidence, lessons learned and a future-work section.<\/p>\n<p>Recommended public index: one <code>portfolio<\/code> README linking 5-8 best projects (not all 15 if quality is uneven), a CV, a lab safety statement, and contact information. Keep private evidence encrypted.<\/p>\n<h2 id=\"6-international-career-preparation\">6. International career preparation<\/h2>\n<h3 id=\"broad-market-patterns-not-employer-guarantees\">Broad market patterns, not employer guarantees<\/h3>\n<p>Entry-level security work in US/European markets commonly appears under titles such as SOC analyst, security analyst, junior detection engineer, security engineer, vulnerability analyst, GRC analyst, application security engineer, cloud security analyst and junior penetration tester. Many \"entry-level\" listings still ask for foundational IT, networking, scripting, cloud and incident exposure. This roadmap provides project evidence but cannot promise employment, salary, visa sponsorship or relocation. Remote work from Pakistan depends on the employer's legal entity, tax, data-access, time-zone and export-control rules.<\/p>\n<p>Use official frameworks to analyze roles: NIST NICE (<a href=\"https://www.nist.gov/itl/applied-cybersecurity/nice\">https://www.nist.gov/itl/applied-cybersecurity/nice<\/a>) for task/skill language; NIST CSF 2.0 for control vocabulary; MITRE ATT&amp;CK for detection roles. No live job listing is used in this PDF as proof of demand. If you analyze a real listing, save the URL and retrieval date, then distinguish must-have skills from preferred tools.<\/p>\n<h3 id=\"job-description-analysis\">Job-description analysis<\/h3>\n<p>Make a table with columns: requirement, evidence in your portfolio, gap level (0-3), proof task, interview story. Ignore inflated years-of-experience claims only after you can show equivalent evidence. Classify product names separately from transferable concepts (e.g., \"Sentinel\" vs \"SIEM correlation\").<\/p>\n<h3 id=\"cv-and-linkedin\">CV and LinkedIn<\/h3>\n<ul>\n<li>One page for an early-career CV; no photo/personal identifiers unnecessary for the target country.<\/li>\n<li>Top: degree, expected graduation, GitHub/portfolio, location/time-zone, work authorization if relevant.<\/li>\n<li>Project bullets use problem → action → evidence → result, e.g., \"Built a Python parser for 3 synthetic log formats; added 25 pytest cases; reduced malformed-line crashes to zero; documented limitations.\"<\/li>\n<li>LinkedIn headline should name target role and evidence, not \"ethical hacker\" buzzwords.<\/li>\n<li>Ask for feedback from a teacher, OSS maintainer or working analyst; track changes.<\/li>\n<\/ul>\n<h3 id=\"interview-practice\">Interview practice<\/h3>\n<p>Prepare five stories: one networking/OS troubleshooting, one secure coding fix, one detection/investigation, one cloud/container misconfiguration, one ethical disagreement. For each, state context, hypothesis, evidence, decision, failure, lesson. Practice explaining uncertainty and what data you would request. Do not claim tool mastery from a badge.<\/p>\n<h3 id=\"internships-and-first-applications\">Internships and first applications<\/h3>\n<p>Apply to internships, university security labs, open-source security projects, CTF teams, local non-profits with written authorization, and junior roles that allow learning. Build an application tracker with date, role, source, requirements, evidence mapping, follow-up date and outcome. Seek feedback, not just offers. For international roles, check official visa/work-authorization sources (e.g., US State Department <a href=\"https://travel.state.gov/content/travel/en/us-visas.html\">https://travel.state.gov/content/travel/en/us-visas.html<\/a> and EU immigration <a href=\"https://home-affairs.ec.europa.eu/\">https://home-affairs.ec.europa.eu/<\/a>), and never assume remote work bypasses work authorization.<\/p><h2 id=\"specialization-comparison-month-8-10-decision-aid\">Specialization comparison (Month 8-10 decision aid)<\/h2>\n<p>Score each row 1-5 for demonstrated interest, project results, programming comfort, local opportunity and available feedback. No path is \"best\" without your evidence.<\/p>\n<table>\n<thead>\n<tr>\n<th>Path<\/th>\n<th>Foundational knowledge<\/th>\n<th>Daily work<\/th>\n<th>Technical depth / programming<\/th>\n<th>Common tools<\/th>\n<th>Strong free resources<\/th>\n<th>Portfolio expectation<\/th>\n<th>Possible entry roles<\/th>\n<th>Long-term opportunities<\/th>\n<th>Typical prerequisites<\/th>\n<th>12-month limitation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Blue Team / SOC Analysis<\/td>\n<td>Networking, OS, logs, ATT&amp;CK<\/td>\n<td>Alert triage, investigation, escalation, reporting<\/td>\n<td>Medium; scripting helpful<\/td>\n<td>SIEM, KQL, EDR, ticketing<\/td>\n<td>Microsoft Learn, SigmaHQ, CyberDefenders, BTLO<\/td>\n<td>Alert investigation, incident report, detection tests<\/td>\n<td>SOC analyst, security analyst<\/td>\n<td>Detection lead, IR, threat hunting<\/td>\n<td>M1-M8 basics<\/td>\n<td>No real shift experience or production scale<\/td>\n<\/tr>\n<tr>\n<td>Detection Engineering<\/td>\n<td>Logs, OS internals, ATT&amp;CK, SQL/KQL<\/td>\n<td>Hypothesis, rule design, testing, tuning, deployment<\/td>\n<td>High; Python/YAML/SQL<\/td>\n<td>Sigma, KQL, Elastic rules, Git, CI<\/td>\n<td>SigmaHQ, KQL docs, Elastic rules, ATT&amp;CK<\/td>\n<td>Rule repo with labelled true/false positives and metrics<\/td>\n<td>Junior detection engineer, SOC analyst<\/td>\n<td>Detection platform/architecture, research<\/td>\n<td>Strong logs and programming<\/td>\n<td>Lab detections may not generalize to enterprise data<\/td>\n<\/tr>\n<tr>\n<td>DFIR<\/td>\n<td>Filesystems, Windows/Linux artifacts, evidence integrity<\/td>\n<td>Acquisition, timeline, artifact analysis, reporting<\/td>\n<td>High; scripting and OS internals<\/td>\n<td>Autopsy, KAPE-like tools, Volatility, Wireshark<\/td>\n<td>Autopsy, SANS webcasts, NIST 800-61r3, EVTX samples<\/td>\n<td>Disk/network/memory case with hash manifest<\/td>\n<td>Junior DFIR analyst, IR analyst<\/td>\n<td>Senior IR, forensic research, expert witness<\/td>\n<td>Evidence handling and OS internals<\/td>\n<td>No legal/casework or real incident pressure<\/td>\n<\/tr>\n<tr>\n<td>Web / API Security<\/td>\n<td>HTTP, auth, databases, secure coding<\/td>\n<td>Code review, testing, remediation, threat modelling<\/td>\n<td>High; one backend language<\/td>\n<td>Burp/ZAP, Semgrep, OWASP ASVS, CI<\/td>\n<td>PortSwigger, OWASP, MDN, GitHub security<\/td>\n<td>Secure app plus authorized assessment/remediation<\/td>\n<td>AppSec analyst, secure software engineer<\/td>\n<td>AppSec architecture, research, product security<\/td>\n<td>M1-M6 plus testing<\/td>\n<td>Advanced vulnerability classes need years<\/td>\n<\/tr>\n<tr>\n<td>Authorized Penetration Testing<\/td>\n<td>Networking, OS, web, scripting, ethics<\/td>\n<td>Scoped discovery, validation, reporting, retest<\/td>\n<td>Medium-high; scripting and OS<\/td>\n<td>Nmap, Burp, AD tools, reporting templates<\/td>\n<td>NIST 800-115, HTB free, pwn.college, local AD lab<\/td>\n<td>Professional scoped report and remediation retest<\/td>\n<td>Junior pentester, security consultant<\/td>\n<td>Senior pentest, red team, security research<\/td>\n<td>Strong M1-M7 + report writing<\/td>\n<td>Certification or CTF badges do not equal client judgement<\/td>\n<\/tr>\n<tr>\n<td>Cloud Security<\/td>\n<td>IAM, networking, logging, containers, shared responsibility<\/td>\n<td>Architecture review, policy, detection, incident response<\/td>\n<td>High; IaC and automation<\/td>\n<td>AWS/Azure docs, Trivy, Checkov, K8s<\/td>\n<td>AWS Security Pillar, Azure security, K8s docs<\/td>\n<td>Synthetic cloud review + IaC/CI hardening<\/td>\n<td>Cloud security analyst, DevSecOps junior<\/td>\n<td>Cloud security architect, platform engineering<\/td>\n<td>M1-M9 and Linux/Docker<\/td>\n<td>No production multi-account experience in Year 1<\/td>\n<\/tr>\n<tr>\n<td>Security Engineering<\/td>\n<td>Secure design, coding, identity, systems, automation<\/td>\n<td>Build controls, review architecture, write tools<\/td>\n<td>Very high; software engineering<\/td>\n<td>Git, CI, SAST/SCA, cloud, observability<\/td>\n<td>OWASP ASVS, GitHub docs, NIST, Security Engineering<\/td>\n<td>Maintained tool/library with tests and design doc<\/td>\n<td>Security engineer, platform security engineer<\/td>\n<td>Staff/principal security architect<\/td>\n<td>Strong CS and programming<\/td>\n<td>Breadth and production trade-offs take years<\/td>\n<\/tr>\n<tr>\n<td>GRC<\/td>\n<td>Risk, policy, controls, audits, privacy<\/td>\n<td>Assessments, evidence, exceptions, reports<\/td>\n<td>Low-medium technically; analysis-heavy<\/td>\n<td>GRC platforms, spreadsheets, NIST/ISO<\/td>\n<td>NIST CSF/SP, CIS Controls, GDPR text<\/td>\n<td>Risk register, control baseline, audit-style report<\/td>\n<td>GRC analyst, risk analyst, compliance associate<\/td>\n<td>Security governance lead, privacy, audit<\/td>\n<td>Business/legal context and strong writing<\/td>\n<td>Framework knowledge without operations is shallow<\/td>\n<\/tr>\n<tr>\n<td>Vulnerability Research<\/td>\n<td>C/assembly, OS, memory, protocols, fuzzing<\/td>\n<td>Root-cause analysis, PoC in authorized lab, disclosure<\/td>\n<td>Very high; C/Python/assembly<\/td>\n<td>Ghidra, GDB, pwntools, fuzzers, VMs<\/td>\n<td>pwn.college, OST2, MIT 6.858, Project Zero<\/td>\n<td>Reproduced bug class, detailed root-cause write-up<\/td>\n<td>Rare junior roles; often via internships/OSS<\/td>\n<td>Researcher, product security, exploit engineering<\/td>\n<td>Several years of low-level foundations<\/td>\n<td>Intro exposure is not research capability<\/td>\n<\/tr>\n<tr>\n<td>Malware Analysis / RE<\/td>\n<td>x86/x64, Windows internals, networking, scripting<\/td>\n<td>Triage, static/dynamic analysis, indicator extraction<\/td>\n<td>Very high; C/Python/assembly<\/td>\n<td>Ghidra, x64dbg, Wireshark, sandboxes<\/td>\n<td>OST2, Malware Unicorn RE101, pwn.college<\/td>\n<td>Safe synthetic sample analysis with isolation evidence<\/td>\n<td>Junior malware analyst, SOC/IR specialist<\/td>\n<td>Threat research, reverse engineering<\/td>\n<td>C/assembly and strict lab safety<\/td>\n<td>Real malware handling requires supervised environment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Decision framework:<\/strong> evidence weight 35%, genuine interest 20%, programming/technical fit 20%, available mentorship/opportunity 15%, opportunity cost 10%. Require at least two strong project results before selecting. Review after 90 days; switching early because a topic is hard is different from switching because evidence shows poor fit.<\/p>\n<p><strong>Recommendation for this profile:<\/strong> primary = Detection Engineering &amp; Security Automation; secondary = Cloud/Container Security. If Month 8-10 sprints contradict this, choose the path with stronger independent problem-solving evidence and better feedback access.<\/p><h2 id=\"printable-trackers\">Printable trackers<\/h2>\n<h3 id=\"daily-checklist-copy-one-per-day\">Daily checklist (copy one per day)<\/h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">#<\/th>\n<th>Item<\/th>\n<th>Done<\/th>\n<th>Evidence / note<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\">1<\/td>\n<td>Read today's card and objective<\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">2<\/td>\n<td>Primary resource section completed<\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">3<\/td>\n<td>Three facts / two questions / one command<\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">4<\/td>\n<td>Practical task completed<\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">5<\/td>\n<td>One error observed or injected<\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">6<\/td>\n<td>Retrieval answer written without notes<\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">7<\/td>\n<td>Evidence file saved and sanitized<\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">8<\/td>\n<td>Journal / Git commit<\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">9<\/td>\n<td>Track used: Core / Standard / Intensive<\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">10<\/td>\n<td>Weak cards scheduled 1/3/7/30/90 days<\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"weekly-tracker\">Weekly tracker<\/h3>\n<table>\n<thead>\n<tr>\n<th>Day<\/th>\n<th>Sequence<\/th>\n<th style=\"text-align: right;\">Hours<\/th>\n<th>Evidence link<\/th>\n<th style=\"text-align: right;\">Concept /5<\/th>\n<th style=\"text-align: right;\">Practical /5<\/th>\n<th style=\"text-align: right;\">Troubleshooting /5<\/th>\n<th>Safety pass<\/th>\n<th>Error log ID<\/th>\n<th>Next action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td
