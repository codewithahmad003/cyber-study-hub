style=\"text-align: right;\"><\/td>\n<td><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td>[ ]<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"monthly-scorecard-100-points\">Monthly scorecard (100 points)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Category<\/th>\n<th style=\"text-align: right;\">Max<\/th>\n<th style=\"text-align: right;\">M1<\/th>\n<th style=\"text-align: right;\">M2<\/th>\n<th style=\"text-align: right;\">M3<\/th>\n<th style=\"text-align: right;\">M4<\/th>\n<th style=\"text-align: right;\">M5<\/th>\n<th style=\"text-align: right;\">M6<\/th>\n<th style=\"text-align: right;\">M7<\/th>\n<th style=\"text-align: right;\">M8<\/th>\n<th style=\"text-align: right;\">M9<\/th>\n<th style=\"text-align: right;\">M10<\/th>\n<th style=\"text-align: right;\">M11<\/th>\n<th style=\"text-align: right;\">M12<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Conceptual understanding<\/td>\n<td style=\"text-align: right;\">20<\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<\/tr>\n<tr>\n<td>Practical execution<\/td>\n<td style=\"text-align: right;\">25<\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<\/tr>\n<tr>\n<td>Independent problem-solving<\/td>\n<td style=\"text-align: right;\">15<\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<\/tr>\n<tr>\n<td>Troubleshooting<\/td>\n<td style=\"text-align: right;\">15<\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<\/tr>\n<tr>\n<td>Documentation<\/td>\n<td style=\"text-align: right;\">15<\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<\/tr>\n<tr>\n<td>Safety and ethics<\/td>\n<td style=\"text-align: right;\">10<\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<\/tr>\n<tr>\n<td><strong>Total<\/strong><\/td>\n<td style=\"text-align: right;\"><strong>100<\/strong><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<\/tr>\n<tr>\n<td><strong>Gate result<\/strong><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><strong>M3<\/strong><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><strong>M6<\/strong><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><strong>M9<\/strong><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><\/td>\n<td style=\"text-align: right;\"><strong>M12<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"error-log-template\">Error log template<\/h3>\n<table>\n<thead>\n<tr>\n<th>ID<\/th>\n<th>Date<\/th>\n<th>Symptom<\/th>\n<th>Hypothesis<\/th>\n<th>Test<\/th>\n<th>Result<\/th>\n<th>Root cause<\/th>\n<th>Fix<\/th>\n<th>New test<\/th>\n<th>Retest<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"command-notebook-template\">Command notebook template<\/h3>\n<table>\n<thead>\n<tr>\n<th>Command / API<\/th>\n<th>Platform<\/th>\n<th>Purpose<\/th>\n<th>Safe example<\/th>\n<th>Dangerous assumption<\/th>\n<th>Verification<\/th>\n<th>Source URL<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"project-log-template\">Project log template<\/h3>\n<table>\n<thead>\n<tr>\n<th>Date<\/th>\n<th>Decision<\/th>\n<th>Alternatives<\/th>\n<th>Evidence<\/th>\n<th>Risk<\/th>\n<th>Result<\/th>\n<th>Follow-up<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"final-completion-checklist\">Final completion checklist<\/h3>\n<ul>\n<li>[ ] 365 daily cards have evidence and retrieval notes.<\/li>\n<li>[ ] 12 monthly scorecards complete; M3/M6/M9/M12 gates passed.<\/li>\n<li>[ ] 15 projects have a problem, architecture, tests, evidence, report, README, boundaries and limitations.<\/li>\n<li>[ ] Final capstone has a clean-install test, threat model, detections, incident report, assessment, remediation and demo.<\/li>\n<li>[ ] All public artifacts are sanitized; no secrets, private logs, personal data or unauthorized exploit material.<\/li>\n<li>[ ] Resource links rechecked on 2026-10-27; backup links documented.<\/li>\n<li>[ ] Certification decision uses current official pages and a written reason.<\/li>\n<li>[ ] CV, LinkedIn and interview stories map to portfolio evidence.<\/li>\n<li>[ ] Year 2 plan has a primary specialization, secondary skill, peer group, 90-day sprint and review date.<\/li>\n<li>[ ] Lab is clean, isolated, backed up and has no active billable cloud resources.<\/li>\n<\/ul>","toc":[[1,"volume-6-lab-projects-assessments-certifications-portfolio-and-career","Volume 6 — Lab, projects, assessments, certifications, portfolio and career"],[2,"1-affordable-home-lab","1. Affordable home lab"],[3,"minimum-hardware","Minimum hardware"],[3,"recommended-hardware","Recommended hardware"],[3,"official-installation-sources","Official installation sources"],[3,"network-isolation","Network isolation"],[3,"vm-vs-container-vs-browser-lab","VM vs container vs browser lab"],[3,"cloud-cost-safety","Cloud cost safety"],[3,"common-setup-problems","Common setup problems"],[2,"2-project-system","2. Project system"],[3,"shared-github-structure","Shared GitHub structure"],[3,"readme-template","README template"],[3,"report-template","Report template"],[3,"common-project-rubric-100-points","Common project rubric (100 points)"],[2,"3-assessments-and-mastery-gates","3. Assessments and mastery gates"],[3,"monthly-practicals","Monthly practicals"],[3,"six-step-failure-repair","Six-step failure repair"],[2,"4-certification-planning-verified-2026-10-27","4. Certification planning (verified 2026-10-27)"],[2,"5-github-and-professional-portfolio","5. GitHub and professional portfolio"],[2,"6-international-career-preparation","6. International career preparation"],[3,"broad-market-patterns-not-employer-guarantees","Broad market patterns, not employer guarantees"],[3,"job-description-analysis","Job-description analysis"],[3,"cv-and-linkedin","CV and LinkedIn"],[3,"interview-practice","Interview practice"],[3,"internships-and-first-applications","Internships and first applications"],[2,"specialization-comparison-month-8-10-decision-aid","Specialization comparison (Month 8-10 decision aid)"],[2,"printable-trackers","Printable trackers"],[3,"daily-checklist-copy-one-per-day","Daily checklist (copy one per day)"],[3,"weekly-tracker","Weekly tracker"],[3,"monthly-scorecard-100-points","Monthly scorecard (100 points)"],[3,"error-log-template","Error log template"],[3,"command-notebook-template","Command notebook template"],[3,"project-log-template","Project log template"],[3,"final-completion-checklist","Final completion checklist"]],"pdf":"Volume_6_Lab_Projects_Assessments_Certifications_Career.pdf"},{"id":"vol7","title":"Volume 7 — Long-Term Blueprint","subtitle":"Years 2-3, years 3-5, beyond year 5, research pathway and specialization decision framework","html":"<h1 id=\"volume-7-multi-year-exceptional-competence-blueprint\">Volume 7 — Multi-year exceptional-competence blueprint<\/h1>\n<h2 id=\"1-the-target-narrow-specialization-real-peer-group\">1. The target: narrow specialization, real peer group<\/h2>\n<p>\"Top 1%\" is meaningful only after defining (a) a narrow field, (b) a credible peer group, and (c) evidence of impact. A reasonable peer group for Year 2-5 might be \"practitioners publishing and reviewing detection engineering work for cloud-native environments\". Another might be \"researchers reproducing and publishing web/API vulnerability classes\". Do not compare yourself to all cybersecurity professionals; compare your work to people doing the same technical job.<\/p>\n<p><strong>Impact signals:<\/strong> an OSS rule/tool used by others; a reproduced finding that changes a design; an advisory with root cause; a detection with measured false-positive reduction; a conference paper or technical article with code/data; a maintained project with issues from strangers; an architecture decision adopted by a team; mentorship that produces independent work. <strong>Vanity signals:<\/strong> follower count, number of certificates, collection of badges, conference selfies, tool lists.<\/p>\n<p>Reputation can amplify genuine skill but does not prove it. Ask: what problem was solved, what evidence supports it, what failed, who independently checked it, and did the result change practice?<\/p>\n<h2 id=\"2-stage-1-years-2-3-deepen-one-specialization\">2. Stage 1 — Years 2-3: deepen one specialization<\/h2>\n<h3 id=\"outcomes\">Outcomes<\/h3>\n<ul>\n<li>Move from guided labs to original tools/detections/experiments.<\/li>\n<li>Read primary docs and research papers every week.<\/li>\n<li>Reproduce one published result safely, including negative results.<\/li>\n<li>Build 2-3 substantial projects with users or credible reviewers.<\/li>\n<li>Participate in legal CTFs/competitions and one open-source community.<\/li>\n<li>Seek an internship, part-time security work, university lab or supervised volunteer work.<\/li>\n<li>Learn technical writing, code review, incident communication and threat modelling.<\/li>\n<li>Develop a repeatable troubleshooting method: observe → hypothesize → test → measure → document.<\/li>\n<\/ul>\n<h3 id=\"90-day-cycles\">90-day cycles<\/h3>\n<p>Each cycle has one measurable technical question, one primary-source reading queue, one artifact, one feedback source and one public/private write-up. Example for detection engineering: \"Can I detect suspicious service-account behaviour in synthetic Kubernetes audit logs with &lt;5% false positives over 10,000 events?\" Artifact: rules + test data + report. Feedback: OSS maintainer or working SOC analyst.<\/p>\n<h3 id=\"year-2-3-milestones\">Year 2-3 milestones<\/h3>\n<table>\n<thead>\n<tr>\n<th>Quarter<\/th>\n<th>Focus<\/th>\n<th>Evidence<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Q1<\/td>\n<td>Specialization foundations and primary docs<\/td>\n<td>12 annotated sources, one original tool/rule, baseline metrics<\/td>\n<\/tr>\n<tr>\n<td>Q2<\/td>\n<td>Reproduction<\/td>\n<td>Reproduced paper/advisory with deviations and limitations<\/td>\n<\/tr>\n<tr>\n<td>Q3<\/td>\n<td>Original project v1<\/td>\n<td>Code, tests, threat model, external feedback, changelog<\/td>\n<\/tr>\n<tr>\n<td>Q4<\/td>\n<td>Impact and communication<\/td>\n<td>Maintained release, technical talk/write-up, internship/application evidence<\/td>\n<\/tr>\n<tr>\n<td>Year 3<\/td>\n<td>Advanced failure modes<\/td>\n<td>New experiment, peer critique, supervised real-world exposure, revised research method<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"3-stage-2-years-3-5-independent-investigation-and-engineering\">3. Stage 2 — Years 3-5: independent investigation and engineering<\/h2>\n<ul>\n<li>Investigate unfamiliar problems where the answer is unknown to you and your mentor.<\/li>\n<li>Build tools/detections/architectures that others can use and critique.<\/li>\n<li>Study implementation details and failure modes: parsers, protocols, kernels, identity protocols, build systems, cloud control planes.<\/li>\n<li>Develop a repeatable research method and a literature matrix.<\/li>\n<li>Evaluate claims critically: source, assumptions, data, baseline, confounders, reproducibility, applicability.<\/li>\n<li>Document original findings with confidence levels, alternative explanations and negative results.<\/li>\n<li>Gain feedback from skilled practitioners through internships, jobs, OSS, conferences and CTFs.<\/li>\n<li>Begin mentoring beginners; teaching reveals weak mental models.<\/li>\n<\/ul>\n<h3 id=\"research-notebook-template\">Research notebook template<\/h3>\n<p><code>Question | Hypothesis | Prior work | Data/source | Method | Prediction | Result | Alternative explanations | Confidence | Reproduction steps | Next experiment | Ethical/legal constraints<\/code><\/p>\n<h3 id=\"how-to-read-a-technical-paper\">How to read a technical paper<\/h3>\n<ol>\n<li>Read abstract, introduction, threat model and evaluation figures first.<\/li>\n<li>Write the main claim in one sentence and list assumptions.<\/li>\n<li>Identify the dataset, baseline and metric; ask whether the metric matches the real goal.<\/li>\n<li>Re-read method; mark anything needed for reproduction.<\/li>\n<li>Check limitations and ethics; distinguish demonstrated result from speculation.<\/li>\n<li>Summarize in your own words before reading commentary.<\/li>\n<li>Reproduce the smallest experiment on synthetic/authorized data; record every deviation.<\/li>\n<li>Write findings, including failures. A negative reproduction with evidence is useful.<\/li>\n<\/ol>\n<h2 id=\"4-stage-3-beyond-year-5-exceptional-practice\">4. Stage 3 — Beyond Year 5: exceptional practice<\/h2>\n<p>Exceptional practitioners continue through specialized research, advanced security engineering, architecture, original vulnerability research where legally authorized, high-quality detection/defensive engineering, open-source maintenance, responsible disclosure, peer review/publication, mentorship, real-incident learning and continuous adaptation. No fixed number of years guarantees top 1% status. Many people with ten years of repeated tasks do not develop deep expertise; some with five years of focused, reviewed, original work become highly influential.<\/p>\n<p>Ways to increase impact:<\/p>\n<ul>\n<li>Choose a problem that recurs across organizations, not a one-off trick.<\/li>\n<li>Build reusable artifacts: datasets, rules, libraries, test harnesses, benchmarks.<\/li>\n<li>Invite adversarial review; publish limitations and corrections.<\/li>\n<li>Contribute to standards/frameworks responsibly.<\/li>\n<li>Practice responsible disclosure with written authorization and safe-harbour clarity.<\/li>\n<li>Lead or review post-incident engineering changes, not just detection content.<\/li>\n<li>Mentor others and build a local/international community of practice.<\/li>\n<\/ul>\n<h2 id=\"5-advanced-practice-ladder\">5. Advanced practice ladder<\/h2>\n<table>\n<thead>\n<tr>\n<th>Level<\/th>\n<th>Behaviour<\/th>\n<th>Detection-engineering example<\/th>\n<th>Web/API example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Following instructions<\/td>\n<td>Reproduce exact steps<\/td>\n<td>Run a provided Sigma rule<\/td>\n<td>Solve a lab with a walkthrough<\/td>\n<\/tr>\n<tr>\n<td>2. Reproducing known examples<\/td>\n<td>Rebuild from memory<\/td>\n<td>Rewrite rule from a technique description<\/td>\n<td>Rebuild an XSS proof of concept locally<\/td>\n<\/tr>\n<tr>\n<td>3. Modified exercises<\/td>\n<td>Change one variable<\/td>\n<td>New log source, same behaviour<\/td>\n<td>Different encoding/context<\/td>\n<\/tr>\n<tr>\n<td>4. Unfamiliar problems<\/td>\n<td>No known answer<\/td>\n<td>Design a rule for a new cloud audit event<\/td>\n<td>Find an authz bug in unseen local code<\/td>\n<\/tr>\n<tr>\n<td>5. Designed experiments<\/td>\n<td>Measure outcomes<\/td>\n<td>10,000 synthetic events, labelled true/false positives, baseline comparison<\/td>\n<td>Build a test harness for parser/authorization bypasses<\/td>\n<\/tr>\n<tr>\n<td>6. Original tools/research<\/td>\n<td>Generalizable contribution<\/td>\n<td>Detection-as-code framework with tests and public dataset<\/td>\n<td>New secure library pattern or vulnerability class analysis<\/td>\n<\/tr>\n<tr>\n<td>7. Defending conclusions<\/td>\n<td>Peer critique<\/td>\n<td>Publish method, limitations, reviewer Q&amp;A, revision history<\/td>\n<td>Responsible disclosure, patch, regression tests, postmortem<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"6-staged-reading-pathway\">6. Staged reading pathway<\/h2>\n<h3 id=\"stage-0-foundations-months-1-12\">Stage 0 — foundations (Months 1-12)<\/h3>\n<ul>\n<li>CS50x and CS50 Cybersecurity notes; OSTEP selected chapters.<\/li>\n<li>Python, MDN HTTP, Pro Git, Wireshark and Linux/Windows official docs.<\/li>\n<li>NIST CSF 2.0, NIST SP 800-61r3, OWASP Top 10/API Top 10/ASVS, MITRE ATT&amp;CK.<\/li>\n<li>Strategy: one section at a time; every reading maps to a lab and an evidence file.<\/li>\n<\/ul>\n<h3 id=\"stage-1-core-books-and-durable-technical-references-years-2-3\">Stage 1 — core books and durable technical references (Years 2-3)<\/h3>\n<ul>\n<li><em>Operating Systems: Three Easy Pieces<\/em> — <a href=\"https://pages.cs.wisc.edu/~remzi/OSTEP/\">https://pages.cs.wisc.edu/~remzi/OSTEP/<\/a><\/li>\n<li><em>Security Engineering<\/em>, 3rd ed. — <a href=\"https://www.cl.cam.ac.uk/~rja14/book.html\">https://www.cl.cam.ac.uk/~rja14/book.html<\/a><\/li>\n<li><em>A Graduate Course in Applied Cryptography<\/em> — <a href=\"https://toc.cryptobook.us/\">https://toc.cryptobook.us/<\/a><\/li>\n<li>RFC 9293 TCP, RFC 8446 TLS 1.3, RFC 8200 IPv6.<\/li>\n<li>MIT 6.858 lecture notes/papers — <a href=\"https://ocw.mit.edu/courses/6-858-computer-systems-security-fall-2014/\">https://ocw.mit.edu/courses/6-858-computer-systems-security-fall-2014/<\/a><\/li>\n<li>AWS/Azure/Kubernetes/Docker/GitHub official security docs.<\/li>\n<li>Strategy: one chapter/paper per week, annotated notes, one practical mapping.<\/li>\n<\/ul>\n<h3 id=\"stage-2-papers-advisories-and-incident-reports-years-3-5\">Stage 2 — papers, advisories and incident reports (Years 3-5)<\/h3>\n<ul>\n<li>USENIX Security proceedings: <a href=\"https://www.usenix.org/conferences/byname/164\">https://www.usenix.org/conferences/byname/164<\/a><\/li>\n<li>IEEE S&amp;P / ACM CCS official proceedings pages: verify current conference site before citing.<\/li>\n<li>arXiv cs.CR preprints: <a href=\"https://arxiv.org/list/cs.CR/recent\">https://arxiv.org/list/cs.CR/recent<\/a> (preprints are not peer-reviewed truth).<\/li>\n<li>Google Project Zero: <a href=\"https://googleprojectzero.blogspot.com/\">https://googleprojectzero.blogspot.com/<\/a><\/li>\n<li>CISA advisories: <a href=\"https://www.cisa.gov/news-events/cybersecurity-advisories\">https://www.cisa.gov/news-events/cybersecurity-advisories<\/a><\/li>\n<li>CISA KEV: <a href=\"https://www.cisa.gov/known-exploited-vulnerabilities-catalog\">https://www.cisa.gov/known-exploited-vulnerabilities-catalog<\/a><\/li>\n<li>Vendor security advisories and post-incident reports from primary organizations.<\/li>\n<li>Strategy: compare at least two sources, extract claim/evidence/limitations, reproduce one safe measurement.<\/li>\n<\/ul>\n<h3 id=\"stage-3-standards-engineering-repositories-and-community-review-year-5\">Stage 3 — standards, engineering repositories and community review (Year 5+)<\/h3>\n<ul>\n<li>NIST SP 800-53r5, SP 800-63, SP 800-30, SP 800-34, SP 800-61r3, CSF 2.0.<\/li>\n<li>ISO/IEC 27001 official overview and legally obtained standard text; GDPR official text.<\/li>\n<li>OWASP ASVS, WSTG, Cheat Sheets, SAMM, Kubernetes Top 10, LLM Top 10.<\/li>\n<li>SLSA, OpenSSF Scorecard, SigmaHQ rule repository, Elastic detection rules, Suricata/Zeek rules, osquery, Falco, Trivy, Semgrep, Checkov.<\/li>\n<li>Strategy: read implementation issues, pull requests and release notes—not just README files.<\/li>\n<\/ul>\n<h2 id=\"7-safe-reproduction-and-responsible-disclosure\">7. Safe reproduction and responsible disclosure<\/h2>\n<p>Reproduce only with synthetic data, local systems you own, or explicitly authorized environments. Keep a written scope, abort condition and cleanup plan. Hash inputs, record versions and avoid executing unknown binaries on a host with personal data. For responsible disclosure: read the vendor/program policy first, keep evidence proportional, protect user data, avoid service disruption, agree on a timeline where possible, and publish only after a fix or coordinated disclosure. CVE/CVSS are communication tools, not proof of importance.<\/p>\n<h2 id=\"8-sustainable-excellence\">8. Sustainable excellence<\/h2>\n<p>Deep expertise requires health and feedback. Schedule recovery weeks, keep a maximum backlog rule, and reduce intensity during exams without breaking all study habits. Track leading indicators (hours on hard problems, experiments run, pages read, reviews received) and lagging indicators (working artifact, accepted contribution, reproducible finding). Ask one stronger person each quarter: \"What is the weakest part of my method?\" Record the answer and act on it.<\/p>\n<h2 id=\"9-reference-list-primary-links-used-throughout\">9. Reference list (primary links used throughout)<\/h2>\n<p>All resources are listed with full metadata in Volume 5. Core references: Harvard CS50 <a href=\"https://cs50.harvard.edu/\">https://cs50.harvard.edu/<\/a>, CS50 Cybersecurity <a href=\"https://cs50.harvard.edu/cybersecurity/\">https://cs50.harvard.edu/cybersecurity/<\/a>, OSTEP <a href=\"https://pages.cs.wisc.edu/~remzi/OSTEP/\">https://pages.cs.wisc.edu/~remzi/OSTEP/<\/a>, Jeremy's IT Lab <a href=\"https://www.youtube.com/playlist?list=PLxbwE86jKRgMpuZuLBivzlM8s2Dk5lXBQ\">https://www.youtube.com/playlist?list=PLxbwE86jKRgMpuZuLBivzlM8s2Dk5lXBQ<\/a>, Professor Messer <a href=\"https://www.professormesser.com/\">https://www.professormesser.com/<\/a>, Linux Journey <a href=\"https://linuxjourney.com/\">https://linuxjourney.com/<\/a>, OverTheWire <a href=\"https://overthewire.org/wargames/bandit/\">https://overthewire.org/wargames/bandit/<\/a>, Python docs <a href=\"https://docs.python.org/3/\">https://docs.python.org/3/<\/a>, Pro Git <a href=\"https://git-scm.com/book/en/v2\">https://git-scm.com/book/en/v2<\/a>, PortSwigger Academy <a href=\"https://portswigger.net/web-security\">https://portswigger.net/web-security<\/a>, OWASP <a href=\"https://owasp.org/\">https://owasp.org/<\/a>, pwn.college <a href=\"https://pwn.college/\">https://pwn.college/<\/a>, picoCTF/CyLab Academy <a href=\"https://www.cylabacademy.org/\">https://www.cylabacademy.org/<\/a>, MITRE ATT&amp;CK <a href=\"https://attack.mitre.org/\">https://attack.mitre.org/<\/a>, NIST CSF <a href=\"https://www.nist.gov/cyberframework\">https://www.nist.gov/cyberframework<\/a>, NIST NICE <a href=\"https://www.nist.gov/itl/applied-cybersecurity/nice\">https://www.nist.gov/itl/applied-cybersecurity/nice<\/a>, Microsoft Learn <a href=\"https://learn.microsoft.com/\">https://learn.microsoft.com/<\/a>, AWS Skill Builder <a href=\"https://skillbuilder.aws/\">https://skillbuilder.aws/<\/a>, Docker docs <a href=\"https://docs.docker.com/\">https://docs.docker.com/<\/a>, Kubernetes docs <a href=\"https://kubernetes.io/docs/\">https://kubernetes.io/docs/<\/a>, GitHub security docs <a href=\"https://docs.github.com/en/code-security\">https://docs.github.com/en/code-security<\/a>, SigmaHQ <a href=\"https://sigmahq.io/\">https://sigmahq.io/<\/a>, USENIX Security <a href=\"https://www.usenix.org/conferences/byname/164\">https://www.usenix.org/conferences/byname/164<\/a>, Project Zero <a href=\"https://googleprojectzero.blogspot.com/\">https://googleprojectzero.blogspot.com/<\/a>, CISA KEV <a href=\"https://www.cisa.gov/known-exploited-vulnerabilities-catalog\">https://www.cisa.gov/known-exploited-vulnerabilities-catalog<\/a>.<\/p>\n<h2 id=\"10-final-quality-and-ethical-statement\">10. Final quality and ethical statement<\/h2>\n<p>This curriculum was generated on 2026-10-27. It uses free/official resources wherever possible, flags paid resources, distinguishes older durable material from current official documentation, avoids invented timestamps/prices, and confines practical work to synthetic, owned or explicitly authorized environments. It makes no promise of top 1% status, employment, salary, immigration or certification success. Those outcomes depend on sustained deliberate practice, evidence, feedback, health, opportunity and ethical conduct.<\/p><h2 id=\"specialization-comparison-month-8-10-decision-aid\">Specialization comparison (Month 8-10 decision aid)<\/h2>\n<p>Score each row 1-5 for demonstrated interest, project results, programming comfort, local opportunity and available feedback. No path is \"best\" without your evidence.<\/p>\n<table>\n<thead>\n<tr>\n<th>Path<\/th>\n<th>Foundational knowledge<\/th>\n<th>Daily work<\/th>\n<th>Technical depth / programming<\/th>\n<th>Common tools<\/th>\n<th>Strong free resources<\/th>\n<th>Portfolio expectation<\/th>\n<th>Possible entry roles<\/th>\n<th>Long-term opportunities<\/th>\n<th>Typical prerequisites<\/th>\n<th>12-month limitation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Blue Team / SOC Analysis<\/td>\n<td>Networking, OS, logs, ATT&amp;CK<\/td>\n<td>Alert triage, investigation, escalation, reporting<\/td>\n<td>Medium; scripting helpful<\/td>\n<td>SIEM, KQL, EDR, ticketing<\/td>\n<td>Microsoft Learn, SigmaHQ, CyberDefenders, BTLO<\/td>\n<td>Alert investigation, incident report, detection tests<\/td>\n<td>SOC analyst, security analyst<\/td>\n<td>Detection lead, IR, threat hunting<\/td>\n<td>M1-M8 basics<\/td>\n<td>No real shift experience or production scale<\/td>\n<\/tr>\n<tr>\n<td>Detection Engineering<\/td>\n<td>Logs, OS internals, ATT&amp;CK, SQL/KQL<\/td>\n<td>Hypothesis, rule design, testing, tuning, deployment<\/td>\n<td>High; Python/YAML/SQL<\/td>\n<td>Sigma, KQL, Elastic rules, Git, CI<\/td>\n<td>SigmaHQ, KQL docs, Elastic rules, ATT&amp;CK<\/td>\n<td>Rule repo with labelled true/false positives and metrics<\/td>\n<td>Junior detection engineer, SOC analyst<\/td>\n<td>Detection platform/architecture, research<\/td>\n<td>Strong logs and programming<\/td>\n<td>Lab detections may not generalize to enterprise data<\/td>\n<\/tr>\n<tr>\n<td>DFIR<\/td>\n<td>Filesystems, Windows/Linux artifacts, evidence integrity<\/td>\n<td>Acquisition, timeline, artifact analysis, reporting<\/td>\n<td>High; scripting and OS internals<\/td>\n<td>Autopsy, KAPE-like tools, Volatility, Wireshark<\/td>\n<td>Autopsy, SANS webcasts, NIST 800-61r3, EVTX samples<\/td>\n<td>Disk/network/memory case with hash manifest<\/td>\n<td>Junior DFIR analyst, IR analyst<\/td>\n<td>Senior IR, forensic research, expert witness<\/td>\n<td>Evidence handling and OS internals<\/td>\n<td>No legal/casework or real incident pressure<\/td>\n<\/tr>\n<tr>\n<td>Web / API Security<\/td>\n<td>HTTP, auth, databases, secure coding<\/td>\n<td>Code review, testing, remediation, threat modelling<\/td>\n<td>High; one backend language<\/td>\n<td>Burp/ZAP, Semgrep, OWASP ASVS, CI<\/td>\n<td>PortSwigger, OWASP, MDN, GitHub security<\/td>\n<td>Secure app plus authorized assessment/remediation<\/td>\n<td>AppSec analyst, secure software engineer<\/td>\n<td>AppSec architecture, research, product security<\/td>\n<td>M1-M6 plus testing<\/td>\n<td>Advanced vulnerability classes need years<\/td>\n<\/tr>\n<tr>\n<td>Authorized Penetration Testing<\/td>\n<td>Networking, OS, web, scripting, ethics<\/td>\n<td>Scoped discovery, validation, reporting, retest<\/td>\n<td>Medium-high; scripting and OS<\/td>\n<td>Nmap, Burp, AD tools, reporting templates<\/td>\n<td>NIST 800-115, HTB free, pwn.college, local AD lab<\/td>\n<td>Professional scoped report and remediation retest<\/td>\n<td>Junior pentester, security consultant<\/td>\n<td>Senior pentest, red team, security research<\/td>\n<td>Strong M1-M7 + report writing<\/td>\n<td>Certification or CTF badges do not equal client judgement<\/td>\n<\/tr>\n<tr>\n<td>Cloud Security<\/td>\n<td>IAM, networking, logging, containers, shared responsibility<\/td>\n<td>Architecture review, policy, detection, incident response<\/td>\n<td>High; IaC and automation<\/td>\n<td>AWS/Azure docs, Trivy, Checkov, K8s<\/td>\n<td>AWS Security Pillar, Azure security, K8s docs<\/td>\n<td>Synthetic cloud review + IaC/CI hardening<\/td>\n<td>Cloud security analyst, DevSecOps junior<\/td>\n<td>Cloud security architect, platform engineering<\/td>\n<td>M1-M9 and Linux/Docker<\/td>\n<td>No production multi-account experience in Year 1<\/td>\n<\/tr>\n<tr>\n<td>Security Engineering<\/td>\n<td>Secure design, coding, identity, systems, automation<\/td>\n<td>Build controls, review architecture, write tools<\/td>\n<td>Very high; software engineering<\/td>\n<td>Git, CI, SAST/SCA, cloud, observability<\/td>\n<td>OWASP ASVS, GitHub docs, NIST, Security Engineering<\/td>\n<td>Maintained tool/library with tests and design doc<\/td>\n<td>Security engineer, platform security engineer<\/td>\n<td>Staff/principal security architect<\/td>\n<td>Strong CS and programming<\/td>\n<td>Breadth and production trade-offs take years<\/td>\n<\/tr>\n<tr>\n<td>GRC<\/td>\n<td>Risk, policy, controls, audits, privacy<\/td>\n<td>Assessments, evidence, exceptions, reports<\/td>\n<td>Low-medium technically; analysis-heavy<\/td>\n<td>GRC platforms, spreadsheets, NIST/ISO<\/td>\n<td>NIST CSF/SP, CIS Controls, GDPR text<\/td>\n<td>Risk register, control baseline, audit-style report<\/td>\n<td>GRC analyst, risk analyst, compliance associate<\/td>\n<td>Security governance lead, privacy, audit<\/td>\n<td>Business/legal context and strong writing<\/td>\n<td>Framework knowledge without operations is shallow<\/td>\n<\/tr>\n<tr>\n<td>Vulnerability Research<\/td>\n<td>C/assembly, OS, memory, protocols, fuzzing<\/td>\n<td>Root-cause analysis, PoC in authorized lab, disclosure<\/td>\n<td>Very high; C/Python/assembly<\/td>\n<td>Ghidra, GDB, pwntools, fuzzers, VMs<\/td>\n<td>pwn.college, OST2, MIT 6.858, Project Zero<\/td>\n<td>Reproduced bug class, detailed root-cause write-up<\/td>\n<td>Rare junior roles; often via internships/OSS<\/td>\n<td>Researcher, product security, exploit engineering<\/td>\n<td>Several years of low-level foundations<\/td>\n<td>Intro exposure is not research capability<\/td>\n<\/tr>\n<tr>\n<td>Malware Analysis / RE<\/td>\n<td>x86/x64, Windows internals, networking, scripting<\/td>\n<td>Triage, static/dynamic analysis, indicator extraction<\/td>\n<td>Very high; C/Python/assembly<\/td>\n<td>Ghidra, x64dbg, Wireshark, sandboxes<\/td>\n<td>OST2, Malware Unicorn RE101, pwn.college<\/td>\n<td>Safe synthetic sample analysis with isolation evidence<\/td>\n<td>Junior malware analyst, SOC/IR specialist<\/td>\n<td>Threat research, reverse engineering<\/td>\n<td>C/assembly and strict lab safety<\/td>\n<td>Real malware handling requires supervised environment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Decision framework:<\/strong> evidence weight 35%, genuine interest 20%, programming/technical fit 20%, available mentorship/opportunity 15%, opportunity cost 10%. Require at least two strong project results before selecting. Review after 90 days; switching early because a topic is hard is different from switching because evidence shows poor fit.<\/p>\n<p><strong>Recommendation for this profile:<\/strong> primary = Detection Engineering &amp; Security Automation; secondary = Cloud/Container Security. If Month 8-10 sprints contradict this, choose the path with stronger independent problem-solving evidence and better feedback access.<\/p><h1 id=\"printable-trackers-and-final-checklist-compact-edition\">Printable trackers and final checklist (compact edition)<\/h1>\n<h2 id=\"printable-trackers\">Printable trackers<\/h2>\n<h3 id=\"daily-checklist-copy-one-per-day\">Daily checklist (copy one per day)<\/h3>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">#<\/th>\n<th>Item<\/t function practical(d) {
  const t = esc(d.task);
  let core, standard, intensive;
  if (d.light) {
    core = `Light Core (~1 h): 20 min retrieval, 20 min minimal practical check — ${t} — and 10 min evidence.`;
    standard = `Light Standard (~1.5-2 h): ${core} Add one variation and one error-log correction.`;
    intensive = `Light Intensive (~2-3 h): ${standard} Add a blank-state repeat and a 100-word teach-back. Still a recovery day.`;
  } else {

}

let SIDX = null, sSel = 0, sItems = [];
function buildIndex() {
  SIDX = [];
  DAYS.forEach(d => SIDX.push({ k: 'D' + pad(d.global_day), t: d.topic, s: d.sequence + ' · ' + d.subtopics, h: ['d' + pad(d.global_day), 'day ' + d.global_day, d.topic, d.subtopics, d.objective, d.primary_title, d.task, d.sequence].join(' ').toLowerCase(), go: '#/day/' + d.global_day }));
  D.resources.forEach(r => SIDX.push({ k: r.id, t: r.title, s: r.type + ' · ' + r.path, h: [r.id, r.title, r.type, r.path, r.why, r.url].join(' ').toLowerCase(), res: r.id }));
  D.projects.forEach(p => SIDX.push({ k: p.id.replace('PRJ-', 'P-'), t: p.title, s: 'Project', h: [p.id, p.title, p.fields.map(f => f[1]).join(' ')].join(' ').toLowerCase(), go: '#/project/' + p.id }));
  D.guides.forEach(g => g.toc.forEach(([l, hid, t]) => SIDX.push({ k: 'GUIDE', t: t, s: g.title, h: (t + ' ' + g.title).toLowerCase(), go: '#/guide/' + g.id + '/' + hid })));
}
function runSearch(q) {
  if (!SIDX) buildIndex();
  const toks = q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  if (!toks.length) {
    const nd = nextDay();
    sItems = [{ k: 'NEXT', t: 'Continue: D' + pad(nd) + ' — ' + DAYS[nd - 1].topic, s: 'Aap ka agla din', go: '#/day/' + nd }, { k: 'GUIDE', t: 'Start Here', s: 'Exact websites & playlists', go: '#/guide/start' }, { k: 'RES', t: 'All resources', s: '169 entries', go: '#/resources' }, { k: 'PRJ', t: 'Projects', s: '15 deliverables', go: '#/projects' }];
  } else {
    sItems = SIDX.map(x => { let sc = 0; for (const t of toks) { const i = x.h.indexOf(t); if (i < 0) return null; sc += (x.t.toLowerCase().includes(t) ? 10 : 1) + (x.k.toLowerCase() === t ? 50 : 0); } return [sc, x]; }).filter(Boolean).sort((a, b) => b[0] - a[0]).slice(0, 40).map(a => a[1]);
  }
  sSel = 0;
  $('#qres').innerHTML = sItems.length ? sItems.map((x, i) => `<div class="sr ${i === 0 ? 'on' : ''}" data-i="${i}"><span class="k">${esc(x.k)}</span><div style="min-width:0"><div class="tt">${esc(x.t)}</div><div class="ss">${esc(x.s)}</div></div></div>`).join('') : '<div class="empty">Kuch nahi mila.</div>';
}
function openSearch() { $('#modal').classList.add('on'); $('#scrim').classList.add('on'); $('#q').value = ''; runSearch(''); setTimeout(() => $('#q').focus(), 30); }
function closeSearch() { $('#modal').classList.remove('on'); if (!$('#drawer').classList.contains('on')) $('#scrim').classList.remove('on'); }
function pickSearch(i) { const x = sItems[i]; if (!x) return; closeSearch(); if (x.res) openRes(x.res); else location.hash = x.go; }

/* ================= ROUTER ================= */
let timerInt = null, timerStart = null, timerDay = null;
function stopTimer(log) {
  if (timerInt) { clearInterval(timerInt); timerInt = null; }
  if (log && timerStart && timerDay) { const m = Math.round((Date.now() - timerStart) / 60000); if (m > 0) { dayState(timerDay).minutes += m; save(); toast(m + ' min logged for D' + pad(timerDay)); } else toast('1 minute se kam — log nahi hua'); }
  timerStart = null;
}
function route() {
  const h = (location.hash || '#/').slice(1);
  const parts = h.split('/').filter(Boolean);
  let html = '', crumb = '';
  if (timerInt && !(parts[0] === 'day' && parseInt(parts[1], 10) === timerDay)) stopTimer(true);
  switch (parts[0]) {
    case undefined: html = viewDashboard(); crumb = '<b>Dashboard</b>'; break;
    case 'today': location.replace('#/day/' + nextDay()); return;
    case 'plan': html = viewPlan(); crumb = '<b>365-day plan</b>'; break;
    case 'month': html = viewMonth(parts[1]); crumb = `<a href="#/plan">Plan</a> / <b>${parts[1] === '13' ? 'Final' : 'Month ' + esc(parts[1])}</b>`; break;
    case 'day': { const g = parseInt(parts[1], 10) || nextDay(); html = viewDay(g); const d = DAYS[Math.min(365, Math.max(1, g)) - 1]; crumb = `<a href="#/plan">Plan</a> / <a href="#/month/${d.m}">${d.m === 13 ? 'Final' : 'Month ' + d.m}</a> / <b>D${pad(d.global_day)}</b>`; break; }
    case 'resources': html = viewResources(parts[1]); crumb = '<b>Resources</b>'; break;
    case 'resource': html = viewResources(); crumb = '<b>Resources</b>'; setTimeout(() => openRes(parts[1]), 50); break;
    case 'projects': html = viewProjects(); crumb = '<b>Projects</b>'; break;
    case 'project': html = viewProject(parts[1]); crumb = `<a href="#/projects">Projects</a> / <b>${esc(parts[1])}</b>`; break;
    case 'guide': html = viewGuide(parts[1]); crumb = `Guides / <b>${esc(GUIDE[parts[1]] ? GUIDE[parts[1]].title : '')}</b>`; break;
    case 'pdfs': html = viewPdfs(); crumb = '<b>PDF library</b>'; break;
    case 'progress': html = viewProgress(); crumb = '<b>Progress & settings</b>'; break;
    default: html = viewDashboard(); crumb = '<b>Dashboard</b>';
  }
  $('#app').innerHTML = html + `<div class="foot">Cyber Study Hub · generated from the same verified data as the Ultimate Cybersecurity Master Blueprint 2026–2027 PDFs · resources checked ${esc(D.meta.verify_date)} · use only owned, synthetic or explicitly authorized lab targets</div>`;
  $('#crumbs').innerHTML = crumb;
  renderNav();
  $('#side').classList.remove('open');
  if (parts[0] === 'guide' && parts[2]) setTimeout(() => { const el = document.getElementById(parts[2]); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 30); else window.scrollTo(0, 0);
  bind(parts);
}
function bind(parts) {
  document.querySelectorAll('#md a[href^="http"], .md-links a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  if (parts[0] === 'day') {
    const g = Math.min(365, Math.max(1, parseInt(parts[1], 10) || nextDay()));
    document.querySelectorAll('[data-chk]').forEach(el => el.onclick = () => { const s = dayState(g); s.checks[el.dataset.chk] = !s.checks[el.dataset.chk]; if (CHECKS.every(c => s.checks[c[0]]) && !s.done) toast('Saare steps done — ab “Mark complete” dabayein'); save(); route(); });
    document.querySelectorAll('#scoreBtns [data-score]').forEach(el => el.onclick = () => { const s = dayState(g); const v = +el.dataset.score; s.score = s.score === v ? null : v; save(); route(); });
    document.querySelectorAll('#trackSeg [data-track]').forEach(el => el.onclick = () => { S.settings.track = el.dataset.track; save(); route(); });
    $('#doneBtn').onclick = () => { const s = dayState(g); s.done = !s.done; s.completedAt = s.done ? new Date().toISOString() : null; if (s.done) CHECKS.forEach(c => s.checks[c[0]] = true); save(); if (s.done) { toast('D' + pad(g) + ' complete! 🎉'); } route(); };
    let nt; $('#notes').oninput = e => { clearTimeout(nt); nt = setTimeout(() => { dayState(g).notes = e.target.value; save(); $('#noteSaved').textContent = 'Saved ✓ ' + new Date().toLocaleTimeString(); }, 400); };
    const tick = () => { const sec = Math.floor((Date.now() - timerStart) / 1000); const el = $('#timer'); if (el) el.textContent = pad(Math.floor(sec / 60), 2) + ':' + pad(sec % 60, 2); };
    if (timerInt && timerDay === g) tick();
    $('#tStart').onclick = () => { if (timerInt) return; timerDay = g; timerStart = Date.now(); timerInt = setInterval(tick, 1000); tick(); toast('Timer started — focus! 📚'); };
    $('#tStop').onclick = () => { if (!timerInt) return toast('Timer chal nahi raha'); stopTimer(true); route(); };
  }
  if (parts[0] === 'month' && $('#gSave')) {
    const m = parseInt(parts[1], 10);
    $('#gSave').onclick = () => { const sc = $('#gScore').value, sf = $('#gSafety').value; S.months[m] = { score: sc === '' ? null : Math.max(0, Math.min(100, +sc)), safety: sf === '' ? null : Math.max(0, Math.min(10, +sf)) }; save(); const pass = S.months[m].score >= 70 && (S.months[m].safety == null || S.months[m].safety >= 9); toast(S.months[m].score == null ? 'Cleared' : pass ? 'Gate passed ✓ — next month unlocked' : 'Repair protocol: Volume 6 → Six-step failure repair'); route(); };
  }
  if (parts[0] === 'resources' || parts[0] === 'resource') {
    renderResOut();
    $('#rq').oninput = e => { RF.q = e.target.value; renderResOut(); };
    $('#rcat').onchange = e => { RF.cat = e.target.value; renderResOut(); };
    $('#rcls').onchange = e => { RF.cls = e.target.value; renderResOut(); };
    $('#racc').onchange = e => { RF.acc = e.target.value; renderResOut(); };
    document.querySelectorAll('#rTabs [data-tab]').forEach(el => el.onclick = () => { RF.tab = el.dataset.tab; document.querySelectorAll('#rTabs button').forEach(b => b.classList.toggle('on', b === el)); renderResOut(); });
  }
  if (parts[0] === 'project' && PROJ[parts[1]]) {
    const id = parts[1]; const ps = () => (S.projects[id] = S.projects[id] || { status: 'todo', ms: {}, notes: '' });
    document.querySelectorAll('#pStat [data-st]').forEach(el => el.onclick = () => { ps().status = el.dataset.st; save(); route(); });
    document.querySelectorAll('[data-ms]').forEach(el => el.onclick = () => { const p = ps(); p.ms = p.ms || {}; p.ms[el.dataset.ms] = !p.ms[el.dataset.ms]; if (p.status === 'todo') p.status = 'doing'; save(); route(); });
    let nt; $('#pNotes').oninput = e => { clearTimeout(nt); nt = setTimeout(() => { ps().notes = e.target.value; save(); }, 400); };
  }
  if (parts[0] === 'guide') document.querySelectorAll('[data-goto]').forEach(a => a.onclick = () => { const el = document.getElementById(a.dataset.goto); if (el) el.scrollIntoView({ behavior: 'smooth' }); });
  if (parts[0] === 'month' && false) {}
  if (parts[0] === 'progress') {
    $('#sName').oninput = e => { S.settings.name = e.target.value; save(); };
    $('#sStart').onchange = e => { if (e.target.value) { S.settings.start = e.target.value; save(); toast('Dates shifted'); } };
    document.querySelectorAll('#sTrack [data-track]').forEach(el => el.onclick = () => { S.settings.track = el.dataset.track; save(); route(); });
    document.querySelectorAll('#sLab [data-lab]').forEach(el => el.onclick = () => { S.settings.lab = el.dataset.lab; save(); route(); });
    $('#exp').onclick = () => download('cyber-study-hub-backup-' + todayISO() + '.json', JSON.stringify(S, null, 1), 'application/json');
    $('#csv').onclick = () => { const rows = [['day', 'sequence', 'topic', 'done', 'completed_at', 'score', 'minutes', 'notes']].concat(DAYS.map(d => { const s = peekDay(d.global_day); return [d.global_day, d.sequence, d.topic, s.done ? 'yes' : 'no', s.completedAt || '', s.score == null ? '' : s.score, s.minutes || 0, (s.notes || '').replace(/\n/g, ' ')]; })); download('cyber-progress-' + todayISO() + '.csv', rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n'), 'text/csv'); };
    $('#imp').onclick = () => $('#importFile').click();
    $('#reset').onclick = () => { if (confirm('Saari progress delete ho jayegi. Pehle backup download kiya? Continue?')) { S = JSON.parse(JSON.stringify(DEF)); save(); toast('Progress reset'); route(); } };
  }
}
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); toast('Downloaded ' + name); }
$('#importFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o.days || !o.settings) throw 0; S = Object.assign(JSON.parse(JSON.stringify(DEF)), o); S.settings = Object.assign({}, DEF.settings, o.settings); save(); toast('Backup restored ✓'); route(); } catch (err) { alert('Yeh valid backup file nahi hai.'); } }; rd.readAsText(f); e.target.value = ''; };

/* ================= GLOBAL EVENTS ================= */
document.addEventListener('click', e => {
  const r = e.target.closest('[data-res]');
  if (r && !e.target.closest('a[target="_blank"]')) { e.preventDefault(); openRes(r.dataset.res); return; }
  const sr = e.target.closest('.sr'); if (sr) pickSearch(+sr.dataset.i);
});
$('#scrim').onclick = () => { closeDrawer(); closeSearch(); $('#scrim').classList.remove('on'); };
$('#searchBtn').onclick = openSearch;
$('#hamb').onclick = () => $('#side').classList.toggle('open');
$('#q').oninput = e => runSearch(e.target.value);
$('#q').onkeydown = e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sSel = Math.max(0, Math.min(sItems.length - 1, sSel + (e.key === 'ArrowDown' ? 1 : -1))); document.querySelectorAll('.sr').forEach((el, i) => el.classList.toggle('on', i === sSel)); const el = document.querySelector('.sr.on'); if (el) el.scrollIntoView({ block: 'nearest' }); }
  if (e.key === 'Enter') pickSearch(sSel);
};
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return; }
  if (e.key === 'Escape') { closeSearch(); closeDrawer(); $('#scrim').classList.remove('on'); return; }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); openSearch(); return; }
  const m = (location.hash || '').match(/^#\/day\/(\d+)/);
  if (m && !$('#drawer').classList.contains('on')) { const g = +m[1]; if (e.key === 'ArrowRight' && g < 365) location.hash = '#/day/' + (g + 1); if (e.key === 'ArrowLeft' && g > 1) location.hash = '#/day/' + (g - 1); }
});
function applyTheme() { document.documentElement.dataset.theme = S.settings.theme; }
$('#themeBtn').onclick = () => { S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); };
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', () => { if (timerInt) stopTimer(true); });
applyTheme();
route();
})();
</script>
</body>
